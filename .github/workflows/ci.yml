name: CI

on:
  # Pull requests only: a merge to main is the code its pull request already tested.
  # main's image is built by docker-publish. Run it by hand on any branch with workflow_dispatch.
  # Every pull request runs, because the ruleset requires these checks. A pull request that only
  # changes what CI cannot see skips the work instead (the changes job below).
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# actions: write is the model cache and the uploaded reports. Fork pull requests
# still cannot write the cache; GitHub drops that permission for them.
permissions:
  contents: read
  actions: write

jobs:
  # Changes CI cannot see: top-level *.md (Markdown under src/ and db/ is test or app input), docs/
  # and docker-publish.yml. A pull request with only those sets code=false, and the jobs below skip,
  # which the ruleset counts as passing (acceptance skips its steps instead: a skipped matrix job
  # reports an unexpanded name). A hand run has no base and always runs. If this job fails, code is
  # empty and everything runs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
      - id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --depth=1 origin "$BASE_SHA"
          changed=$(git diff --name-only "$BASE_SHA" HEAD)
          printf '%s\n' "$changed"
          code_files=$(printf '%s\n' "$changed" | grep -Ev '^([^/]+\.md|docs/.*|\.github/workflows/docker-publish\.yml)?$' || true)
          if [ -n "$code_files" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs changed; the jobs skip"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # GitHub-hosted runners. The repo is public, so these minutes are free.
  build:
    name: build, lint, typecheck
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Vitest --changed diffs against the pull request base. A default checkout is one
          # commit deep and does not have that commit.
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # One cache per job: each restores different projects, so a shared key would keep whichever job finished first.
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ github.job }}-${{ hashFiles('src/**/*.csproj', 'src/Directory.Build.props') }}
          restore-keys: nuget-${{ github.job }}-
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: src/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml
      - run: dotnet build src/ShipLean.slnx --configuration Release
      # llama.rn's postinstall downloads ~770 MB of native Android and iOS libraries. This job runs jest and a JS bundle
      # only, so it skips them; mobile-android-build installs without the flag and gets them.
      - run: pnpm install --frozen-lockfile
        working-directory: src
        env:
          RNLLAMA_SKIP_POSTINSTALL: "1"
      # The platform-neutral core the SPA (and the phone app) import as @shiplean/core. Its tests are few and run in
      # plain Node, so they always run in full.
      - name: Core format, lint, typecheck, test
        working-directory: src/ShipLean.Core.Client
        run: pnpm run format:check && pnpm run lint && pnpm run typecheck && pnpm test
      # The phone app (Expo). bundle is a Metro Android export: it proves every import resolves, with no device or
      # Android SDK. On a pull request the step runs only when the diff reaches what the app depends on: its own folder,
      # the core, the workspace files and the design tokens its theme is generated from.
      - name: Mobile format, lint, typecheck, vitest, jest, bundle
        working-directory: src/ShipLean.Mobile
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            changed=$(git diff --name-only "$BASE_SHA")
            if ! grep -Eq '^(src/(pnpm-lock\.yaml|package\.json|pnpm-workspace\.yaml)|src/ShipLean\.Mobile/.*|src/ShipLean\.Core\.Client/.*|design/tokens\.json|\.github/workflows/ci\.yml)$' <<<"$changed"; then
              echo "Skipping the mobile checks: this pull request changes nothing under src/ShipLean.Mobile, the core, the workspace files, design/tokens.json or ci.yml"
              exit 0
            fi
          fi
          # One command per line: under set -e a failure before the last command of an && list doesn't stop the script.
          pnpm run format:check
          pnpm run lint
          pnpm run typecheck
          pnpm test
          pnpm run test:screens
          pnpm run bundle
      # A hand run (workflow_dispatch) has no base, so it runs the whole suite. package.json and
      # vite.config.ts already make Vitest do that (--changed forceRerunTriggers). The workspace files,
      # the lockfile, the core package (outside the SPA's folder) and the token files do not:
      # tokens.test.ts reads the token files with readFileSync, which the import graph misses.
      - name: Format, lint, typecheck, vitest, build
        working-directory: src/ShipLean.Client
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # Test metrics (devex-telemetry). The token lets test reports past the IP lock; build and
          # bundle metrics are not sent from hosted runners, so VITE_ENDPOINT stays unset.
          VITEST_METRICS_ENDPOINT: https://devmetrics.dicko.dev:18888/vitest
          DEVFEEDBACK_TEST_TOKEN: ${{ secrets.DEVFEEDBACK_TEST_TOKEN }}
        run: |
          set -euo pipefail
          pnpm run format:check
          pnpm run lint
          pnpm run typecheck
          if [ "$EVENT_NAME" != "pull_request" ]; then
            pnpm test
          else
            changed=$(git diff --name-only "$BASE_SHA")
            if printf '%s\n' "$changed" | grep -Eq '^(src/(package\.json|pnpm-workspace\.yaml|pnpm-lock\.yaml)|src/ShipLean\.Core\.Client/.*|src/ShipLean.Client/(tsconfig\.json|src/styles/tokens\.css)|design/tokens\.css)$'; then
              echo "Change is outside Vitest's import graph; running the full suite"
              pnpm test
            else
              echo "Vitest --changed ${BASE_SHA}"
              # pnpm forwards these arguments. A "--" before them is passed through to
              # vitest, which then treats --changed as a file filter and runs everything.
              pnpm test --changed "$BASE_SHA" --passWithNoTests
            fi
          fi
          pnpm run build

  # The phone app's Android debug build from prebuild, so a native module or config plugin that doesn't compile fails CI.
  # On a pull request it runs only when the diff reaches the native side: the app's package.json, the lockfile, the
  # workspace file (allowBuilds decides which native postinstalls run), app.json or app.config.ts, the app's local
  # modules, or ci.yml. Otherwise it passes with a message. android/ is generated here and never committed.
  # arm64-v8a is the phones; x86_64 is the emulator. Both are the ABIs llama.rn ships prebuilt.
  mobile-android-build:
    name: mobile android build
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: native
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            changed=$(git diff --name-only "$BASE_SHA")
            if ! grep -Eq '^(src/ShipLean\.Mobile/(package\.json|app\.json|app\.config\.ts|react-native\.config\.js|modules/.*|assets/.*)|src/(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml)|\.github/workflows/ci\.yml)$' <<<"$changed"; then
              echo "Skipping the Android build: this pull request changes nothing native (the app's package.json, the lockfile, the workspace file, app.json, app.config.ts, modules/ or ci.yml)"
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        if: steps.native.outputs.run == 'true'
        with:
          package_json_file: src/package.json
      - uses: actions/setup-node@v4
        if: steps.native.outputs.run == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        if: steps.native.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        if: steps.native.outputs.run == 'true'
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ github.job }}-${{ hashFiles('src/pnpm-lock.yaml', 'src/ShipLean.Mobile/app.json') }}
          restore-keys: gradle-${{ github.job }}-
      - run: pnpm install --frozen-lockfile
        if: steps.native.outputs.run == 'true'
        working-directory: src
      - run: npx expo prebuild --platform android --no-install --clean
        if: steps.native.outputs.run == 'true'
        working-directory: src/ShipLean.Mobile
      - run: ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64
        if: steps.native.outputs.run == 'true'
        working-directory: src/ShipLean.Mobile/android

  unit:
    name: unit tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # One cache per job: each restores different projects, so a shared key would keep whichever job finished first.
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ github.job }}-${{ hashFiles('src/**/*.csproj', 'src/Directory.Build.props') }}
          restore-keys: nuget-${{ github.job }}-
      - run: dotnet test src/ShipLean.UnitTest --configuration Release
        env:
          NUNIT_METRICS_ES_ENDPOINT: https://devmetrics.dicko.dev:18888/dotnet/nunit
          DEVFEEDBACK_TEST_TOKEN: ${{ secrets.DEVFEEDBACK_TEST_TOKEN }}

  api:
    name: API tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    # SHIPLEAN_TEST_DB is unset, so the tests start a postgres:18 Testcontainers container.
    # ubuntu-latest provides Docker, which Testcontainers uses.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # pg_dump 18 for the backup tests (the server is Postgres 18). The runner has an older client, so 18's bin goes first on PATH.
      - name: Install postgresql-client-18 (PGDG)
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      # One cache per job: each restores different projects, so a shared key would keep whichever job finished first.
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ github.job }}-${{ hashFiles('src/**/*.csproj', 'src/Directory.Build.props') }}
          restore-keys: nuget-${{ github.job }}-
      # The search embedding model: cached on the fetch script, its manifest and the model's metadata (the script
      # checks every SHA-256 either way), then handed to the tests through the same variable the image sets.
      # The files are public on Hugging Face; no token.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/shiplean-models
          key: embedding-model-${{ hashFiles('scripts/fetch-embedding-model.sh', 'scripts/embedding-model.manifest', 'scripts/shiplean-model.json') }}
      - run: |
          scripts/fetch-embedding-model.sh "$HOME/.cache/shiplean-models/multilingual-e5-small"
          echo "SHIPLEAN_EMBEDDINGS_MODEL_PATH=$HOME/.cache/shiplean-models/multilingual-e5-small" >> "$GITHUB_ENV"
      # Each test class starts its own Kestrel host. Four workers matches the runner's 4 vCPUs.
      # Search tests load the embedding model, so they stay in their own process.
      # GitHub-hosted runners have 16 GB, so the 1 GiB heap cap the home runners needed is not set.
      - run: dotnet build src/ShipLean.WebApi.Tests --configuration Release && dotnet build-server shutdown
      - run: dotnet test src/ShipLean.WebApi.Tests --configuration Release --no-build --filter "FullyQualifiedName!~ShipLean.WebApi.Tests.Search." -- NUnit.NumberOfTestWorkers=4
        env:
          NUNIT_METRICS_ES_ENDPOINT: https://devmetrics.dicko.dev:18888/dotnet/nunit
          DEVFEEDBACK_TEST_TOKEN: ${{ secrets.DEVFEEDBACK_TEST_TOKEN }}
      - if: success() || failure()
        run: dotnet test src/ShipLean.WebApi.Tests --configuration Release --no-build --filter "FullyQualifiedName~ShipLean.WebApi.Tests.Search." -- NUnit.NumberOfTestWorkers=4
        env:
          NUNIT_METRICS_ES_ENDPOINT: https://devmetrics.dicko.dev:18888/dotnet/nunit
          DEVFEEDBACK_TEST_TOKEN: ${{ secrets.DEVFEEDBACK_TEST_TOKEN }}

  component:
    name: component tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    # Same image used to generate the committed screenshot snapshots. The
    # GitHub-hosted runner image and this container ship different font
    # packages even on matching Ubuntu versions, which is enough to break
    # every screenshot assertion; running inside the image itself is what
    # reliably matches.
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-resolute
    defaults:
      run:
        working-directory: src/ShipLean.Client
    steps:
      - uses: actions/checkout@v4
        with:
          # Playwright --only-changed diffs against the pull request base. A default checkout
          # is one commit deep and does not have that commit.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: src/package.json
      # Only the SPA and what it depends on (the core), not the phone app.
      - run: pnpm install --frozen-lockfile --filter shiplean-client...
      # Playwright's default is half the visible CPUs (2 on a 4-vCPU runner). Pin it.
      # --only-changed follows what a spec's components import. The harness (playwright/),
      # global CSS, and the CT config wrap every mount and are not in that graph, so a
      # change to them runs the whole suite. A pull request that does not touch the client
      # skips the run: the flag would otherwise still build the component bundle to find
      # nothing. A hand run has no base and runs everything.
      - name: Playwright component tests
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # The job container runs as root and the checkout belongs to the runner, so Git
          # treats the worktree as unsafe. `git diff` then exits 129 with "not a git
          # repository". Playwright --only-changed invokes git too, so the exception is
          # set on the step.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: ${{ github.workspace }}
          PLAYWRIGHT_METRICS_ENDPOINT: https://devmetrics.dicko.dev:18888/playwright
          DEVFEEDBACK_TEST_TOKEN: ${{ secrets.DEVFEEDBACK_TEST_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            pnpm run test-ct --workers=2
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA")
          if printf '%s\n' "$changed" | grep -Eq '^src/((package\.json|pnpm-workspace\.yaml|pnpm-lock\.yaml)$|ShipLean\.Core\.Client/|ShipLean.Client/(playwright-ct\.config\.ts|playwright/|tsconfig\.json|package\.json|src/index\.css|src/styles/))'; then
            echo "Change is outside Playwright's component graph; running the full suite"
            pnpm run test-ct --workers=2
          elif printf '%s\n' "$changed" | grep -q '^src/ShipLean.Client/'; then
            echo "Playwright --only-changed ${BASE_SHA}"
            pnpm run test-ct --workers=2 --only-changed="$BASE_SHA"
          else
            echo "No files under src/ShipLean.Client changed; skipping component tests"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: src/ShipLean.Client/playwright-report/
          retention-days: 14

  acceptance:
    name: acceptance (${{ matrix.group }})
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Shards are namespaces, so later work adds tests under these namespaces and never edits this file.
        # They are grouped into two jobs because each job spends ~1.5 min on setup (client bundle, build,
        # Chromium) for a few seconds of tests.
        # Each shard still runs in its own `dotnet test`, so a test host's memory is what one shard needs.
        # `Other` runs every test outside the listed namespaces (a new area's namespace lands there until it
        # gets a shard), so nothing is silently skipped. A shard with no tests passes (dotnet test exits 0).
        include:
          - group: 1
            shards: Harness Journeys Lanes.Shell Lanes.Backlog Lanes.Sprints Lanes.WorkItem
          - group: 2
            shards: Lanes.Board Lanes.BoardSettings Lanes.Taskboard Lanes.Settings Lanes.Import Other
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code != 'false'
      - uses: actions/setup-dotnet@v4
        if: needs.changes.outputs.code != 'false'
        with:
          dotnet-version: 10.0.x
      # pg_dump 18 for the backup tests (the server is Postgres 18). The runner has an older client, so 18's bin goes first on PATH.
      - name: Install postgresql-client-18 (PGDG)
        if: needs.changes.outputs.code != 'false'
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      # One cache per job: each restores different projects, so a shared key would keep whichever job finished first.
      - uses: actions/cache@v4
        if: needs.changes.outputs.code != 'false'
        with:
          path: ~/.nuget/packages
          key: nuget-${{ github.job }}-${{ hashFiles('src/**/*.csproj', 'src/Directory.Build.props') }}
          restore-keys: nuget-${{ github.job }}-
      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.code != 'false'
        with:
          package_json_file: src/package.json
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.code != 'false'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml
      # The tests serve the real bundle, so it is built first (into ShipLean.WebApi/wwwroot).
      - run: pnpm install --frozen-lockfile --filter shiplean-client... && pnpm run build
        if: needs.changes.outputs.code != 'false'
        working-directory: src/ShipLean.Client
      - run: dotnet build src/ShipLean.AcceptanceTests --configuration Release
        if: needs.changes.outputs.code != 'false'
      # No --with-deps: the runner image already has Chromium's libraries, and the extra apt packages (fonts, xvfb)
      # sometimes took over 10 minutes from a slow Ubuntu mirror. These tests are headless and take no screenshots.
      - run: pwsh src/ShipLean.AcceptanceTests/bin/Release/net10.0/playwright.ps1 install chromium
        if: needs.changes.outputs.code != 'false'
      - name: dotnet test (${{ matrix.shards }})
        if: needs.changes.outputs.code != 'false'
        env:
          SHARDS: ${{ matrix.shards }}
          NUNIT_METRICS_ES_ENDPOINT: https://devmetrics.dicko.dev:18888/dotnet/nunit
          DEVFEEDBACK_TEST_TOKEN: ${{ secrets.DEVFEEDBACK_TEST_TOKEN }}
        # Every shard runs even after one fails; the step fails at the end, naming the failed shards.
        # The trailing dot keeps Lanes.Board from also matching Lanes.BoardSettings.
        run: |
          failed=""
          for shard in $SHARDS; do
            if [ "$shard" = "Other" ]; then
              filter=""
              for ns in Harness Journeys Lanes.Shell Lanes.Backlog Lanes.Sprints Lanes.WorkItem Lanes.Board Lanes.BoardSettings Lanes.Taskboard Lanes.Settings Lanes.Import; do
                filter="${filter:+$filter&}FullyQualifiedName!~ShipLean.AcceptanceTests.$ns."
              done
            else
              filter="FullyQualifiedName~ShipLean.AcceptanceTests.$shard."
            fi
            echo "::group::$shard"
            dotnet test src/ShipLean.AcceptanceTests --configuration Release --no-build --filter "$filter" || failed="$failed $shard"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::Failed shards:$failed"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ matrix.group }}
          path: artifacts/playwright-traces/
          if-no-files-found: ignore
          retention-days: 14

  image:
    name: docker image build
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GitHub-hosted runners have no persistent Docker layer cache. The container
      # driver can export one to the Actions cache; the docker driver cannot.
      # provenance and sbom must be off: the docker exporter (load: true) rejects attestations.
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Dockerfile
          push: false
          load: true
          provenance: false
          sbom: false
          tags: shiplean:ci
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
      - name: Check the model is in the image
        # sha256sum runs as $APP_UID, so this also proves the files are readable by the app user.
        run: docker run --rm --entrypoint sha256sum shiplean:ci /app/models/multilingual-e5-small/model.onnx /app/models/multilingual-e5-small/sentencepiece.bpe.model /app/models/multilingual-e5-small/shiplean-model.json
      # The backup CLI verbs answer before the web host is built (no arguments = usage, exit 2), and the image's pg_dump is 18.
      - name: Check the backup CLI and pg_dump
        run: |
          set -u
          status=0
          docker run --rm shiplean:ci decrypt-backup || status=$?
          [ "$status" -eq 2 ] || { echo "expected decrypt-backup to exit 2, got $status"; exit 1; }
          version=$(docker run --rm --entrypoint pg_dump shiplean:ci --version)
          echo "$version"
          echo "$version" | grep -Eq '^pg_dump \(PostgreSQL\) 18\.' || { echo "expected pg_dump 18"; exit 1; }
      # Smoke: the image starts against a real Postgres and serves. Everything runs on one user-defined network and
      # the checks come from a curl container on it. The app migrates once at startup and exits if Postgres is not
      # ready yet, so the app restarts on failure (the restart loop plus curl's retries wait for Postgres; the health check on Postgres is for inspection).
      - name: Smoke-test the image
        env:
          NET: shiplean-ci
          CURL: curlimages/curl:8.11.1
        run: |
          set -eu
          docker network create "$NET"
          docker run -d --name ci-postgres --network "$NET" --network-alias postgres \
            -e POSTGRES_DB=shiplean -e POSTGRES_PASSWORD=postgres \
            --health-cmd "pg_isready -U postgres -d shiplean" --health-interval 2s --health-retries 30 \
            postgres:18
          docker run -d --name ci-app --network "$NET" --network-alias app --restart on-failure:20 \
            -e "SHIPLEAN_DB_CONNECTION=Host=postgres;Port=5432;Database=shiplean;Username=postgres;Password=postgres" \
            -e SHIPLEAN_ADMIN_EMAIL=admin@example.com \
            -e SHIPLEAN_ADMIN_PASSWORD=smoke-test-password \
            shiplean:ci
          c() { docker run --rm --network "$NET" "$CURL" "$@"; }
          health=$(c -sS --retry 30 --retry-connrefused --retry-delay 2 --retry-all-errors --fail http://app:8080/health)
          echo "$health"
          # Embeddings are on by default, so the image must load its baked-in model.
          echo "$health" | grep -q '"search":{"mode":"semantic"' || { echo "expected search mode semantic in /health"; exit 1; }
          login=$(c -sS --fail http://app:8080/login)
          echo "$login" | grep -q '<div id="root">'
          root=$(c -sS -o /dev/null -w '%{http_code} %{redirect_url}' http://app:8080/)
          echo "GET / -> $root"
          case "$root" in 302\ *'/login'*) ;; *) echo "expected a 302 to /login"; exit 1 ;; esac
          c -sS --fail -X POST -H 'Content-Type: application/json' \
            -d '{"email":"admin@example.com","password":"smoke-test-password"}' http://app:8080/api/auth/login
          echo
      - name: Show the app log
        if: failure()
        run: |
          docker logs ci-app || true
          docker logs ci-postgres || true
      - name: Remove the smoke containers
        if: always()
        run: |
          docker rm -f ci-app ci-postgres || true
          docker network rm shiplean-ci || true
