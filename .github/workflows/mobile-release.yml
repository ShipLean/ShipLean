name: Mobile release

# Builds the phone app on EAS and, by default, submits it: iOS to TestFlight, Android to the
# Play internal track, rolled out to internal testers (src/ShipLean.Mobile/eas.json, submit.production).
# With `listing` it also pushes the store listing from store/.
# Run by hand only: a run with `build` uses EAS build credits and bumps the build number.
# The build job waits for EAS and saves what it built (the Android .aab, the iOS .ipa) as the
# run's `app-builds` artifact, kept 90 days, so a release's files can be downloaded and inspected.
# Version: major.minor come from expo.version in src/ShipLean.Mobile/app.json (change them by
# hand); the patch is this workflow's run number (github.run_number), so each release is higher
# with no commit (store/app_version.py). The build number (iOS) and version code (Android) are
# EAS's own counters (eas.json: appVersionSource remote, autoIncrement).
#
# Needs these GitHub secrets and variable:
#   EXPO_TOKEN                        an Expo robot token for the dickos-team account (build job).
#   ASC_API_KEY_ID, ASC_API_KEY_ISSUER_ID, ASC_API_KEY_P8
#                                     the App Store Connect API key (listing-ios job).
#   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON  the Play service account key (listing-android job).
#   STORE_IOS_RUNNER (variable)       runner label for listing-ios; empty means ubuntu-latest.
# The build's signing credentials and its store submission keys live on EAS, set up once with
# `eas credentials`; they are not GitHub secrets. The listing jobs push store/ and the exported
# images with fastlane (see store/README.md); Apple takes name, subtitle, keywords and
# screenshots only on an editable version.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [all, ios, android]
        default: all
      build:
        description: Build the app on EAS (untick for a listing-only run)
        type: boolean
        default: true
      submit:
        description: Submit to TestFlight / Play internal testing when the build finishes
        type: boolean
        default: true
      listing:
        description: >-
          Push the store listing (store/ and the exported images) to the App Store and Google
          Play. Apple takes name, subtitle, keywords and screenshots only on an editable version.
        type: boolean
        default: true

concurrency:
  group: mobile-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    if: ${{ !inputs.build && !inputs.listing }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: |
          echo "::error::Nothing to do: tick build, listing or both."
          exit 1

  build:
    if: ${{ inputs.build }}
    runs-on: ubuntu-latest
    steps:
      - name: Check EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the EXPO_TOKEN repository secret (an Expo robot token) first."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: src/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml
      # eas-cli reads the app config and computes the fingerprint locally, which needs the app's packages.
      - run: pnpm install --frozen-lockfile
        working-directory: src
      # Written into this checkout's app.json only: EAS uploads the working tree, uncommitted
      # changes included (no requireCommit in eas.json), so the build gets this version.
      - name: Set the version
        env:
          APP_VERSION_PATCH: ${{ github.run_number }}
        run: |
          version=$(python3 -I store/app_version.py --write)
          echo "Building version $version" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      # --wait keeps the job until EAS has finished the builds (and, with submit, the submissions), so
      # their files can be saved below. --json prints the finished builds on stdout, each with its
      # file's URL (artifacts.buildUrl); progress goes to stderr. eas-cli prints the JSON before it
      # exits non-zero for a failed build or submission, so the status is kept and the files saved
      # first.
      - name: Build${{ inputs.submit && ' and submit' || '' }}
        id: eas
        working-directory: src/ShipLean.Mobile
        env:
          PLATFORM: ${{ inputs.platform }}
          SUBMIT: ${{ inputs.submit }}
        run: |
          args=(--platform "$PLATFORM" --profile production --non-interactive --wait --json)
          if [ "$SUBMIT" = "true" ]; then
            args+=(--auto-submit)
          fi
          status=0
          eas build "${args[@]}" > "$RUNNER_TEMP/builds.json" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Download the built files
        if: ${{ !cancelled() && steps.eas.outcome == 'success' }}
        run: |
          python3 -I - "$RUNNER_TEMP/builds.json" "$RUNNER_TEMP/app-builds" <<'PY'
          import json, os, posixpath, sys, urllib.parse, urllib.request
          source, out = sys.argv[1], sys.argv[2]
          text = open(source).read().strip()
          builds = json.loads(text) if text else []
          os.makedirs(out, exist_ok=True)
          for build in builds:
              url = (build.get("artifacts") or {}).get("buildUrl")
              if not url:
                  print("No file for build {} ({})".format(build.get("id"), build.get("status")))
                  continue
              platform = build["platform"].lower()
              extension = posixpath.splitext(urllib.parse.urlsplit(url).path)[1] or ".bin"
              name = "shiplean-{}-{}-{}{}".format(platform, build.get("appVersion"), build.get("appBuildVersion"), extension)
              # expo.dev answers Python's default User-Agent (Python-urllib) with 403 Forbidden.
              request = urllib.request.Request(url, headers={"User-Agent": "shiplean-mobile-release"})
              with urllib.request.urlopen(request) as response, open(os.path.join(out, name), "wb") as handle:
                  while chunk := response.read(1 << 20):
                      handle.write(chunk)
              print("Saved", name)
          PY
      - name: Save the built files
        if: ${{ !cancelled() && steps.eas.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-builds
          path: ${{ runner.temp }}/app-builds
          if-no-files-found: warn
          retention-days: 90
      - name: Fail when EAS failed
        if: ${{ steps.eas.outputs.status != '0' }}
        env:
          STATUS: ${{ steps.eas.outputs.status }}
        run: |
          echo "::error::eas build exited with $STATUS: a build or submission failed (see the Build step and expo.dev)."
          exit 1

  # The listing jobs do not need the build, so they run beside it: the listing goes to the
  # current editable version, and Play takes listing changes without a new binary.
  listing-android:
    if: ${{ inputs.listing && inputs.platform != 'ios' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
        env:
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_JSON" ]; then
            echo "::error::Add the GOOGLE_PLAY_SERVICE_ACCOUNT_JSON repository secret first."
            exit 1
          fi
      - uses: ./.github/actions/store-listing-setup
        id: setup
        with:
          play_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      - name: Push the Google Play listing
        env:
          STAGED: ${{ steps.setup.outputs.staged }}
          PLAY_KEY_PATH: ${{ steps.setup.outputs.play_key_path }}
        run: store/push_listing.sh android push

  listing-ios:
    if: ${{ inputs.listing && inputs.platform != 'android' }}
    runs-on: ${{ vars.STORE_IOS_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check the App Store Connect secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          missing=()
          [ -n "$ASC_KEY_ID" ] || missing+=(ASC_API_KEY_ID)
          [ -n "$ASC_ISSUER_ID" ] || missing+=(ASC_API_KEY_ISSUER_ID)
          [ -n "$ASC_KEY_P8" ] || missing+=(ASC_API_KEY_P8)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Add the missing repository secret(s) first: ${missing[*]}"
            exit 1
          fi
      - uses: ./.github/actions/store-listing-setup
        id: setup
        with:
          asc_key_id: ${{ secrets.ASC_API_KEY_ID }}
          asc_issuer_id: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
          asc_key_p8: ${{ secrets.ASC_API_KEY_P8 }}
      - name: Push the App Store listing
        env:
          STAGED: ${{ steps.setup.outputs.staged }}
          ASC_KEY_PATH: ${{ steps.setup.outputs.asc_key_path }}
          # Only when this run builds: the listing then goes to the new build's version. A
          # listing-only run updates the version that is editable now.
          APP_VERSION_PATCH: ${{ inputs.build && github.run_number || '' }}
        run: store/push_listing.sh ios push
