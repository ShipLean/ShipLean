# Checks the store listing (store/ and the exported images) on pull requests that touch it.
# Not a required check in the ruleset: the workflow is path-filtered, and a required check
# from a path-filtered workflow would sit pending on every pull request that doesn't touch it.
name: Store listing

on:
  pull_request:
    paths:
      - store/**
      - design/appstore/exports/**
      - .github/workflows/store-listing.yml
      - .github/actions/store-listing-setup/**
  workflow_dispatch:

concurrency:
  group: store-listing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: python3 -I -m unittest discover -s store/tests -v
      # No secrets: proves Ruby, the bundle and the image staging work, and that no key is written.
      - id: setup
        uses: ./.github/actions/store-listing-setup
      - name: Check the listing limits and images
        run: python3 -I store/check_listing.py --staged "${{ steps.setup.outputs.staged }}"
      - name: Check the setup outputs
        env:
          STAGED: ${{ steps.setup.outputs.staged }}
          ASC_KEY_PATH: ${{ steps.setup.outputs.asc_key_path }}
          PLAY_KEY_PATH: ${{ steps.setup.outputs.play_key_path }}
        run: |
          set -euo pipefail
          for dir in "$STAGED/ios/screenshots/en-US" "$STAGED/android/metadata"; do
            if [ ! -d "$dir" ]; then
              echo "::error::The setup action did not stage $dir"
              exit 1
            fi
          done
          if [ -n "$ASC_KEY_PATH" ] || [ -n "$PLAY_KEY_PATH" ]; then
            echo "::error::The setup action wrote a key file with no key inputs"
            exit 1
          fi

  # The dry runs need a store secret, which fork pull requests don't get: the job then ends green
  # after one notice. They never write to a store: Play validates the whole edit and discards it;
  # the App Store run only downloads the current listing (store/README.md, "What the dry run proves").
  verify-android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - id: gate
        env:
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -n "$PLAY_JSON" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The Google Play dry run was skipped: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not available (fork pull requests get no secrets)."
          fi
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
      - id: setup
        if: steps.gate.outputs.run == 'true'
        uses: ./.github/actions/store-listing-setup
        with:
          play_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      - name: Google Play dry run (validate only)
        if: steps.gate.outputs.run == 'true'
        env:
          STAGED: ${{ steps.setup.outputs.staged }}
          PLAY_KEY_PATH: ${{ steps.setup.outputs.play_key_path }}
        run: store/push_listing.sh android verify

  verify-ios:
    needs: check
    runs-on: ${{ vars.STORE_IOS_RUNNER || 'ubuntu-latest' }}
    steps:
      # Skips only when none of the three secrets is set. A partial set runs the setup action,
      # which fails naming the missing value (store/write_keys.py).
      - id: gate
        env:
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "$ASC_KEY_ID" ] && [ -z "$ASC_ISSUER_ID" ] && [ -z "$ASC_KEY_P8" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The App Store dry run was skipped: the ASC_API_KEY_* secrets are not available (fork pull requests get no secrets)."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
      - id: setup
        if: steps.gate.outputs.run == 'true'
        uses: ./.github/actions/store-listing-setup
        with:
          asc_key_id: ${{ secrets.ASC_API_KEY_ID }}
          asc_issuer_id: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
          asc_key_p8: ${{ secrets.ASC_API_KEY_P8 }}
      - name: App Store dry run (download the current listing)
        if: steps.gate.outputs.run == 'true'
        env:
          STAGED: ${{ steps.setup.outputs.staged }}
          ASC_KEY_PATH: ${{ steps.setup.outputs.asc_key_path }}
        run: store/push_listing.sh ios verify
