# The OpenTelemetry collector of the Inspection test stack (and of scripts/inspection-stack.sh). Agents' OTLP lands here; the
# collector writes traces and logs to ClickHouse (the clickhouse exporter creates the schema), traces to Tempo and logs to Loki.
# Host names are the container aliases on the stack's network. Retention matches the product's 30 day default.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 200ms

exporters:
  clickhouse:
    endpoint: tcp://clickhouse:9000
    username: shiplean
    password: shiplean
    database: otel
    create_schema: true
    ttl: 720h
    traces_table_name: otel_traces
    logs_table_name: otel_logs
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 60s
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlp_http/loki:
    endpoint: http://loki:3100/otlp

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhouse, otlp_grpc/tempo]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhouse, otlp_http/loki]
