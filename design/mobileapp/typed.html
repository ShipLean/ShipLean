<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<!--
  Typed fallback on the phone app (SHIP-905, voice model from SHIP-906): what happens to text typed into the dock's
  "Type a note" field. The field says before you send whether the text posts straight away (a note, like the web's
  Comment box) or goes through the same preview as a voice command. Drawn on the SHIP-906 work item.
  Design notes and decisions: typed.md. ?state=<id>&theme=light|dark, ?list for ids.
-->
<link rel="stylesheet" href="app.css"><script src="app.js"></script>
<style>
/* Work item backdrop (a trimmed copy of work-item.html) */
.wi-head h1, .status-card .line, .vnote .text { overflow-wrap: anywhere; min-width: 0; }
.wi-head { padding: 14px var(--app-gutter) 14px; background: var(--color-surface); border-bottom: 1px solid var(--color-border); }
.wi-head .k { display: flex; align-items: center; gap: 6px; font-size: var(--app-text-sm); color: var(--color-muted); }
.wi-head h1 { font-size: var(--app-text-lg); line-height: 1.25; font-weight: 650; margin: 6px 0 10px; letter-spacing: -.01em; }
.wi-head .pills { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: var(--app-text-sm); color: var(--color-muted); }
.wi-head .pills .who { display: inline-flex; align-items: center; gap: 6px; }
.status-card { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--color-border); }
.status-card .line { font-size: var(--app-text); }
.notes-h { display: flex; gap: 8px; padding: 0 var(--app-gutter) 10px; }
.notes-h .chip { height: 30px; }
.event { display: flex; align-items: center; gap: 8px; padding: 9px var(--app-gutter) 9px 54px; font-size: var(--app-text-sm); color: var(--color-muted); background: var(--color-surface); border-bottom: 1px solid var(--color-border); }
.event b { color: var(--color-text); font-weight: 500; }
.vnote.new { background: var(--voice-soft); }
.vnote.pending { background: var(--color-surface-2); }
.vnote.pending .text { color: var(--color-muted); }
.wait { display: inline-flex; align-items: center; gap: 4px; font-size: var(--app-text-xs); font-weight: 600; color: var(--color-muted); white-space: nowrap; }
.agent-tag { font-size: 10.5px; font-weight: 600; color: var(--color-info); background: color-mix(in srgb, var(--color-info) 14%, transparent); border-radius: 4px; padding: 1px 5px; }
.mention { color: var(--color-accent); font-weight: 500; }
.banner.off { background: var(--ask-soft); border-color: transparent; align-items: flex-start; }
.banner.off b, .banner.dl b { display: block; font-size: var(--app-text); font-weight: 600; }
.banner.off .grow, .banner.dl .grow { min-width: 0; }
.banner.off > svg { color: var(--ask); margin-top: 1px; }
.banner.dl { align-items: flex-start; }
.banner.dl > svg { color: var(--voice); margin-top: 1px; }
.banner.dl .bar { height: 4px; border-radius: 2px; background: var(--color-surface-2); margin-top: 8px; overflow: hidden; }
.banner.dl .bar i { display: block; height: 100%; width: 64%; background: var(--voice); }

/* The composer: the dock opened for typing, sitting on the keyboard. It always says where the text goes. */
.composer { position: absolute; left: 0; right: 0; bottom: 292px; z-index: 12; background: var(--color-surface); border-top: 1px solid var(--color-border); padding: 10px var(--app-gutter) 10px; box-shadow: 0 -8px 20px -14px rgba(0,0,0,.35); }
.composer .c-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; min-width: 0; }
.composer .seg { flex: none; }
.composer .seg button { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 12px; }
.composer .seg button.on.cmd { color: var(--voice); }
.composer .seg button.dis { opacity: .45; }
.composer .c-top .where { flex: 1; min-width: 0; font-size: var(--app-text-xs); color: var(--color-muted); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.composer .c-top .where b { color: var(--color-text); font-weight: 600; }
.c-field { border: 1.5px solid var(--color-border); border-radius: 14px; padding: 9px 12px; font-size: var(--app-text); line-height: 1.4; background: var(--color-surface); min-height: 44px; overflow-wrap: anywhere; }
.c-field.focus { border-color: var(--voice); }
.c-field .caret { display: inline-block; width: 2px; height: 1.15em; background: var(--voice); vertical-align: -3px; margin-left: 1px; }
.c-field .ph { color: var(--color-muted); }
.c-field .hot { color: var(--voice); font-weight: 600; }
.c-foot { display: flex; align-items: center; gap: 10px; margin-top: 8px; min-width: 0; }
.route { flex: 1; min-width: 0; display: flex; align-items: flex-start; gap: 6px; font-size: var(--app-text-sm); color: var(--color-muted); line-height: 1.3; }
.route > svg { flex: none; margin-top: 1px; }
.route b { color: var(--color-text); font-weight: 600; }
.route.cmd > svg { color: var(--voice); }
.send { flex: none; height: 38px; padding: 0 14px; border-radius: 19px; background: var(--color-accent); color: var(--color-accent-fg); font-weight: 600; font-size: var(--app-text-sm); display: inline-flex; align-items: center; gap: 6px; }
.send.off { background: var(--color-surface-2); color: var(--color-muted); }
.send svg.i { width: 16px; height: 16px; }
.nudge { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 12px; border-radius: 12px; background: var(--voice-soft); margin-bottom: 8px; font-size: var(--app-text-sm); min-width: 0; }
.nudge > svg { color: var(--voice); flex: none; }
.nudge .grow { flex: 1; min-width: 0; }
.nudge .grow b { display: block; font-weight: 600; font-size: var(--app-text-sm); }
.nudge .grow span { color: var(--color-muted); font-size: var(--app-text-xs); }
.reply-to { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 12px; background: var(--color-surface-2); margin-bottom: 8px; min-width: 0; }
.reply-to .grow { flex: 1; min-width: 0; font-size: var(--app-text-sm); }
.reply-to .grow b { display: block; font-size: var(--app-text-xs); color: var(--color-muted); font-weight: 600; letter-spacing: .02em; }
.reply-to .grow span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.reply-to .x { color: var(--color-muted); flex: none; }
.mic-off-line { display: flex; align-items: center; gap: 6px; font-size: var(--app-text-xs); color: var(--color-muted); margin-bottom: 8px; }
.mic-off-line svg { color: var(--color-danger); }
.dis-why { font-size: var(--app-text-xs); color: var(--color-muted); margin: -2px 0 8px; display: flex; gap: 6px; align-items: center; }

/* iOS-like keyboard (static) */
.kbd { position: absolute; left: 0; right: 0; bottom: 0; z-index: 13; height: 292px; background: #d1d4db; padding: 8px 4px 40px; display: flex; flex-direction: column; gap: 10px; }
:root[data-theme="dark"] .kbd { background: #2b2d33; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .kbd { background: #2b2d33; } }
.kbd .sugg { display: flex; justify-content: space-around; align-items: center; font-size: 15px; color: var(--color-text); padding: 4px 0 2px; min-height: 26px; }
.kbd .sugg .person { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }
.kbd .kr { display: flex; gap: 6px; justify-content: center; }
.kbd .kr i { width: 32px; height: 42px; border-radius: 5px; background: var(--color-surface); box-shadow: 0 1px 0 rgba(0,0,0,.25); display: grid; place-items: center; font-style: normal; font-size: 19px; color: var(--color-text); }
.kbd .kr i.w { width: 44px; background: color-mix(in srgb, var(--color-surface) 60%, #9aa0aa); font-size: 13px; }
.kbd .kr i.sp { width: 190px; font-size: 14px; }
.kbd .kr i.ret { width: 86px; background: color-mix(in srgb, var(--color-surface) 60%, #9aa0aa); font-size: 14px; }

/* The dock holding a draft */
.dock .type-field.draft { color: var(--color-text); gap: 8px; min-width: 0; }
.dock .type-field.draft > svg { flex: none; color: var(--color-muted); }
.dock .type-field.draft span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dock .type-field.draft small { flex: none; font-size: var(--app-text-xs); color: var(--color-muted); }

/* Typed preview: "You typed" instead of "heard" */
.typed-q { display: flex; gap: 8px; align-items: flex-start; font-size: var(--app-text-sm); color: var(--color-text); margin: 10px 0 12px; padding: 8px 10px; border-radius: 10px; background: var(--color-surface-2); }
.typed-q > svg { flex: none; color: var(--color-muted); margin-top: 1px; }
.typed-q b { display: block; font-size: var(--app-text-xs); color: var(--color-muted); font-weight: 600; }
.sheet .go { display: flex; gap: 10px; }
.sheet .go .btn { flex: 1; min-width: 0; }
.sheet .foot { text-align: center; margin-top: 10px; font-size: var(--app-text-sm); color: var(--color-muted); }
.sheet .prob { display: flex; gap: 12px; align-items: flex-start; margin: 12px 0 12px; }
.sheet .prob .ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex: none; background: var(--voice-soft); color: var(--voice); }
.sheet .prob b { display: block; font-size: var(--app-text-md); font-weight: 600; line-height: 1.3; }
.sheet .prob span { display: block; font-size: var(--app-text-sm); color: var(--color-muted); margin-top: 3px; }
.mic.blocked { background: var(--color-surface-2); color: var(--color-muted); }

/* Alternatives: a ribbon so they can't be mistaken for the recommendation */
.alt-ribbon { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 20; background: var(--color-text); color: var(--color-bg); font-size: var(--app-text-xs); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 4px 10px; border-radius: 10px; white-space: nowrap; }
.reading { display: inline-flex; align-items: center; gap: 6px; }
.reading .dots { display: flex; gap: 3px; } .reading .dots i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .5; }
</style>
</head>
<body><div id="app"></div><script>
const { frame, topBar, iconBtn, dock, type, state, health, act, askCard, voiceNote, icon, avatar } = App;

/* ── Icons the kit doesn't have ─────────────────────────────────────── */
const svg = (d, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const micOff = (cls = '') => svg('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M3 3l18 18"/>', cls);
const cloudOff = (cls = '') => svg('<path d="M7 18h10a4 4 0 0 0 .8-7.9A6 6 0 0 0 6.3 9 4.5 4.5 0 0 0 7 18z"/><path d="M3 3l18 18"/>', cls);
const pencil = (cls = '') => svg('<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/>', cls);
const handBack = (cls = '') => svg('<path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-4"/>', cls);

/* ── Data ───────────────────────────────────────────────────────────── */
const colors = { PR: '#1f8f6a', SA: '#c2353b' };
const NOTE_HTML = `Sam says the checksum fix lands tomorrow. <span class="mention">@Priya</span> can you rerun the S22 numbers after that?`;
const QUESTION = 'Should the spike try FunctionGemma on the S22 for one day before we settle on Qwen3?';

/* ── Work item backdrop: SHIP-906 (as work-item.html) ───────────────── */
const wiBar = (sub = 'Feature · New') => topBar({ title: 'SHIP-906', sub, back: true, right: iconBtn('more', { label: 'More' }) });
const featureTop = ({ st = ['New', 'proposed'] } = {}) => `<div class="wi-head">
  <div class="k">${type('feature')}<span>Feature in</span><span>${type('epic')} Mobile App</span></div>
  <h1>Voice commands on the mobile app with on-device models</h1>
  <div class="pills"><span>${state(...st)}</span>${health('risk')}<span class="who">${avatar('JD', { sm: true })}Joel</span></div>
  <div class="status-card"><div class="line">Spike done: Qwen3 1.7B reaches the preview in 4.8 s on a cool S22, 6.1 s once it is warm. D10 and D11 wait on Joel.</div></div></div>`;
const needsYou = () => `<div class="section-h">Needs you <a>3</a></div>
  ${askCard({ kind: 'approval', q: 'D10: Download the models on Wi-Fi only, and ask before using mobile data?', from: 'Claude Code', when: '2h ago', opts: ['Approve', 'Discuss'], say: 'approve D10' })}
  ${askCard({ kind: 'feedback', q: QUESTION, from: 'Claude Code', when: '40m ago', opts: ['Reply'], say: 'reply: …' })}`;
const oldNotes = () => `
  <div class="vnote">${avatar('AI', { agent: true })}<div class="body"><div class="who"><b>Claude Code</b><span class="agent-tag">Agent</span><span>2h</span></div>
    <div class="text">Spike results: 214 spoken commands on an S22. Right action 93%, note text exact 100%.</div></div></div>
  ${voiceNote({ who: 'Priya', initials: 'PR', color: colors.PR, when: '1d', secs: 9, text: 'Agreed, the key and title go at the top of the sheet. Also the S22 gets warm after about a minute of dictation.' })}`;
// notes({ mode }): none | fresh (typed note just posted) | pending (waiting to send)
const notes = ({ mode = 'none' } = {}) => {
  const top = {
    none: '',
    fresh: `<div class="vnote new">${avatar('JD')}<div class="body"><div class="who"><b>Joel</b><span>just now</span></div><div class="text">${NOTE_HTML}</div></div></div>`,
    pending: `<div class="vnote pending">${avatar('JD')}<div class="body"><div class="who"><b>Joel</b><span class="wait">${icon('clock', 'sm')}Waiting to send</span></div><div class="text">${NOTE_HTML}</div></div></div>`,
  }[mode];
  return `<div class="section-h">Notes <a>Newest first</a></div>
  <div class="notes-h"><span class="chip on">All <span class="n">14</span></span><span class="chip">Notes <span class="n">9</span></span><span class="chip">Changes <span class="n">5</span></span></div>
  <div class="list">${top}${oldNotes()}</div>`;
};
const wiBody = (o = {}) => `${o.banner || ''}${featureTop(o)}${needsYou(o)}`;
const wiNotesBody = (o = {}) => `${o.banner || ''}${featureTop(o)}${notes(o)}`;
const wi = ({ sub, body, bottom, overlay = '' } = {}) => frame({ top: wiBar(sub), body: body || wiBody(), bottom: bottom ?? dock({ placeholder: 'Type a note' }), overlay });

/* ── Composer ───────────────────────────────────────────────────────── */
// modeSeg(mode, { cmdOff }): Note | Command, always visible so the route is chosen before sending.
const modeSeg = (mode, { cmdOff = false } = {}) => `<div class="seg" role="tablist" aria-label="Send as">
  <button class="${mode === 'note' ? 'on' : ''}">${icon('note', 'sm')}Note</button>
  <button class="cmd ${mode === 'command' ? 'on' : ''}${cmdOff ? ' dis' : ''}">${icon('spark', 'sm')}Command</button></div>`;
const ROUTE = {
  note: `<div class="route">${icon('note', 'sm')}<span><b>Posts when you send</b>, word for word, like a comment on the web</span></div>`,
  command: `<div class="route cmd">${icon('spark', 'sm')}<span><b>Preview first</b> · nothing changes until you apply</span></div>`,
  reply: `<div class="route">${handBack('sm')}<span><b>Posts when you send</b> and hands the item back to Claude Code</span></div>`,
};
const SEND = {
  note: `<button class="send">${icon('up', 'sm')}Post</button>`,
  command: `<button class="send">${icon('spark', 'sm')}Preview</button>`,
  reply: `<button class="send">${icon('up', 'sm')}Reply</button>`,
};
// composer({ mode, text, extra, top, sendOff }): extra = a line above the field (nudge, reply target, mic off).
const composer = ({ mode = 'note', text = '', extra = '', top, sendOff = false, cmdOff = false, route, send } = {}) => `<div class="composer">
  ${top ?? `<div class="c-top">${modeSeg(mode, { cmdOff })}<span class="where">on <b>SHIP-906</b></span></div>`}
  ${extra}
  <div class="c-field focus">${text || `<span class="ph">${mode === 'command' ? 'Say what to change, as you would aloud' : 'Type a note. @ mentions someone'}</span>`}<span class="caret"></span></div>
  <div class="c-foot">${route ?? ROUTE[mode]}${sendOff ? `<button class="send off">${SEND[mode].replace('<button class="send">', '').replace('</button>', '')}</button>` : (send ?? SEND[mode])}</div>
</div>`;
const keyboard = (sugg = '<span>the</span><span>I</span><span>it’s</span>') => `<div class="kbd"><div class="sugg">${sugg}</div>
  ${['qwertyuiop', 'asdfghjkl'].map((r) => `<div class="kr">${[...r].map((c) => `<i>${c}</i>`).join('')}</div>`).join('')}
  <div class="kr"><i class="w">⇧</i>${[...'zxcvbnm'].map((c) => `<i>${c}</i>`).join('')}<i class="w">⌫</i></div>
  <div class="kr"><i class="w">123</i><i class="sp">space</i><i class="ret">return</i></div></div>`;
const typing = (o) => ({ bottom: '', overlay: `${composer(o)}${keyboard(o.sugg)}` });

/* ── Sheets and toasts ──────────────────────────────────────────────── */
const sheet = (inner, cls = '') => `<div class="scrim"></div><div class="sheet ${cls}"><div class="grab"></div>${inner}</div>`;
const ctx = (label, where = '<b>SHIP-906</b>', ic = icon('spark', 'sm')) => `<div class="voice-ctx">${ic}${label}${where ? ` <span class="sep"></span> ${where}` : ''}</div>`;
const typedQ = (text) => `<div class="typed-q">${icon('keyboard', 'sm')}<div><b>You typed</b>${text}</div></div>`;
const editBtn = () => `<button class="btn">${pencil('sm')}Edit</button>`;
const toastAt = (ic, text, { action = 'Undo', bottom = 104 } = {}) => `<div class="toast" style="bottom:${bottom}px">${ic}<span class="grow">${text}</span>${action ? `<button>${action}</button>` : ''}</div>`;
const ribbon = (t) => `<div class="alt-ribbon">${t}</div>`;

/* ── States ─────────────────────────────────────────────────────────── */
App.screen({ title: 'Typed fallback', states: [
  /* Notes post straight away */
  { id: 'note-typing', title: 'Typing a note', note: 'Tap “Type a note”. The field opens on Note: the line under it says it posts when you send, like a web comment. @ suggests people.',
    render: () => wi(typing({ mode: 'note', text: NOTE_HTML, sugg: `<span class="person">${avatar('PR', { sm: true, color: colors.PR })}Priya Raman</span><span class="person">${avatar('PS', { sm: true })}Pat Singh</span>` })) },

  { id: 'note-posted', title: 'Note posted', note: 'Post sends it at once, with no preview: what was typed is what was meant. The note tops Notes; Undo for 8 s, as after a voice change.',
    render: () => wi({ body: wiNotesBody({ mode: 'fresh' }), overlay: toastAt(icon('check', 'sm'), 'Note posted on SHIP-906') }) },

  { id: 'note-nudge', title: 'A note that reads like a command', note: 'In Note, the text names D10 and a state. A nudge offers the preview; ignoring it posts the words as a note. Matched on the phone, no model call.',
    render: () => wi(typing({ mode: 'note', text: `<span class="hot">approve D10</span> and set this to <span class="hot">active</span>`,
      extra: `<div class="nudge">${icon('spark', 'sm')}<div class="grow"><b>Looks like 2 changes</b><span>Approve D10 · State → Active</span></div><button class="btn sm primary">Preview instead</button></div>` })) },

  /* Commands go through the preview */
  { id: 'command-typing', title: 'Typing a command', note: 'Command is picked. The line says preview first and Send reads Preview. Keys, states and names light up as they match.',
    render: () => wi(typing({ mode: 'command', text: `<span class="hot">Approve D10</span>, and give this to <span class="hot">Priya</span>`, sugg: '<span>“Priya”</span><span>Priya’s</span><span>Pri</span>' })) },

  { id: 'command-preview', title: 'Typed command, previewed', note: 'The same preview as voice, with “You typed” in place of the heard quote. Edit reopens the field with the text; there’s no clip.',
    render: () => wi({ overlay: sheet(`${ctx('2 changes to apply')}
      ${typedQ('Approve D10, and give this to Priya')}
      <div class="acts">${act({ kind: 'approve', title: 'Approve D10', detail: 'Wi-Fi only, ask before mobile data' })}${act({ kind: 'field', icon: 'user', title: 'Owner: Joel → Priya', detail: 'It shows in Priya’s Inbox' })}</div>
      <div class="go">${editBtn()}<button class="btn primary">Apply</button></div>
      <div class="foot">Nothing changes until you apply</div>`, 'preview') }) },

  { id: 'command-no-change', title: 'Command with no change in it', note: 'Sent as Command, but there’s nothing to change. As with voice (D9 there), it offers to post the words as a note.',
    render: () => wi({ overlay: sheet(`${ctx('No change found')}
      ${typedQ('the S22 runs warm after a minute of dictation, worth a look')}
      <div class="prob"><span class="ic">${icon('note')}</span><div><b>That isn’t a change I can make</b><span>Post it as a note on SHIP-906 instead, word for word?</span></div></div>
      <div class="go">${editBtn()}<button class="btn primary">${icon('note', 'sm')}Post as a note</button></div>
      <div class="foot">Nothing was changed</div>`) }) },

  /* Where you came from sets the mode */
  { id: 'type-instead', title: 'Type instead (mic off)', note: 'From “Type instead” on a voice failure sheet (mic blocked, mic check). The field opens on Command, since a command was what you meant to say.',
    render: () => wi({ bottom: '', overlay: `${composer({ mode: 'command', extra: `<div class="mic-off-line">${micOff('sm')}Microphone is off · typing instead</div>` })}${keyboard()}` }) },

  { id: 'reply-typing', title: 'Typing a reply', note: 'Reply on Claude Code’s question opens the field aimed at it, with no Note/Command choice. Reply posts at once and hands the item back.',
    render: () => wi(typing({ mode: 'reply', text: 'Yes, one day on the S22, then compare the action accuracy with Qwen3',
      top: `<div class="reply-to"><span>${icon('message', 'sm')}</span><div class="grow"><b>REPLYING TO CLAUDE CODE</b><span>${QUESTION}</span></div><span class="x">${icon('x', 'sm')}</span></div>` })) },

  /* Edge cases */
  { id: 'offline-note', title: 'Posted offline', note: 'No connection. The note waits on the item as Waiting to send, as voice changes and Inbox answers do, and goes by itself.',
    render: () => wi({ body: wiNotesBody({ mode: 'pending', banner: `<div class="banner off">${cloudOff()}<div class="grow"><b>You’re offline</b><span class="muted">Your note waits to send and goes by itself when you’re back online.</span></div></div><div style="height:12px"></div>` }),
      overlay: toastAt(icon('clock', 'sm'), 'Note waits to send') }) },

  { id: 'downloading', title: 'Voice models downloading', note: 'Before the models are ready, Note works and Command is greyed with the reason. Same banner as work-item downloading.',
    render: () => wi({ body: wiBody({ banner: `<div class="banner dl">${icon('download')}<div class="grow"><b>Voice is getting ready</b><span class="muted">2.0 of 3.1 GB on Wi-Fi · about 3 min</span><div class="bar"><i></i></div></div></div><div style="height:12px"></div>` }),
      bottom: '', overlay: `${composer({ mode: 'note', cmdOff: true, text: 'Checked on the Pixel 8 too, same 6 s once warm', extra: `<div class="dis-why">${icon('clock', 'sm')}Command needs the voice models · ready in about 3 min</div>` })}${keyboard()}` }) },

  { id: 'draft', title: 'Draft kept', note: 'Closing the keyboard keeps the text. The dock shows it with its mode; tap to carry on. Kept on this phone per item until sent or cleared.',
    render: () => wi({ bottom: `<div class="dock"><div class="type-field draft">${icon('note', 'sm')}<span>Sam says the checksum fix lands tomorrow. @Priya can…</span><small>Note draft</small></div><button class="mic" aria-label="Hold to talk">${icon('mic')}</button></div>` }) },

  /* Alternatives (for comparison in the review) */
  { id: 'alt-auto', title: 'Alternative A: the model decides', note: 'No modes. After a pause the phone reads the text; Send turns from Post into Preview 2. Until it has read, Send waits.',
    render: () => { const o = typing({ mode: 'command', top: '', text: 'Approve D10, and give this to Priya',
      route: `<div class="route cmd">${icon('spark', 'sm')}<span><b>Found 2 changes</b> · you’ll see a preview first</span></div>`,
      send: `<button class="send">${icon('spark', 'sm')}Preview 2</button>` }); return wi({ ...o, overlay: o.overlay + ribbon('Alternative A') }); } },

  { id: 'alt-always', title: 'Alternative B: always preview', note: 'Every send previews, even a plain note: one row, then Apply. Same as voice, one more tap for the common case.',
    render: () => wi({ overlay: sheet(`${ctx('1 change to apply')}
      ${typedQ('Sam says the checksum fix lands tomorrow. @Priya can you rerun the S22 numbers after that?')}
      <div class="acts">${act({ kind: 'note', title: 'Note on SHIP-906', detail: 'Word for word · mentions Priya' })}</div>
      <div class="go">${editBtn()}<button class="btn primary">Apply</button></div>`, 'preview') + ribbon('Alternative B') }) },

  { id: 'alt-note-only', title: 'Alternative C: notes only', note: 'Typing only ever posts a note. Changes by voice or the screen’s buttons; “Type instead” on the mic sheets goes away.',
    render: () => { const o = typing({ mode: 'note', text: `<span>approve D10 and set this to active</span>`,
      top: `<div class="c-top"><span class="where" style="text-align:left">Note on <b>SHIP-906</b></span></div>`,
      route: `<div class="route">${icon('note', 'sm')}<span><b>Posts as a note.</b> Changes: hold the mic or use the buttons</span></div>` }); return wi({ ...o, overlay: o.overlay + ribbon('Alternative C') }); } },
]});
</script></body></html>
