<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<!--
  Voice failures on the phone app (SHIP-905, voice model from SHIP-906): what happens when hold to talk doesn't
  end in a clean preview and apply. Nothing heard, nothing matched, no valid action, Fix, Apply failing and Undo.
  Drawn on the SHIP-906 work item (dock) and the Backlog (tab bar) from work-item.html and backlog.html.
  Design notes and decisions: voice.md. ?state=<id>&theme=light|dark, ?list for ids.
-->
<link rel="stylesheet" href="app.css"><script src="app.js"></script>
<style>
/* Work item backdrop (a trimmed copy of work-item.html) */
.wi-head h1, .status-card .line, .vnote .text, .goal { overflow-wrap: anywhere; min-width: 0; }
.wi-head { padding: 14px var(--app-gutter) 14px; background: var(--color-surface); border-bottom: 1px solid var(--color-border); }
.wi-head .k { display: flex; align-items: center; gap: 6px; font-size: var(--app-text-sm); color: var(--color-muted); }
.wi-head h1 { font-size: var(--app-text-lg); line-height: 1.25; font-weight: 650; margin: 6px 0 10px; letter-spacing: -.01em; }
.wi-head .pills { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: var(--app-text-sm); color: var(--color-muted); }
.wi-head .pills .who { display: inline-flex; align-items: center; gap: 6px; }
.status-card { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--color-border); }
.status-card .line { font-size: var(--app-text); }
.decided { display: flex; align-items: center; gap: 10px; margin: 0 var(--app-gutter) 12px; padding: 12px 14px; border-radius: 14px; background: color-mix(in srgb, var(--color-ok) 12%, var(--color-surface)); border: 1px solid color-mix(in srgb, var(--color-ok) 35%, transparent); font-size: var(--app-text-sm); }
.decided .ic { color: var(--color-ok); display: grid; }
.decided b { font-weight: 600; display: block; font-size: var(--app-text); }
.decided span { color: var(--color-muted); }
.more-asks { margin: -2px var(--app-gutter) 0; font-size: var(--app-text-sm); color: var(--color-accent); font-weight: 500; }
.notes-h { display: flex; gap: 8px; padding: 0 var(--app-gutter) 10px; }
.notes-h .chip { height: 30px; }
.event { display: flex; align-items: center; gap: 8px; padding: 9px var(--app-gutter) 9px 54px; font-size: var(--app-text-sm); color: var(--color-muted); background: var(--color-surface); border-bottom: 1px solid var(--color-border); }
.event b { color: var(--color-text); font-weight: 500; }
.event .grow { flex: 1; min-width: 0; }
.vnote.new, .event.new { background: var(--voice-soft); }
.agent-tag { font-size: 10.5px; font-weight: 600; color: var(--color-info); background: color-mix(in srgb, var(--color-info) 14%, transparent); border-radius: 4px; padding: 1px 5px; }
.hl { background: var(--voice-soft); border-radius: 8px; box-shadow: 0 0 0 6px var(--voice-soft); }

/* Waiting to send (offline), as the Inbox's queued answers */
.vnote.pending, .event.pending { background: var(--color-surface-2); }
.vnote.pending .text { color: var(--color-muted); }
.wait { display: inline-flex; align-items: center; gap: 4px; font-size: var(--app-text-xs); font-weight: 600; color: var(--color-muted); white-space: nowrap; }
.banner.off { background: var(--ask-soft); border-color: transparent; align-items: flex-start; }
.banner.off b, .banner.bad b { display: block; font-size: var(--app-text); font-weight: 600; }
.banner.off .grow, .banner.bad .grow { min-width: 0; }
.banner.off > svg { color: var(--ask); margin-top: 1px; }
.banner.bad { background: color-mix(in srgb, var(--color-danger) 10%, var(--color-surface)); border-color: color-mix(in srgb, var(--color-danger) 30%, transparent); align-items: flex-start; flex-wrap: wrap; }
.banner.bad > svg { color: var(--color-danger); margin-top: 1px; }
.banner .acts2 { display: flex; gap: 8px; margin-top: 10px; }

/* The voice change group in Notes, with its own Undo (D16) */
.vchange { display: flex; align-items: center; gap: 10px; padding: 10px var(--app-gutter); background: var(--color-surface); border-bottom: 1px solid var(--color-border); font-size: var(--app-text-sm); color: var(--color-muted); }
.vchange .ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--voice-soft); color: var(--voice); flex: none; }
.vchange .grow { flex: 1; min-width: 0; }
.vchange b { display: block; color: var(--color-text); font-weight: 600; font-size: var(--app-text); }

/* Toasts that aren't "applied": a hint, a warning */
.toast.hint, .toast.bad { height: auto; min-height: 48px; padding: 10px 8px 10px 14px; align-items: flex-start; }
.toast.hint > svg, .toast.bad > svg { margin-top: 2px; flex: none; }
.toast.bad > svg { color: #ff8a8a; }
.toast .grow b { display: block; font-weight: 600; }
.toast .grow span { opacity: .75; }
.toast button { align-self: center; }

/* Problem sheets: nothing matched, no valid action, mic trouble */
.sheet .prob { display: flex; gap: 12px; align-items: flex-start; margin: 12px 0 12px; }
.sheet .prob .ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex: none; background: var(--ask-soft); color: var(--ask); }
.sheet .prob.bad .ic { background: color-mix(in srgb, var(--color-danger) 14%, transparent); color: var(--color-danger); }
.sheet .prob.info .ic { background: var(--voice-soft); color: var(--voice); }
.sheet .prob b { display: block; font-size: var(--app-text-md); font-weight: 600; line-height: 1.3; }
.sheet .prob span { display: block; font-size: var(--app-text-sm); color: var(--color-muted); margin-top: 3px; }
.heard2 { font-size: var(--app-text); font-style: italic; color: var(--color-text); margin: 10px 0 0; padding-left: 10px; border-left: 3px solid var(--color-border); }
.heard2 .hot { color: var(--voice); font-style: normal; font-weight: 600; }
.miss { text-decoration: underline wavy var(--ask); text-underline-offset: 4px; text-decoration-thickness: 1.5px; font-style: normal; font-weight: 600; }
.over2 { font-size: var(--app-text-xs); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--color-muted); margin: 14px 0 6px; }
.picks { border: 1px solid var(--color-border); border-radius: 14px; overflow: hidden; margin-bottom: 14px; }
.pk { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-bottom: 1px solid var(--color-border); min-width: 0; }
.pk:last-child { border-bottom: 0; }
.pk .main { flex: 1; min-width: 0; }
.pk .t { font-size: var(--app-text); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pk .m { font-size: var(--app-text-sm); color: var(--color-muted); display: flex; gap: 6px; align-items: center; margin-top: 2px; flex-wrap: wrap; }
.pk > .i { color: var(--color-muted); flex: none; }
.pk.rec { background: var(--voice-soft); }
.sheet .go { display: flex; gap: 10px; }
.sheet .go .btn { flex: 1; min-width: 0; }
.sheet .foot { text-align: center; margin-top: 10px; font-size: var(--app-text-sm); color: var(--color-muted); }
.sheet .foot a { color: var(--color-accent); font-weight: 500; }
.chips2 { display: flex; gap: 8px; flex-wrap: wrap; margin: 2px 0 14px; }
.chips2 .chip { height: 40px; padding: 0 14px; font-size: var(--app-text); }
.chips2 .chip.cur { color: var(--color-muted); border-style: dashed; }
.quote2 { margin: 0 0 14px; font-size: var(--app-text); background: var(--color-surface-2); border-radius: 10px; padding: 10px 12px; }

/* Mic check (third time nothing is heard) */
.level { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 12px; background: var(--color-surface-2); margin-bottom: 10px; font-size: var(--app-text-sm); color: var(--color-muted); }
.level .meter { flex: 1; display: flex; gap: 3px; height: 20px; align-items: flex-end; }
.level .meter i { flex: 1; border-radius: 2px; background: var(--color-border); height: 20%; }
.level .meter i.on { background: var(--color-ok); }
.src-row { display: flex; align-items: center; gap: 10px; padding: 12px; border: 1px solid var(--color-border); border-radius: 12px; margin-bottom: 14px; font-size: var(--app-text-sm); }
.src-row .grow { flex: 1; min-width: 0; }
.src-row b { display: block; font-size: var(--app-text); font-weight: 600; }
.src-row span { color: var(--color-muted); }
.mic.blocked { background: var(--color-surface-2); color: var(--color-muted); }

/* Preview rows that can't be done, changed by a Fix, or changed by someone else */
.act.cant { background: var(--color-surface-2); }
.act.cant .ic { background: var(--color-surface); color: var(--color-muted); }
.act.cant .what b { color: var(--color-muted); text-decoration: line-through; text-decoration-thickness: 1px; }
.act.cant .what .why { color: var(--color-text); }
.act .tag { display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; height: 22px; padding: 0 8px; border-radius: 11px; font-size: var(--app-text-xs); font-weight: 700; width: fit-content; }
.act .what span.tag { display: inline-flex; margin-top: 6px; }
.act .tag.fixed { background: var(--voice-soft); color: var(--voice); }
.act .tag.moved { background: var(--ask-soft); color: var(--ask); }
.act .tag svg.i { width: 13px; height: 13px; }
.act.changed { background: color-mix(in srgb, var(--voice) 7%, var(--color-surface)); }
.act.conflict { background: color-mix(in srgb, var(--ask) 9%, var(--color-surface)); }
.act .what .old { text-decoration: line-through; color: var(--color-muted); }
.band { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; margin: 10px 0 12px; font-size: var(--app-text-sm); }
.band b { display: block; font-size: var(--app-text); font-weight: 600; }
.band .grow { flex: 1; min-width: 0; }
.band > svg { flex: none; margin-top: 1px; }
.band.bad { background: color-mix(in srgb, var(--color-danger) 11%, var(--color-surface)); }
.band.bad > svg { color: var(--color-danger); }
.band.warn { background: var(--ask-soft); }
.band.warn > svg { color: var(--ask); }
.band span { color: var(--color-muted); }
.discard { display: block; text-align: center; margin-top: 10px; font-size: var(--app-text-sm); color: var(--color-muted); }
.discard a { color: var(--color-danger); font-weight: 500; }
.btn .spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--color-accent-fg) 35%, transparent); border-top-color: var(--color-accent-fg); }

/* Fixing: the preview folds to a summary while the Fix button is held */
.fixing { border: 1px solid var(--color-border); border-radius: 12px; padding: 10px 12px; margin: 12px 0 0; background: var(--color-surface-2); }
.fixing .h { display: flex; align-items: center; gap: 6px; font-size: var(--app-text-xs); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--color-muted); }
.fixing ol { margin: 6px 0 0; padding-left: 20px; font-size: var(--app-text-sm); color: var(--color-text); }
.fixing ol li { margin: 2px 0; }
.fixing ol li.tgt { color: var(--voice); font-weight: 600; }
.sheet.listening.fix .transcript { min-height: 56px; margin: 12px 0 8px; }
.heard .fixline { display: block; margin-top: 4px; font-style: normal; color: var(--voice); font-weight: 500; }

/* Typed fix: the note opens as a text field above the keyboard */
.edit-field { margin-top: 8px; border: 2px solid var(--voice); border-radius: 10px; padding: 8px 10px; background: var(--color-surface); font-size: var(--app-text); color: var(--color-text); }
.act .what .edit-field span { display: inline; margin: 0; font-size: inherit; color: inherit; }
.act .what .edit-field span.typed { color: var(--color-text); }
.act .what .edit-field .caret { display: inline-block; width: 2px; height: 1.1em; background: var(--voice); vertical-align: -3px; margin: 0 1px; }
.edit-field .typed { background: var(--voice-soft); border-radius: 3px; padding: 0 2px; }
.act .what .edited { display: flex; align-items: center; gap: 4px; margin-top: 6px; font-size: var(--app-text-xs); color: var(--color-muted); }
.kbd { position: absolute; left: 0; right: 0; bottom: 0; z-index: 13; height: 292px; background: #d1d4db; padding: 8px 4px 40px; display: flex; flex-direction: column; gap: 10px; }
:root[data-theme="dark"] .kbd { background: #2b2d33; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .kbd { background: #2b2d33; } }
.kbd .sugg { display: flex; justify-content: space-around; font-size: 15px; color: var(--color-text); padding: 4px 0 2px; }
.kbd .kr { display: flex; gap: 6px; justify-content: center; }
.kbd .kr i { width: 32px; height: 42px; border-radius: 5px; background: var(--color-surface); box-shadow: 0 1px 0 rgba(0,0,0,.25); display: grid; place-items: center; font-style: normal; font-size: 19px; color: var(--color-text); }
.kbd .kr i.w { width: 44px; background: color-mix(in srgb, var(--color-surface) 60%, #9aa0aa); font-size: 13px; }
.kbd .kr i.sp { width: 190px; font-size: 14px; }
.kbd .kr i.ret { width: 86px; background: var(--color-accent); color: var(--color-accent-fg); font-size: 14px; }

/* What can I say here */
.say-list { border: 1px solid var(--color-border); border-radius: 14px; overflow: hidden; margin-bottom: 12px; }
.say-list .sr { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border-bottom: 1px solid var(--color-border); font-size: var(--app-text-sm); }
.say-list .sr:last-child { border-bottom: 0; }
.say-list .sr b { font-weight: 600; font-size: var(--app-text); display: block; }
.say-list .sr span { color: var(--color-muted); }
.say-list .sr > svg { color: var(--voice); flex: none; margin-top: 2px; }
.say-list .sr.web > svg { color: var(--color-muted); }
</style>
</head>
<body><div id="app"></div><script>
const { frame, topBar, iconBtn, dock, tabBar, type, state, health, progress, listening, preview, act, toast, askCard, voiceNote, icon, avatar, wave } = App;

/* ── Icons the kit doesn't have ─────────────────────────────────────── */
const svg = (d, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const micOff = (cls = '') => svg('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M3 3l18 18"/>', cls);
const cloudOff = (cls = '') => svg('<path d="M7 18h10a4 4 0 0 0 .8-7.9A6 6 0 0 0 6.3 9 4.5 4.5 0 0 0 7 18z"/><path d="M3 3l18 18"/>', cls);
const help = (cls = '') => svg('<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17.2v.1"/>', cls);
const block = (cls = '') => svg('<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>', cls);
const pencil = (cls = '') => svg('<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/>', cls);
const web = (cls = '') => svg('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/>', cls);
const retry = (cls = '') => svg('<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>', cls);

/* ── Data ───────────────────────────────────────────────────────────── */
const hot = (s) => `<span class="hot">${s}</span>`;
const miss = (s) => `<span class="miss">${s}</span>`;
const NOTE = 'the S22 numbers are fine for v1, keep the 4B path for phones with 12 gigs';
const Note = NOTE[0].toUpperCase() + NOTE.slice(1);
const HEARD = `Set this to Active, approve D10, and add a note: ${NOTE}`;
const colors = { PR: '#1f8f6a', SA: '#c2353b' };
const ACTS = {
  state: { kind: 'field', icon: 'flag', title: 'State: New → Active', detail: 'SHIP-906 Voice commands' },
  d10: { kind: 'approve', title: 'Approve D10', detail: 'Wi-Fi only, ask before mobile data' },
  note: { kind: 'note', title: 'Note on SHIP-906', detail: 'Word for word, with the 6 s clip', quote: Note },
};

/* ── Work item backdrop: SHIP-906 (as work-item.html) ───────────────── */
const wiBar = (sub = 'Feature · New') => topBar({ title: 'SHIP-906', sub, back: true, right: iconBtn('more', { label: 'More' }) });
const featureTop = ({ st = ['New', 'proposed'], flash = false } = {}) => `<div class="wi-head">
  <div class="k">${type('feature')}<span>Feature in</span><span>${type('epic')} Mobile App</span></div>
  <h1>Voice commands on the mobile app with on-device models</h1>
  <div class="pills"><span${flash ? ' class="hl"' : ''}>${state(...st)}</span>${health('risk')}<span class="who">${avatar('JD', { sm: true })}Joel</span></div>
  <div class="status-card"><div class="line">Spike done: Qwen3 1.7B reaches the preview in 4.8 s on a cool S22, 6.1 s once it is warm. D10 and D11 wait on Joel.</div></div></div>`;
const askD10 = () => askCard({ kind: 'approval', q: 'D10: Download the models on Wi-Fi only, and ask before using mobile data?', from: 'Claude Code', when: '2h ago', opts: ['Approve', 'Discuss'], say: 'approve D10' });
const needsYou = ({ d10 = 'ask' } = {}) => `<div class="section-h">Needs you <a>${d10 === 'ask' ? 3 : 2}</a></div>
  ${d10 === 'ask' ? askD10() : `<div class="decided"><span class="ic">${icon('check')}</span><div><b>D10 approved</b><span>${d10 === 'pending' ? 'Waiting to send · Wi-Fi only, ask before mobile data' : 'By you · Wi-Fi only, ask before mobile data'}</span></div></div>`}
  <div class="more-asks">D11: where the voice button sits ›</div>`;
const oldNotes = () => `
  <div class="vnote">${avatar('AI', { agent: true })}<div class="body"><div class="who"><b>Claude Code</b><span class="agent-tag">Agent</span><span>2h</span></div>
    <div class="text">Spike results: 214 spoken commands on an S22. Right action 93%, note text exact 100%. Release to preview 4.8 s cool, 6.1 s after ten minutes of use.</div></div></div>
  ${voiceNote({ who: 'Priya', initials: 'PR', color: colors.PR, when: '1d', secs: 9, text: 'Agreed, the key and title go at the top of the sheet. Also the S22 gets warm after about a minute of dictation.' })}`;
const clip = (seed = 74) => `<span class="clip"><span class="play">${icon('play', 'sm')}</span><span class="bars">${App.bars(28, 18, seed).map((h) => `<i style="height:${h}px"></i>`).join('')}</span>0:06</span>`;
// notes({ mode }): 'none' = before any voice change; 'fresh' = just applied; 'pending' = waiting to send;
// 'undone' = undone just now; 'group' = applied 4 min ago, shown as one voice change with Undo.
const notes = ({ mode = 'none', partial = false, noD10 = false } = {}) => {
  const top = {
    none: '',
    fresh: `<div class="vnote new">${avatar('JD')}<div class="body"><div class="who"><b>Joel</b><span>just now</span><span class="via-voice">${icon('mic', 'sm')}voice</span></div><div class="text">${Note}</div>${clip()}</div></div>
      ${noD10 ? '' : `<div class="event new">${icon('check', 'sm')}<span><b>Joel</b> approved D10 · just now</span></div>`}
      <div class="event new">${icon('flag', 'sm')}<span><b>Joel</b> set the state to Active · just now</span></div>`,
    pending: `<div class="vnote pending">${avatar('JD')}<div class="body"><div class="who"><b>Joel</b><span class="wait">${icon('clock', 'sm')}Waiting to send</span></div><div class="text">${Note}</div>${clip()}</div></div>
      <div class="event pending">${icon('check', 'sm')}<span class="grow"><b>Joel</b> approved D10</span><span class="wait">${icon('clock', 'sm')}Waiting</span></div>
      <div class="event pending">${icon('flag', 'sm')}<span class="grow"><b>Joel</b> set the state to Active</span><span class="wait">${icon('clock', 'sm')}Waiting</span></div>`,
    undone: `<div class="event new">${icon('undo', 'sm')}<span><b>Joel</b> undid a voice change (state, D10, a note) · just now</span></div>`,
    group: `<div class="vchange"><span class="ic">${icon('mic', 'sm')}</span><div class="grow"><b>Your voice change</b>${partial ? 'Approved D10 · 9:41 · picked up by Claude Code since' : 'State, D10 and a note · 4 min ago'}</div><button class="btn sm">${icon('undo', 'sm')}Undo</button></div>
      <div class="vnote">${avatar('JD')}<div class="body"><div class="who"><b>Joel</b><span>4 min</span><span class="via-voice">${icon('mic', 'sm')}voice</span></div><div class="text">${Note}</div>${clip()}</div></div>
      <div class="event">${icon('check', 'sm')}<span><b>Joel</b> approved D10 · 4 min</span></div>
      <div class="event">${icon('flag', 'sm')}<span><b>Joel</b> set the state to Active · 4 min</span></div>
      ${partial ? `<div class="event">${icon('spark', 'sm')}<span><b>Claude Code</b> picked up SHIP-906 · 2 min</span></div>` : ''}`,
  }[mode];
  return `<div class="section-h">Notes <a>Newest first</a></div>
  <div class="notes-h"><span class="chip on">All <span class="n">14</span></span><span class="chip">Notes <span class="n">9</span></span><span class="chip">Changes <span class="n">5</span></span></div>
  <div class="list">${top}${oldNotes()}</div>`;
};
const wiBody = (o = {}) => `${o.banner || ''}${featureTop(o)}${needsYou(o)}`;
const wiNotesBody = (o = {}) => `${o.banner || ''}${featureTop(o)}${notes(o)}`;
// wi({ ... }): the SHIP-906 work item with the dock. mic: idle | live | busy | off | blocked.
const wi = ({ sub, body, mic = 'idle', overlay = '' } = {}) => frame({ top: wiBar(sub), body: body || wiBody(),
  bottom: mic === 'blocked' ? `<div class="dock"><div class="type-field">Type a note or command</div><button class="mic blocked" aria-label="Microphone off">${micOff()}</button></div>` : dock({ mic }), overlay });

/* ── Backlog backdrop (as backlog.html, Features level) ─────────────── */
const F = [
  ['SHIP-707', 'Mobile web: touch shell and phone layouts', 'Active', 'in-progress'],
  ['SHIP-907', 'Mobile app foundations', 'Active', 'in-progress'],
  ['SHIP-892', 'Demo artifacts for the sprint demo agent', 'New', 'proposed'],
  ['SHIP-906', 'Voice commands on the mobile app with on-device models', 'New', 'proposed'],
  ['SHIP-891', 'Features panel on the sprint page', 'New', 'proposed'],
  ['SHIP-246', 'Client notes on the work item page', 'New', 'proposed'],
];
const backlog = ({ mic = 'idle', overlay = '' } = {}) => frame({
  // App.tabRoot (the project key tile) arrives with the Projects mock-ups (PR #85/#87); plain top bar until then.
  top: (App.tabRoot || ((o) => topBar({ ...o, sub: 'ShipLean' })))({ title: 'Backlog', right: iconBtn('search', { label: 'Search' }) }),
  sub: `<div class="subbar"><div class="seg">${['Epics', 'Features', 'Stories'].map((x) => `<button class="${x === 'Features' ? 'on' : ''}">${x}</button>`).join('')}</div></div>`,
  body: `<div class="section-h">7 open Features</div><div class="list">${F.map(([k, t, s, c], i) => `<div class="row"><span class="rank">${i + 1}</span><div class="main"><div class="t">${t}</div><div class="m">${type('feature')}<span class="key">${k}</span>${state(s, c)}</div></div></div>`).join('')}</div>`,
  bottom: tabBar('backlog', { inbox: 15, mic }), overlay });

/* ── Sheets ─────────────────────────────────────────────────────────── */
const sheet = (inner, cls = '') => `<div class="scrim"></div><div class="sheet ${cls}"><div class="grab"></div>${inner}</div>`;
const prob = (ic, title, text, cls = '') => `<div class="prob ${cls}"><span class="ic">${ic}</span><div><b>${title}</b>${text ? `<span>${text}</span>` : ''}</div></div>`;
const ctx = (label, where = '<b>SHIP-906</b>', ic = icon('spark', 'sm')) => `<div class="voice-ctx">${ic}${label}${where ? ` <span class="sep"></span> ${where}` : ''}</div>`;
const pk = ({ ty = 'story', key, t, m = '', rec = false, n = '' }) => `<div class="pk${rec ? ' rec' : ''}">${type(ty)}<div class="main"><div class="t">${t}</div><div class="m"><span class="key">${key}</span>${m}</div></div>${icon('chevron', 'sm')}</div>`;
const fixBtn = (label = 'Fix') => `<button class="btn">${icon('mic', 'sm')}${label}</button>`;
// rows(acts): preview rows with extra kinds: cant (with why), changed (Fix), conflict (someone else changed it).
const row = (a) => {
  if (a.cant) return `<div class="act cant"><span class="ic">${block()}</span><div class="what"><b>${a.title}</b><span class="why">${a.why}</span></div></div>`;
  const base = act(a);
  if (a.tag) return base.replace('class="act ', `class="act ${a.mark || ''} `).replace('</div><button', `<span class="tag ${a.tagCls}">${a.tag}</span></div><button`);
  return base;
};
const rows = (list) => `<div class="acts">${list.map(row).join('')}</div>`;
const hintToast = (ic, title, text, { bottom = 112, action = '', cls = 'hint' } = {}) =>
  `<div class="toast ${cls}" style="bottom:${bottom}px">${ic}<span class="grow"><b>${title}</b>${text ? `<span>${text}</span>` : ''}</span>${action ? `<button>${action}</button>` : ''}</div>`;
const keyboard = () => `<div class="kbd"><div class="sugg"><span>S22</span><span>“S22”</span><span>S2</span></div>
  ${['qwertyuiop', 'asdfghjkl'].map((r) => `<div class="kr">${[...r].map((c) => `<i>${c}</i>`).join('')}</div>`).join('')}
  <div class="kr"><i class="w">⇧</i>${[...'zxcvbnm'].map((c) => `<i>${c}</i>`).join('')}<i class="w">⌫</i></div>
  <div class="kr"><i class="w">123</i><i class="sp">space</i><i class="ret">Done</i></div></div>`;

/* ── States ─────────────────────────────────────────────────────────── */
App.screen({ title: 'Voice failures', states: [
  /* Nothing heard */
  { id: 'too-short', title: 'Tapped, not held', note: 'A tap under half a second. No sheet: a hint above the mic, gone in 3 s.',
    render: () => wi({ overlay: hintToast(icon('mic', 'sm'), 'Hold the mic while you speak', 'Let go when you’ve finished.') }) },

  { id: 'nothing-heard', title: 'Nothing heard', note: 'Held, but no speech. The sheet closes and a toast says why. Nothing was changed.',
    render: () => wi({ overlay: hintToast(micOff('sm'), 'Didn’t hear anything', 'Nothing was changed · listening with the iPhone microphone') }) },

  { id: 'mic-check', title: 'Nothing heard, third time', note: 'Three silent holds in a row: a mic check with a live level meter and the input in use.',
    render: () => wi({ mic: 'busy', overlay: sheet(`${ctx('Mic check', '', micOff('sm'))}
      ${prob(micOff(), 'Still not hearing you', 'Three tries in a row came through silent. Say something now to test.', 'bad')}
      <div class="level">${icon('mic', 'sm')}<div class="meter">${Array.from({ length: 16 }, (_, i) => `<i${i < 1 ? ' class="on"' : ''}></i>`).join('')}</div><span>Quiet</span></div>
      <div class="src-row">${icon('speaker', 'sm')}<div class="grow"><b>AirPods Pro</b><span>Connected, so the phone listens through them</span></div><button class="btn sm">Use iPhone mic</button></div>
      <div class="go"><button class="btn">${icon('keyboard', 'sm')}Type instead</button><button class="btn primary">Done</button></div>`) }) },

  { id: 'mic-blocked', title: 'Microphone not allowed', note: 'Permission was turned off. The mic shows crossed out; holding it opens this sheet.',
    render: () => wi({ mic: 'blocked', overlay: sheet(`${prob(micOff(), 'ShipLean can’t use the microphone', 'It’s turned off in iPhone Settings. Voice only listens while you hold the button, and nothing leaves this phone.', 'bad')}
      <div class="go"><button class="btn">${icon('keyboard', 'sm')}Type instead</button><button class="btn primary">Open Settings</button></div>
      <div class="foot">Everything else works without voice.</div>`) }) },

  /* Nothing matched */
  { id: 'no-match', title: 'Nothing matched', note: 'Heard clearly, but no item is called that. The words that didn’t match are underlined; the closest items come from search.',
    render: () => wi({ mic: 'busy', overlay: sheet(`${ctx('Nothing matched')}
      <div class="heard2">“Set ${miss('the onboarding story')} to Active”</div>
      ${prob(icon('search'), 'No work item called “the onboarding story”', 'Searched every project you’re in, closed items too.')}
      <div class="over2">Closest · tap to use it instead</div>
      <div class="picks">${pk({ key: 'SHIP-912', t: 'Sign in on the phone through the browser', m: `${state('New', 'proposed')}<span class="sep"></span>SHIP-907` })}
        ${pk({ key: 'SHIP-736', t: 'Sign-in screen on mobile web', m: `${state('New', 'proposed')}<span class="sep"></span>SHIP-707` })}</div>
      <div class="go">${fixBtn()}<button class="btn">${icon('search', 'sm')}Search</button></div>
      <div class="foot">Hold Fix and say it again · nothing was changed</div>`) }) },

  { id: 'misheard-key', title: 'Misheard key', note: 'SHIP-960 doesn’t exist; SHIP-906 sounds the same and is on this list. One tap goes on to the usual preview.',
    render: () => backlog({ mic: 'busy', overlay: sheet(`${ctx('Nothing matched', '<b>Backlog</b> · Features')}
      <div class="heard2">“Move ${miss('SHIP-960')} up to second”</div>
      ${prob(help(), 'There’s no SHIP-960', 'Did you mean the Feature 4th on this list?')}
      <div class="picks">${pk({ ty: 'feature', key: 'SHIP-906', t: 'Voice commands on the mobile app', m: `${state('New', 'proposed')}<span class="sep"></span>rank 4 → 2`, rec: true })}</div>
      <div class="go">${fixBtn()}<button class="btn primary">Yes, SHIP-906</button></div>
      <div class="foot">Nothing changes until you apply the preview</div>`) }) },

  /* No valid action */
  { id: 'web-only', title: 'Can’t do that on the phone', note: 'The model understood, but moving tasks is web only. Says where it can be done.',
    render: () => wi({ mic: 'busy', overlay: sheet(`${ctx('Can’t do this here')}
      <div class="heard2">“Move the ${hot('checksum task')} to Done”</div>
      ${prob(web(), 'Tasks are moved on the web', 'On the phone, tasks show only as counts. The checksum task is on SHIP-921, blocked, assigned to Sam.', 'info')}
      <div class="go"><button class="btn">Open on the web</button><button class="btn primary">OK</button></div>
      <div class="foot"><a>What can I say here?</a></div>`) }) },

  { id: 'bad-state', title: 'No such state', note: 'Features have no Done. The states this item can move to are offered as chips, and one tap opens the preview.',
    render: () => wi({ mic: 'busy', overlay: sheet(`${ctx('Can’t do this here')}
      <div class="heard2">“Set this to ${miss('Done')}”</div>
      ${prob(icon('flag'), 'Features have no Done state', 'Pick one of SHIP-906’s states:')}
      <div class="chips2"><span class="chip cur">New · now</span><span class="chip">Active</span><span class="chip">Resolved</span><span class="chip">Closed</span></div>
      <div class="go">${fixBtn()}<button class="btn">Cancel</button></div>`) }) },

  { id: 'unclear', title: 'Not a command', note: 'Words, but no change in them. Offers to keep them as a note (still previewed), Fix, or what can be said.',
    render: () => wi({ mic: 'busy', overlay: sheet(`${ctx('No change found')}
      <div class="heard2">“Hmm, the S22 thing, what was it, the warm one”</div>
      ${prob(help(), 'That isn’t a change I can make', 'Keep it as a note on SHIP-906, or say it again.')}
      <div class="quote2">“Hmm, the S22 thing, what was it, the warm one”</div>
      <div class="go">${fixBtn()}<button class="btn primary">${icon('note', 'sm')}Add as a note</button></div>
      <div class="foot"><a>What can I say here?</a></div>`) }) },

  { id: 'partial', title: 'Part of it can’t be done', note: 'Two changes are fine, one is web only. The preview keeps it, struck out with the reason; Apply does the other two.',
    render: () => wi({ mic: 'busy', overlay: sheet(`${ctx('2 changes to apply · 1 can’t be done')}
      <div class="heard" style="margin-top:10px">“Set this to Active, approve D10, and move the checksum task to Done”</div>
      ${rows([ACTS.state, ACTS.d10, { cant: true, title: 'Checksum task → Done', why: 'Tasks are moved on the web’s task board.' }])}
      <div class="go">${fixBtn()}<button class="btn primary">Apply 2</button></div>
      <div class="say-yes">Or say “yes” <span class="sep"></span> nothing changes until you apply</div>`, 'preview') }) },

  { id: 'what-can-i-say', title: 'What can I say here?', note: 'From “What can I say here?” or saying it. This screen’s voice actions, to read; tasks and sprints point to the web.',
    render: () => wi({ overlay: sheet(`${ctx('On this screen', '<b>SHIP-906</b> Feature')}
      <div class="say-list">
        <div class="sr">${icon('flag', 'sm')}<div><b>“Set this to Active”</b><span>State, health, owner: “assign to Priya”</span></div></div>
        <div class="sr">${icon('check', 'sm')}<div><b>“Approve D10” · “discuss D11”</b><span>Decisions waiting on you</span></div></div>
        <div class="sr">${icon('message', 'sm')}<div><b>“Reply: try it on the S22 first”</b><span>Answers Claude Code’s question</span></div></div>
        <div class="sr">${icon('note', 'sm')}<div><b>“Add a note: …”</b><span>Kept word for word, with the clip</span></div></div>
        <div class="sr">${icon('search', 'sm')}<div><b>“What’s left on this?” · “open SHIP-921”</b><span>Questions and jumps change nothing</span></div></div>
        <div class="sr">${icon('undo', 'sm')}<div><b>“Undo that”</b><span>Your last voice change</span></div></div>
        <div class="sr web">${web('sm')}<div><b>On the web</b><span>Moving tasks, sprints and boards</span></div></div>
      </div><div class="go"><button class="btn primary">Done</button></div>`) }) },

  /* Fix */
  { id: 'fix-hold', title: 'Fix: say what’s wrong', note: 'Holding Fix on the preview. The preview folds to a list; say only the correction, or “start over”.',
    render: () => wi({ mic: 'busy', overlay: sheet(`<div class="voice-ctx"><span class="live-dot"></span>Fixing <span class="sep"></span> <b>SHIP-906</b></div>
      <div class="fixing"><div class="h">${icon('spark', 'sm')}The preview so far</div><ol><li>State: New → Active</li><li class="tgt">Approve D10</li><li>Note: “The S22 numbers are fine…”</li></ol></div>
      <div class="transcript">No, ${hot('D11')}, not ${hot('D10')}</div>
      <div class="try"><span class="chip">“start over”</span><span class="chip">“drop the note”</span><span class="chip">“the note should say …”</span></div>
      ${wave()}<div class="voice-hint">Release to update <span class="sep"></span> Slide left to keep the preview</div>`, 'listening fix') }) },

  { id: 'fix-preview', title: 'Fix: updated preview', note: 'Only the corrected row changes, marked Fixed. Both things you said are shown.',
    render: () => wi({ mic: 'busy', overlay: sheet(`${ctx('3 changes to apply')}
      <div class="heard" style="margin-top:10px">“${HEARD}”<span class="fixline">Fix: “No, D11, not D10”</span></div>
      ${rows([ACTS.state, { kind: 'approve', title: 'Approve D11', detail: 'Voice button bottom right, in the dock on detail screens', tag: `${icon('mic', 'sm')}Fixed · was D10`, tagCls: 'fixed', mark: 'changed' }, ACTS.note])}
      <div class="go">${fixBtn()}<button class="btn primary">Apply</button></div>
      <div class="say-yes">Or say “yes” <span class="sep"></span> nothing changes until you apply</div>`, 'preview') }) },

  { id: 'fix-type', title: 'Fix: correct a word by typing', note: 'Tap a quoted note to edit it. Here “has 22” was misheard; the note is marked edited and keeps its clip.',
    render: () => wi({ mic: 'busy', overlay: `<div class="scrim"></div><div class="sheet preview" style="bottom:292px;padding-bottom:14px;border-radius:20px"><div class="grab"></div>
      ${ctx('Editing the note')}
      <div class="acts" style="margin-top:12px"><div class="act act-note"><span class="ic">${icon('note')}</span><div class="what"><b>Note on SHIP-906</b>
        <div class="edit-field">The <span class="typed">S22</span><span class="caret"></span> numbers are fine for v1, keep the 4B path for phones with 12 gigs</div>
        <div class="edited">${pencil('sm')}Edited by you · the 6 s clip is kept · heard “has 22”</div></div></div></div>
      </div>${keyboard()}` }) },

  /* Apply failing on the network */
  { id: 'apply-failed', title: 'Apply failed', note: 'No answer from ShipLean. The preview stays, nothing was changed, and the changes can wait to send.',
    render: () => wi({ mic: 'busy', overlay: sheet(`${ctx('3 changes to apply')}
      <div class="band bad">${cloudOff('sm')}<div class="grow"><b>Couldn’t reach ShipLean</b><span>Nothing was changed. Try again, or keep these and send them when you’re online.</span></div></div>
      ${rows([ACTS.state, ACTS.d10, ACTS.note])}
      <div class="go"><button class="btn">${icon('clock', 'sm')}Send when online</button><button class="btn primary">${retry('sm')}Try again</button></div>
      <div class="discard"><a>Discard</a> <span class="sep"></span> the words and clip are thrown away</div>`, 'preview') }) },

  { id: 'apply-queued', title: 'Waiting to send', note: 'Offline: the changes show on the item as waiting, like the Inbox’s answers, and send by themselves. Undo still works.',
    render: () => wi({ sub: 'Feature · New', body: wiNotesBody({ mode: 'pending', banner: `<div class="banner off">${cloudOff()}<div class="grow"><b>You’re offline</b><span class="muted">3 voice changes wait to send. They go by themselves when you’re back online.</span></div></div><div style="height:12px"></div>` }),
      overlay: hintToast(icon('clock', 'sm'), '3 changes wait to send', '', { action: 'Undo' }) }) },

  { id: 'apply-conflict', title: 'Changed while you were deciding', note: 'Priya resolved SHIP-906 a minute ago. Nothing was applied; the row now reads Resolved → Active, so confirm again.',
    render: () => wi({ mic: 'busy', overlay: sheet(`${ctx('3 changes to apply')}
      <div class="band warn">${icon('alert', 'sm')}<div class="grow"><b>SHIP-906 changed a minute ago</b><span>Nothing was applied. Check the marked change, then apply again.</span></div></div>
      ${rows([{ kind: 'field', icon: 'flag', title: 'State: Resolved → Active', detail: '<span class="old">New</span> → Resolved by Priya · 9:42', tag: `${avatar('PR', { sm: true, color: colors.PR })}Priya changed this`, tagCls: 'moved', mark: 'conflict' }, ACTS.d10, ACTS.note])}
      <div class="go">${fixBtn()}<button class="btn primary">Apply</button></div>
      <div class="say-yes">Remove the state change with ✕ to keep it Resolved</div>`, 'preview') }) },

  { id: 'send-failed', title: 'Sent later, one refused', note: 'Back online, the queued changes sent; D10 had been withdrawn meanwhile. The rest landed. A banner on the item says which.',
    render: () => wi({ sub: 'Feature · Active', body: `<div class="banner bad">${icon('alert')}<div class="grow"><b>1 of 3 voice changes wasn’t applied</b><span class="muted">“Approve D10” from 9:41: Claude Code withdrew D10 at 9:50. The state and your note went through.</span>
      <div class="acts2"><button class="btn sm primary">Show D10</button><button class="btn sm">Dismiss</button></div></div></div><div style="height:12px"></div>${featureTop({ st: ['Active', 'in-progress'] })}${notes({ mode: 'fresh', noD10: true })}` }) },

  /* Undo after it applies */
  { id: 'undone', title: 'Undone', note: 'Undo on the toast: the state, D10 and the note go back at once. History keeps one line saying so.',
    render: () => wi({ body: wiNotesBody({ mode: 'undone' }), overlay: hintToast(icon('undo', 'sm'), 'Undone · SHIP-906 is as it was', '', { }) }) },

  { id: 'undo-later', title: 'Undo after the toast', note: 'The toast is gone. The voice change row in Notes keeps Undo for 10 minutes; the undo is previewed like any change.',
    render: () => wi({ sub: 'Feature · Active', body: wiNotesBody({ mode: 'group', st: ['Active', 'in-progress'] }), mic: 'busy', overlay: sheet(`${ctx('Undo 3 changes', '<b>SHIP-906</b> · from 9:41', icon('undo', 'sm'))}
      ${rows([{ kind: 'field', icon: 'flag', title: 'State: Active → New', detail: 'Back to what it was' }, { kind: 'approve', icon: 'undo', title: 'D10 back to waiting', detail: 'It shows in Needs you again' }, { kind: 'note', title: 'Remove your note', detail: '“The S22 numbers are fine for v1…” and its clip' }])}
      <div class="go"><button class="btn">Cancel</button><button class="btn primary">${icon('undo', 'sm')}Undo</button></div>
      <div class="say-yes">Or say “yes”</div>`, 'preview') }) },

  { id: 'undo-partial', title: 'Undo, part of it already used', note: 'Claude Code picked up the item and read the D10 answer. The other two undo; D10 is changed as a decision instead.',
    render: () => wi({ sub: 'Feature · Active', body: wiNotesBody({ mode: 'group', partial: true, st: ['Active', 'in-progress'] }), mic: 'busy', overlay: sheet(`${ctx('Undo 2 of 3', '<b>SHIP-906</b> · from 9:41', icon('undo', 'sm'))}
      ${rows([{ kind: 'field', icon: 'flag', title: 'State: Active → New', detail: 'Back to what it was' }, { kind: 'note', title: 'Remove your note', detail: '“The S22 numbers are fine for v1…” and its clip' },
        { cant: true, title: 'D10 back to waiting', why: 'Claude Code picked up SHIP-906 at 9:46 and has read your answer. Change the answer instead, and the next agent reads that.' }])}
      <div class="go"><button class="btn">Change D10</button><button class="btn primary">${icon('undo', 'sm')}Undo 2</button></div>`, 'preview') }) },

  { id: 'undo-failed', title: 'Undo failed', note: 'Undo couldn’t reach ShipLean. Nothing was undone, and Try again stays on the toast. (Changes still waiting to send undo at once.)',
    render: () => wi({ sub: 'Feature · Active', body: wiNotesBody({ mode: 'fresh', st: ['Active', 'in-progress'] }), overlay: hintToast(cloudOff('sm'), 'Couldn’t undo: no connection', 'Nothing was undone', { cls: 'bad', action: 'Try again' }) }) },
]});
</script></body></html>
