<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShipLean · Features and Epics boards (reference)</title>
<!--
  Reference Features and Epics boards: Boards › Features (?level=epics for Boards › Epics). The same Kanban
  board as the Stories board one and two levels up, with its own columns, WIP limits and settings.
  Open directly in a browser. Uses ../tokens.css, shiplean.css and shared.js only; no build step.
  One type per board, so each column maps to a single state (Shaping and New both mean New on the Features board).
  Cards: type icon, key, the item's own points with the sum of the stories and bugs below greyed beside it
  (warn when the sum is more than 25% over), title, parent (the Epic, or the parent Feature for a nested one),
  owner, tags in this board's tag colours, and the child roll-ups (Board settings › Annotations):
  Features board: stories, bugs and nested Features, each closed/total; Epics board: Features, stories, bugs.
  Roll-ups count everything below, including under nested Features. Click a roll-up to list the children
  inline with their states, and add a child from there.
  When every child is closed and the card isn't in Done, it offers Move to Done; nothing moves on its own.
  Moving a card into Done with open children asks first: a dialog lists what's still open, with Move to Done
  anyway or Cancel (?confirm=SHIP-102 opens it). A teammate's move arrives without asking. Once there, the
  roll-ups turn warn. There's no pull rule on these levels: the assignee is the owner and is set by hand.
  Features board: Lanes None or By Epic (?lanes=epic), one lane per Epic in backlog order; dropping a Feature
  into another Epic's lane makes that Epic its parent. ?open=SHIP-101 opens that card's child list.
  Keyboard, filter (keyword, people, Epic), Done showing the 4 most recent, and real time all work as on the
  Stories board. The "Preview" panel bottom-left is a review aid, not part of the design (hide it with ?shot).
-->
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="shiplean.css">
<script src="shared.js"></script>
<style>
:root { --rule-blocked: var(--color-danger); }
[hidden] { display: none !important; }

.sep { width: 1px; height: 20px; background: var(--color-border); }
.fbar { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; padding: 6px var(--space-4); background: var(--color-bg); border-bottom: 1px solid var(--color-border); flex: none; font-size: var(--text-sm); }
.fbar .field[type=search] { width: 200px; }
.who { display: inline-flex; align-items: center; gap: 2px; }
.who button { display: inline-grid; place-items: center; height: 26px; min-width: 26px; padding: 0 3px; border: 0; border-radius: 999px; background: transparent; cursor: pointer; color: var(--color-muted); font-size: var(--text-sm); }
.who button:hover { background: var(--color-surface-2); }
.who button:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 1px; }
.who button[aria-pressed="true"] .av { box-shadow: 0 0 0 2px var(--color-bg), 0 0 0 4px var(--color-accent); }
.who button.un { display: inline-flex; gap: 5px; padding: 0 8px 0 3px; }
.who button.un[aria-pressed="true"] { background: var(--color-accent-soft); color: var(--color-text); font-weight: var(--weight-semibold); }
.banner { display: flex; gap: var(--space-2); align-items: center; padding: 6px var(--space-4); font-size: var(--text-sm); border-bottom: 1px solid var(--color-border); background: var(--color-surface); flex: none; }
.banner.warn { border-left: 3px solid var(--color-warn); background: color-mix(in srgb, var(--color-warn) 12%, var(--color-surface)); }
.banner.ok { border-left: 3px solid var(--color-ok); background: color-mix(in srgb, var(--color-ok) 12%, var(--color-surface)); }

/* Board: one grid template shared by the header and every lane */
.board { flex: 1; min-height: 0; overflow: auto; background: var(--color-bg); }
.bwrap { padding: 0 var(--space-4) var(--space-4); }
.bgrid { display: grid; grid-template-columns: repeat(var(--ncols), minmax(0, 1fr)); column-gap: var(--space-2); }
.bhead { position: sticky; top: 0; z-index: 4; padding: var(--space-2) 0 6px; background: var(--color-bg); }
.colh { display: grid; gap: 2px; align-content: start; min-width: 0; padding: 5px 6px 5px var(--space-2); background: var(--color-surface); border: 1px solid var(--color-border); border-top: 2px solid var(--color-border); border-radius: var(--radius-sm); }
.colh.over { border-top-color: var(--color-danger); background: color-mix(in srgb, var(--color-danger) 6%, var(--color-surface)); }
.colh .top { display: flex; align-items: center; gap: 6px; min-width: 0; height: 20px; }
.colh .nm { font-size: var(--text-sm); font-weight: var(--weight-semibold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wip { font-size: var(--text-xs); font-weight: var(--weight-medium); font-variant-numeric: tabular-nums; color: var(--color-muted); white-space: nowrap; }
.wip.over { height: 18px; padding: 0 6px; border-radius: 999px; display: inline-flex; align-items: center; background: color-mix(in srgb, var(--color-danger) 18%, transparent); color: var(--color-danger); font-weight: var(--weight-semibold); }
.colh .map { font-size: var(--text-2xs); color: var(--color-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; height: 16px; line-height: 16px; }

/* Lanes (Features board, By Epic) */
.lane + .lane { margin-top: var(--space-2); }
.lane-h { display: flex; align-items: center; gap: var(--space-2); height: 28px; padding: 0 var(--space-1); font-size: var(--text-sm); position: sticky; left: 0; }
.lane-h b { display: inline-flex; align-items: center; gap: 6px; font-weight: var(--weight-semibold); }
.lane-h .ib { width: 20px; height: 20px; }
.cell { display: flex; flex-direction: column; gap: 6px; min-width: 0; min-height: 64px; padding: 6px; border-radius: var(--radius-sm); background: color-mix(in srgb, var(--color-surface-2) 55%, transparent); transition: background .1s; }
.cell.over { background: var(--color-accent-soft); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--color-accent) 55%, transparent); }
.cell.drop-end::after { content: ""; display: block; height: 2px; border-radius: 1px; background: var(--color-accent); }
.cell .more { justify-content: center; height: 24px; font-size: var(--text-xs); color: var(--color-muted); }
.cell .empty { padding: 8px 4px; font-size: var(--text-xs); color: var(--color-muted); text-align: center; }
.addc { justify-content: flex-start; height: 26px; padding: 0 6px; font-size: var(--text-xs); color: var(--color-muted); border: 1px dashed var(--color-border); background: transparent; }
.addc:hover { color: var(--color-text); }
.add-field { display: grid; gap: 4px; }
.add-field .field { width: 100%; }
.add-field .xs { color: var(--color-muted); }

/* Cards */
.card { position: relative; display: grid; gap: 5px; padding: 7px 8px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-surface); box-shadow: 0 1px 1px rgb(16 24 40 / .04); cursor: grab; font-size: var(--text-sm); }
.card:hover { border-color: color-mix(in srgb, var(--color-accent) 50%, var(--color-border)); }
.card:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 1px; }
.card.dragging { opacity: .4; }
.card.drop-before::before { content: ""; position: absolute; left: 0; right: 0; top: -5px; height: 2px; border-radius: 1px; background: var(--color-accent); }
.card.rule-blocked { background: color-mix(in srgb, var(--rule-blocked) 9%, var(--color-surface)); border-color: color-mix(in srgb, var(--rule-blocked) 40%, var(--color-border)); box-shadow: inset 3px 0 0 var(--rule-blocked); }
.card.flash { animation: flash 1.8s ease-out; z-index: 2; }
@keyframes flash { 0%, 30% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-warn) 45%, transparent); background: color-mix(in srgb, var(--color-warn) 18%, var(--color-surface)); } 100% { } }
.card.moving { z-index: 5; }
.card .r1 { display: flex; align-items: center; gap: 6px; min-width: 0; }
.card .r1 .key { font-size: var(--text-2xs); }
.cpts { margin-left: auto; height: 18px; padding: 0 6px; border-radius: 999px; background: var(--color-surface-2); font-size: var(--text-xs); font-weight: var(--weight-semibold); font-variant-numeric: tabular-nums; line-height: 18px; white-space: nowrap; }
.cpts .sig { color: var(--color-muted); font-weight: var(--weight-regular); }
.cpts .sig.big { color: var(--color-warn); font-weight: var(--weight-semibold); }
.cpts .unest { color: var(--color-warn); }
.card .ttl { font-weight: var(--weight-semibold); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card.done-col .ttl { color: var(--color-muted); }
.card .pr { display: flex; align-items: center; gap: 5px; min-width: 0; font-size: var(--text-xs); color: var(--color-muted); }
.card .pr .ti, .anns .ti, .kid .ti { width: 14px; height: 14px; font-size: 8px; }
.card .pr .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .ft { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.tag { display: inline-flex; align-items: center; height: 16px; padding: 0 6px; border-radius: var(--radius-xs); font-size: var(--text-2xs); font-weight: var(--weight-medium); white-space: nowrap; color: var(--color-text); background: color-mix(in srgb, var(--tag, var(--color-muted)) 20%, transparent); }
.take { flex: none; padding: 0; border: 0; background: none; border-radius: 50%; cursor: pointer; display: inline-grid; }
.take:hover .av { box-shadow: 0 0 0 2px var(--color-accent-soft); }
.take:hover .av.none { border-color: var(--color-accent); background: var(--color-accent-soft); }
.take:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 1px; }
.card .av.none { border-color: color-mix(in srgb, var(--color-muted) 70%, transparent); }

/* Child roll-ups (annotations): one button per card, it opens the child list */
.ar { display: flex; align-items: center; gap: 6px; min-width: 0; }
.anns { display: inline-flex; align-items: center; gap: 8px; min-width: 0; height: 22px; padding: 0 6px 0 4px; margin-left: -4px; border: 1px solid transparent; border-radius: var(--radius-sm); background: transparent; cursor: pointer; color: var(--color-muted); font-size: var(--text-xs); font-variant-numeric: tabular-nums; }
.anns:hover, .anns[aria-expanded="true"] { border-color: var(--color-border); background: var(--color-surface-2); color: var(--color-text); }
.anns:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 1px; }
.anns .chev { font-size: 9px; color: var(--color-muted); }
.an { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.an.ok { color: var(--color-ok); }
.an.warn { color: var(--color-warn); font-weight: var(--weight-semibold); }
.an.none { font-style: italic; }
.mbar { height: 4px; border-radius: 2px; background: var(--color-surface-2); overflow: hidden; display: flex; }
.mbar i { display: block; height: 100%; }
.alldone { display: flex; align-items: center; gap: 6px; padding: 4px 4px 4px 8px; border-radius: var(--radius-sm); background: color-mix(in srgb, var(--color-ok) 12%, transparent); font-size: var(--text-xs); }
.alldone .btn { height: 22px; padding: 0 8px; font-size: var(--text-xs); margin-left: auto; }
.kids { display: grid; gap: 1px; margin: 0 -4px; padding: 4px; border-top: 1px solid var(--color-border); cursor: default; }
.kid { display: flex; align-items: center; gap: 6px; min-width: 0; height: 24px; padding: 0 4px; border-radius: var(--radius-xs); font-size: var(--text-xs); }
.kid:hover { background: var(--color-surface-2); }
.kid .key { font-size: var(--text-2xs); }
.kid .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kid.closed .n { color: var(--color-muted); }
.kid.sub { padding-left: 18px; }
.kid .st { font-size: var(--text-2xs); }
.kid-add { display: flex; gap: 2px; padding-top: 2px; }
.kid-add .btn { height: 22px; padding: 0 6px; font-size: var(--text-xs); color: var(--color-muted); }
.compact .card .ttl { -webkit-line-clamp: 1; }

/* Popovers: column definition of done, assignee menu */
.bpop { position: fixed; z-index: 45; width: 290px; display: grid; gap: var(--space-2); padding: var(--space-3); background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); box-shadow: 0 12px 32px rgb(0 0 0 / .18); font-size: var(--text-sm); }
.bpop h3 { margin: 0; font-size: var(--text-md); font-weight: var(--weight-semibold); }
.bpop .md ul { margin: 0; padding-left: 18px; display: grid; gap: 2px; }
.bpop .maps { display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; align-items: center; }
.bpop .maps > span:nth-child(odd) { display: inline-flex; gap: 6px; align-items: center; color: var(--color-muted); }
.bpop footer { display: flex; align-items: center; gap: var(--space-2); padding-top: var(--space-2); border-top: 1px solid var(--color-border); font-size: var(--text-xs); color: var(--color-muted); }
.bpop.menu { width: 220px; padding: var(--space-1); gap: 0; }
.bpop.menu .overline { padding: 6px var(--space-2) 4px; }
.bpop.menu button { display: flex; align-items: center; gap: var(--space-2); height: 30px; padding: 0 var(--space-2); border: 0; border-radius: var(--radius-sm); background: transparent; cursor: pointer; text-align: left; font-size: var(--text-sm); }
.bpop.menu button:hover, .bpop.menu button[aria-checked="true"] { background: var(--color-accent-soft); }
.dialog.confirm { width: min(440px, 100%); }
.dialog.confirm .kids { margin: 0; padding: 4px 0 0; }
.toast { max-width: 760px; }
</style>
</head>
<body>
<div id="appbar"></div>
<div class="toolbar">
  <div class="seg" role="group" aria-label="Board level"><button type="button" id="lvEpics">Epics</button><button type="button" id="lvFeatures">Features</button><button type="button" onclick="location.href='board.html'">Stories</button></div>
  <span class="sm muted" id="summary"></span>
  <span class="spacer"></span>
  <span class="check" id="lanesCtl">Lanes <span class="seg" role="group" aria-label="Lanes"><button type="button" data-lanes="none">None</button><button type="button" data-lanes="epic" title="One lane per Epic, in backlog order">By Epic</button></span></span>
  <div class="seg" role="group" aria-label="Cards"><button type="button" data-cards="full" aria-pressed="true">Full cards</button><button type="button" data-cards="compact" aria-pressed="false">Compact</button></div>
  <span class="sep"></span>
  <button class="btn" type="button" id="btnFilter" aria-expanded="false">Filter</button>
  <a class="btn" id="btnSettings" href="board-settings.html" title="Columns, swimlanes, card fields, styles, tag colours, annotations, card reordering">⚙ Board settings</a>
</div>
<div class="fbar" id="fbar" hidden>
  <input class="field" type="search" id="fq" placeholder="Filter by keyword or key" aria-label="Filter by keyword">
  <span class="who" id="fwho" role="group" aria-label="People"></span>
  <select class="field" id="fepic" aria-label="Epic"></select>
  <button class="btn ghost" type="button" id="fclear">Clear</button>
  <span class="spacer"></span><span class="xs muted" id="fcount"></span>
</div>
<div id="banners"></div>
<div class="board" id="board"><div class="bwrap" id="bwrap"></div></div>

<script>
(() => {
  const { ME, people, items, doneItems, epics, features, stateCategory, tIcon, st, av, esc, toast } = SL;
  const params = new URLSearchParams(location.search);
  const LEVEL = params.get('level') === 'epics' ? 'epics' : 'features';
  const TYPE = LEVEL === 'epics' ? 'epic' : 'feature';
  document.getElementById('appbar').outerHTML = SL.appBar('boards');
  const $ = id => document.getElementById(id);

  /* Board config per level (Board settings › Columns). One type per board, so one state per column. */
  const COLS = LEVEL === 'features' ? [
    { id: 'new', name: 'New', state: 'New', dod: '- Problem and the outcome we want, in one paragraph\n- Linked to an **Epic**' },
    { id: 'shaping', name: 'Shaping', state: 'New', dod: '- Stories split out and estimated\n- Fits in about three sprints\n- Open questions listed on the item' },
    { id: 'prog', name: 'In progress', state: 'Active', wip: 3, dod: '- Stories are being pulled into sprints\n- Behind a feature flag' },
    { id: 'release', name: 'Releasing', state: 'Resolved', wip: 2, dod: '- Every story and bug closed\n- Rolling out behind its flag' },
    { id: 'done', name: 'Done', state: 'Closed', dod: '- Flag on for everyone\n- Outcome measured and noted on the item' },
  ] : [
    { id: 'new', name: 'New', state: 'New', dod: '- Why it matters, and how we will know it worked' },
    { id: 'prog', name: 'In progress', state: 'Active', wip: 3, dod: '- Features split out and ranked\n- At least one Feature in progress' },
    { id: 'release', name: 'Rolling out', state: 'Resolved', dod: '- Every Feature resolved or closed' },
    { id: 'done', name: 'Done', state: 'Closed', dod: '- Outcome reviewed with stakeholders' },
  ];
  const DONE_N = 4;
  // Tag colours belong to the board; values are token names, never raw colours.
  const TAG_COLOUR = { Payments: '--chart-committed', Mobile: '--color-info', 'Feedback Ticket': '--color-warn', 'Tech debt': '--color-muted', Security: '--color-ok', Blocked: '--rule-blocked' };
  const STYLE_RULES = [{ name: 'Blocked', cls: 'rule-blocked', when: c => c.tags.includes('Blocked') }];

  /* Page-local sample: more Features and Epics, and the stories and bugs under the new ones. */
  const allEpics = [...epics.map(e => ({ ...e })),
    { key: 'SHIP-89', title: 'Payments resilience', points: 15 },
    { key: 'SHIP-94', title: 'Marketplace launch', points: null }];
  const allFeatures = [...features.map(f => ({ ...f })),
    { key: 'SHIP-105', title: 'Coupons v2', parent: 'SHIP-90', points: 13 },
    { key: 'SHIP-106', title: 'Order tracking page', parent: 'SHIP-90', points: null },
    { key: 'SHIP-107', title: 'Two-factor recovery codes', parent: 'SHIP-91', points: 8 },
    { key: 'SHIP-109', title: 'Merchant CSV exports', parent: 'SHIP-92', points: 5 },
    { key: 'SHIP-110', title: 'Status page', parent: 'SHIP-93', points: 5 },
    { key: 'SHIP-111', title: 'Login audit trail', parent: 'SHIP-91', points: 8 },
    { key: 'SHIP-112', title: 'Retry failed payments', parent: 'SHIP-89', points: 8 },
    { key: 'SHIP-113', title: 'Card account updater', parent: 'SHIP-89', points: 5 }];
  const extraKids = [
    ['115', 'story', 'Stack two coupons on one order', 'Coupons v2', 'Closed', 3], ['116', 'story', 'Coupon usage report', 'Coupons v2', 'Closed', 3],
    ['117', 'story', 'Expiry dates on coupons', 'Coupons v2', 'Closed', 2], ['119', 'bug', 'Coupon applied twice on retry', 'Coupons v2', 'Closed', 1],
    ['121', 'story', 'Coupon codes ignore case', 'Coupons v2', 'Closed', 2],
    ['167', 'story', 'Generate recovery codes', 'Two-factor recovery codes', 'New', 3], ['168', 'story', 'Sign in with a recovery code', 'Two-factor recovery codes', 'New', 3],
    ['169', 'story', 'Regenerate codes from settings', 'Two-factor recovery codes', 'New', 2],
    ['164', 'story', 'Export orders to CSV', 'Merchant CSV exports', 'New', 3], ['159', 'story', 'Schedule a weekly export', 'Merchant CSV exports', 'New', 2],
    ['122', 'story', 'Public status page', 'Status page', 'Closed', 3], ['123', 'story', 'Incident banner in the app', 'Status page', 'Closed', 2],
    ['132', 'story', 'Record sign-in events', 'Login audit trail', 'Closed', 3], ['133', 'story', 'Show sign-in history to the user', 'Login audit trail', 'Closed', 3],
    ['134', 'story', 'Email on sign-in from a new device', 'Login audit trail', 'Closed', 2], ['135', 'bug', 'Audit times shown in UTC', 'Login audit trail', 'Closed', 1],
    ['125', 'story', 'Retry soft declines', 'Retry failed payments', 'Closed', 5], ['127', 'story', 'Dunning emails', 'Retry failed payments', 'Closed', 3],
    ['128', 'story', 'Card updater webhook', 'Card account updater', 'Closed', 3], ['130', 'bug', 'Updated card not shown until refresh', 'Card account updater', 'Closed', 2],
  ].map(([n, type, title, parent, state, points]) => ({ key: 'SHIP-' + n, type, title, parent, state, points }));
  const leaves = [...items, ...doneItems, ...extraKids]; // stories and bugs, in backlog order

  // [key, column, owner, tags] in column_order; Done is newest first.
  const featureLayout = [
    ['SHIP-106', 'new', null, []], ['SHIP-109', 'new', null, ['Feedback Ticket']],
    ['SHIP-107', 'shaping', null, ['Security', 'Blocked']], ['SHIP-108', 'shaping', null, []], ['SHIP-104', 'shaping', 'tom', ['Tech debt']],
    ['SHIP-101', 'prog', 'priya', ['Payments']], ['SHIP-102', 'prog', 'sam', ['Mobile']], ['SHIP-103', 'prog', 'ana', []],
    ['SHIP-111', 'release', 'mei', ['Security']],
    ['SHIP-112', 'done', 'priya', ['Payments']], ['SHIP-105', 'done', 'tom', ['Payments']], ['SHIP-110', 'done', 'tom', []], ['SHIP-113', 'done', 'mei', ['Payments']],
  ];
  const epicLayout = [
    ['SHIP-92', 'new', 'ana', []], ['SHIP-93', 'new', 'tom', ['Tech debt']], ['SHIP-94', 'new', null, []],
    ['SHIP-90', 'prog', 'priya', ['Payments']], ['SHIP-91', 'prog', 'sam', ['Security']],
    ['SHIP-89', 'done', 'priya', ['Payments']],
  ];
  // Feature states come from the Features board, so the Epics board's Feature roll-ups agree with it.
  const FEATURE_STATE = { new: 'New', shaping: 'New', prog: 'Active', release: 'Resolved', done: 'Closed' };
  allFeatures.forEach(f => { const l = featureLayout.find(x => x[0] === f.key); f.state = FEATURE_STATE[l[1]]; });
  const toCards = (layout, src) => layout.map(([key, track, assignee, tags]) => ({ ...src.find(x => x.key === key), track, assignee, tags: [...tags] }));
  const cards = LEVEL === 'features' ? toCards(featureLayout, allFeatures) : toCards(epicLayout, allEpics);
  let nextKey = LEVEL === 'features' ? 114 : 95;

  const COL = id => COLS.find(c => c.id === id);
  const colOf = c => COL(c.track);
  const stateOf = c => colOf(c).state;
  const countCol = id => cards.filter(c => c.track === id).length;
  const overWip = col => col.wip && countCol(col.id) > col.wip;
  const first = p => people[p].name.split(' ')[0];
  const closed = x => stateCategory[x.state] === 'completed';
  // Features as they currently stand: on the Features board the cards are the live copy.
  const featureList = () => (LEVEL === 'features' ? cards.map(c => ({ ...c, state: stateOf(c) })).concat(allFeatures.filter(f => !cards.some(c => c.key === f.key))) : allFeatures);
  const byKey = k => allEpics.find(e => e.key === k) || featureList().find(f => f.key === k);
  const subFeatures = f => featureList().filter(x => x.parent === f.key);
  const deepFeatures = f => subFeatures(f).flatMap(x => [x, ...deepFeatures(x)]);
  const leavesUnder = f => [...leaves.filter(i => i.parent === f.title), ...subFeatures(f).flatMap(leavesUnder)];
  const rootEpic = f => { const p = byKey(f.parent); return !p || allEpics.includes(p) ? p : rootEpic(p); };

  // Roll-ups (annotations): [closed, total] per child type, counting everything below, nested Features included.
  function rollup(c) {
    const fs = LEVEL === 'epics' ? featureList().filter(f => f.parent === c.key).flatMap(f => [f, ...deepFeatures(f)]) : deepFeatures(c);
    const ls = LEVEL === 'epics' ? featureList().filter(f => f.parent === c.key).flatMap(leavesUnder) : leavesUnder(c);
    const pair = list => [list.filter(closed).length, list.length];
    return { feature: pair(fs), story: pair(ls.filter(i => i.type === 'story')), bug: pair(ls.filter(i => i.type === 'bug')), sum: ls.reduce((a, i) => a + (i.points || 0), 0) };
  }
  const ANN = LEVEL === 'features' ? [['story', 'user stories'], ['bug', 'bugs'], ['feature', 'nested Features']] : [['feature', 'Features'], ['story', 'user stories'], ['bug', 'bugs']];
  const openCount = r => ANN.map(([t, label]) => [r[t][1] - r[t][0], label]).filter(([n]) => n);
  const openText = r => openCount(r).map(([n, label]) => `${n} ${n === 1 ? label.replace(/s$/, '').replace('storie', 'story') : label}`).join(', ').replace(/, ([^,]*)$/, ' and $1');

  const view = { lanes: LEVEL === 'features' && params.get('lanes') === 'epic' ? 'epic' : 'none', compact: false, collapsed: new Set(), open: new Set(params.get('open') ? [params.get('open')] : []), showOlder: false, adding: false, q: '', who: new Set(), epic: '', filterOpen: false };
  const laneOf = c => (view.lanes === 'epic' ? 'epic:' + (rootEpic(c)?.key || 'none') : 'all');
  const filtering = () => !!(view.q || view.who.size || view.epic);
  const passes = c => {
    if (view.q) { const q = view.q.toLowerCase(); if (!c.title.toLowerCase().includes(q) && !c.key.toLowerCase().includes(q) && !c.tags.some(t => t.toLowerCase().includes(q))) return false; }
    if (view.who.size && !view.who.has(c.assignee || '')) return false;
    if (view.epic && rootEpic(c)?.key !== view.epic) return false;
    return true;
  };

  /* Rendering */
  const mdLite = s => '<ul>' + s.split('\n').map(l => `<li>${esc(l.replace(/^- /, '')).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')}</li>`).join('') + '</ul>';

  function colHead(col) {
    const n = countCol(col.id), over = overWip(col);
    const wipTitle = col.wip ? `${n} cards, WIP limit ${col.wip}${over ? '. Over the limit' : ''}` : `${n} cards, no WIP limit`;
    return `<div class="colh${over ? ' over' : ''}" data-col="${col.id}">
      <div class="top"><span class="nm">${col.name}</span><span class="wip${over ? ' over' : ''}" title="${wipTitle}">${col.wip ? `${n}/${col.wip}` : n}</span><span class="spacer"></span>
      <button class="ib" type="button" data-dod="${col.id}" aria-haspopup="dialog" aria-label="${col.name}: state and definition of done">ⓘ</button></div>
      <div class="map" title="Dragging a card here sets this state">State ${col.state}</div></div>`;
  }

  function annHtml(c, r) {
    const inDone = colOf(c).id === 'done';
    const parts = ANN.filter(([t]) => r[t][1] || t !== 'feature').map(([t, label]) => {
      const [d, n] = r[t];
      if (!n) return '';
      const cls = d === n ? ' ok' : inDone ? ' warn' : '';
      return `<span class="an${cls}" title="${d} of ${n} ${label} closed">${tIcon(t)}${d}/${n}</span>`;
    }).join('');
    const label = parts || `<span class="an none">${LEVEL === 'epics' ? 'No Features yet' : 'No stories yet'}</span>`;
    const open = view.open.has(c.key);
    return `<button class="anns" type="button" data-kids="${c.key}" aria-expanded="${open}" title="${open ? 'Hide' : 'Show'} what's under ${c.key}">${label}<span class="chev">${open ? '▲' : '▼'}</span></button>`;
  }

  function kidsHtml(c) {
    const row = (x, sub) => `<div class="kid${closed(x) ? ' closed' : ''}${sub ? ' sub' : ''}" role="listitem" title="${x.key} ${esc(x.title)} · ${x.state}">${tIcon(x.type || 'feature')}<span class="n">${esc(x.title)}</span>${st(x.state)}</div>`;
    const byState = list => [...list.filter(x => !closed(x)), ...list.filter(closed)];
    let rows;
    if (LEVEL === 'epics') {
      const tree = f => [row({ ...f, type: 'feature' }, f.parent !== c.key), ...subFeatures(f).flatMap(tree)];
      rows = byState(featureList().filter(f => f.parent === c.key)).flatMap(tree);
    } else {
      rows = [...byState(leaves.filter(i => i.parent === c.title)).map(x => row(x)),
        ...subFeatures(c).flatMap(f => [row({ ...f, type: 'feature' }), ...byState(leavesUnder(f)).map(x => row(x, true))])];
    }
    const add = LEVEL === 'epics'
      ? '<button class="btn ghost" type="button" data-addkid="Feature">+ Feature</button>'
      : '<button class="btn ghost" type="button" data-addkid="User Story">+ User story</button><button class="btn ghost" type="button" data-addkid="Bug">+ Bug</button>';
    return `<div class="kids" role="list" aria-label="Under ${c.key}">${rows.join('') || '<div class="kid"><span class="n muted">Nothing under it yet</span></div>'}<div class="kid-add" data-under="${c.key}">${add}</div></div>`;
  }

  function cardHtml(c) {
    const rule = STYLE_RULES.find(x => x.when(c));
    const r = rollup(c), state = stateOf(c), inDone = colOf(c).id === 'done';
    const own = c.points == null ? '<span class="unest" title="Not estimated">?</span>' : c.points;
    const big = r.sum && c.points != null && r.sum > c.points * 1.25;
    const pts = `<span class="cpts" title="Own estimate · sum of the stories and bugs below">${own}${r.sum ? ` <span class="sig${big ? ' big' : ''}">· Σ${r.sum}</span>` : ''}</span>`;
    const who = `<button class="take" type="button" data-assign="${c.key}" aria-haspopup="menu" title="${c.assignee ? 'Owner ' + people[c.assignee].name + ' · change' : 'No owner · set one'}">${av(c.assignee)}</button>`;
    const tags = c.tags.map(t => `<span class="tag" style="--tag: var(${TAG_COLOUR[t] || '--color-muted'})">${esc(t)}</span>`).join('');
    const p = LEVEL === 'features' ? byKey(c.parent) : null;
    const parent = p ? `<div class="pr">${tIcon(allEpics.includes(p) ? 'epic' : 'feature')}<span class="n">${esc(p.title)}</span></div>` : '';
    const total = ANN.reduce((a, [t]) => a + r[t][1], 0), done = ANN.reduce((a, [t]) => a + r[t][0], 0);
    const prompt = total && done === total && !inDone
      ? `<div class="alldone">All ${total} closed<button class="btn" type="button" data-finish="${c.key}">Move to Done</button></div>` : '';
    return `<div class="card${rule ? ' ' + rule.cls : ''}${inDone ? ' done-col' : ''}" data-key="${c.key}" draggable="true" tabindex="0"
        aria-label="${c.key} ${esc(c.title)}, ${state}${rule ? ', ' + rule.name : ''}" title="${rule ? `Style rule: ${rule.name} · ` : ''}State ${state}">
      <div class="r1">${tIcon(TYPE)}<span class="key">${c.key}</span>${pts}</div>
      <div class="ttl">${esc(c.title)}</div>
      ${view.compact ? '' : parent}
      <div class="ar">${annHtml(c, r)}<span class="spacer"></span>${who}</div>
      ${prompt}
      ${!view.compact && tags ? `<div class="ft">${tags}</div>` : ''}
      ${view.open.has(c.key) ? kidsHtml(c) : ''}
    </div>`;
  }

  function cellHtml(lane, col, list) {
    let shown = list.filter(passes), more = '';
    if (col.id === 'done' && shown.length > DONE_N) {
      if (!view.showOlder) { more = `<button class="btn ghost more" type="button" data-older>Show ${shown.length - DONE_N} older</button>`; shown = shown.slice(0, DONE_N); }
      else more = '<button class="btn ghost more" type="button" data-older>Show recent only</button>';
    }
    let add = '';
    if (col.id === 'new' && (lane.id === 'all' || lane.first)) {
      const what = LEVEL === 'epics' ? 'Epic' : 'Feature';
      add = view.adding
        ? `<div class="add-field"><input class="field" id="addTitle" placeholder="Title, then Enter" aria-label="New ${what} title"><span class="xs">${what} · goes in at the top of New</span></div>`
        : `<button class="btn addc" type="button" data-add>+ New ${what}</button>`;
    }
    return `<div class="cell" data-track="${col.id}" data-lane="${lane.id}" aria-label="${col.name}">${add}${shown.map(cardHtml).join('')}${more}</div>`;
  }

  function lanes() {
    if (view.lanes !== 'epic') return [{ id: 'all' }];
    return allEpics.map((e, i) => ({ id: 'epic:' + e.key, epic: e, first: i === 0 }));
  }

  function laneHtml(lane, list) {
    if (lane.id === 'all') return `<section class="lane"><div class="bgrid">${COLS.map(col => cellHtml(lane, col, list.filter(c => c.track === col.id))).join('')}</div></section>`;
    const collapsed = view.collapsed.has(lane.id), e = lane.epic;
    const pts = list.filter(c => colOf(c).id !== 'done').reduce((a, c) => a + (c.points || 0), 0);
    const head = `<div class="lane-h">
        <button class="ib" type="button" data-lane-toggle="${lane.id}" aria-expanded="${!collapsed}" aria-label="${collapsed ? 'Expand' : 'Collapse'} ${esc(e.title)}">${collapsed ? '▶' : '▼'}</button>
        <b>${tIcon('epic')}${esc(e.title)}</b><span class="key">${e.key}</span>
        <span class="xs muted">${list.length ? `${list.length} ${list.length === 1 ? 'Feature' : 'Features'} · ${pts} pts open` : 'No Features yet · drop one here to put it under this Epic'}</span></div>`;
    if (collapsed) return `<section class="lane">${head}</section>`;
    return `<section class="lane">${head}<div class="bgrid">${COLS.map(col => cellHtml(lane, col, list.filter(c => c.track === col.id))).join('')}</div></section>`;
  }

  function render(o = {}) {
    const before = o.flip ? new Map([...document.querySelectorAll('.card')].map(el => [el.dataset.key, el.getBoundingClientRect()])) : null;
    const w = $('bwrap');
    w.className = 'bwrap' + (view.compact ? ' compact' : '');
    w.style.setProperty('--ncols', COLS.length);
    w.style.minWidth = COLS.length * 220 + 'px';
    w.innerHTML = `<div class="bhead bgrid">${COLS.map(colHead).join('')}</div>` + lanes().map(l => laneHtml(l, cards.filter(c => laneOf(c) === l.id))).join('');
    const open = cards.filter(c => colOf(c).id !== 'done');
    $('summary').textContent = `${open.length} open · ${open.reduce((a, c) => a + (c.points || 0), 0)} pts`;
    renderFilter();
    if (before) {
      document.querySelectorAll('.card').forEach(el => {
        const a = before.get(el.dataset.key); if (!a) return;
        const b = el.getBoundingClientRect(), dx = a.left - b.left, dy = a.top - b.top;
        if (!dx && !dy) return;
        if (el.dataset.key === o.flip) el.classList.add('moving');
        el.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }], { duration: el.dataset.key === o.flip ? 520 : 260, easing: 'cubic-bezier(.2,.7,.2,1)' })
          .onfinish = () => el.classList.remove('moving');
      });
    }
    if (o.flash) document.querySelector(`.card[data-key="${o.flash}"]`)?.classList.add('flash');
    if (o.focus) document.querySelector(`.card[data-key="${o.focus}"]`)?.focus();
    if (view.adding) wireAdd();
  }

  function renderFilter() {
    $('fbar').hidden = !view.filterOpen;
    $('btnFilter').setAttribute('aria-expanded', view.filterOpen);
    const n = [view.q, view.who.size, view.epic].filter(Boolean).length;
    $('btnFilter').textContent = n ? `Filter (${n})` : 'Filter';
    $('fwho').innerHTML = '<span class="sm muted" style="margin-right:4px">Owner</span>' + Object.keys(people).map(p => `<button type="button" data-who="${p}" aria-pressed="${view.who.has(p)}" title="${people[p].name}">${av(p)}</button>`).join('') +
      `<button type="button" class="un" data-who="" aria-pressed="${view.who.has('')}">${av(null)}No owner</button>`;
    const shown = cards.filter(passes).length;
    $('fcount').textContent = filtering() ? `Showing ${shown} of ${cards.length} cards · WIP counts include hidden cards` : '';
  }

  /* Moving a card: the column changes and the state follows. No pull rule on these levels. */
  function move(key, trackId, laneId, beforeKey) {
    const c = cards.find(x => x.key === key);
    const from = { track: c.track, lane: laneOf(c), state: stateOf(c), idx: cards.indexOf(c), parent: c.parent };
    cards.splice(from.idx, 1);
    let idx;
    if (beforeKey && beforeKey !== key) idx = cards.findIndex(x => x.key === beforeKey);
    else if (trackId === 'done' && from.track !== trackId) idx = cards.findIndex(x => x.track === trackId); // newest first
    else idx = -1;
    cards.splice(idx < 0 ? cards.length : idx, 0, c);
    c.track = trackId;
    let reparented = false;
    if (view.lanes === 'epic' && laneId && laneId !== from.lane) { c.parent = laneId.slice(5); reparented = true; }
    return { c, from, state: stateOf(c), reparented, moved: from.track !== trackId, reordered: cards.indexOf(c) !== from.idx };
  }

  function describe(r) {
    const col = colOf(r.c), bits = [];
    if (r.moved) bits.push(`<b>${r.c.key}</b> → ${col.name} (${r.state === r.from.state ? `state stays ${r.state}` : `state ${r.state}`})`);
    else if (!r.reparented) bits.push(`<b>${r.c.key}</b> reordered in ${col.name}`);
    if (r.reparented) {
      const was = byKey(r.from.parent), now = byKey(r.c.parent);
      bits.push(`${r.moved ? '' : `<b>${r.c.key}</b> `}parent → ${esc(now.title)}${was ? ` (was ${allEpics.includes(was) ? '' : 'Feature '}${esc(was.title)})` : ''}`);
    }
    if (r.moved && col.id === 'done') { const t = openText(rollup(r.c)); if (t) bits.push(`<b>${t} still open</b>`); }
    if (r.moved && overWip(col)) bits.push(`<b>${col.name} is over its WIP limit (${countCol(col.id)}/${col.wip})</b>`);
    return bits.join(' · ');
  }

  /* Drag and drop */
  const board = $('board');
  let dragKey = null;
  const clearDrop = () => board.querySelectorAll('.drop-before, .drop-end, .cell.over').forEach(el => el.classList.remove('drop-before', 'drop-end', 'over'));
  const beforeCard = (cell, y) => [...cell.querySelectorAll('.card:not(.dragging)')].find(el => { const r = el.getBoundingClientRect(); return y < r.top + r.height / 2; });
  board.addEventListener('dragstart', e => {
    const el = e.target.closest('.card'); if (!el) return;
    dragKey = el.dataset.key; closePop();
    e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragKey);
    requestAnimationFrame(() => el.classList.add('dragging'));
  });
  board.addEventListener('dragend', () => { dragKey = null; board.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging')); clearDrop(); });
  board.addEventListener('dragover', e => {
    const cell = e.target.closest('.cell'); if (!cell || !dragKey) return;
    e.preventDefault(); e.dataTransfer.dropEffect = 'move'; clearDrop();
    cell.classList.add('over');
    const b = beforeCard(cell, e.clientY); b ? b.classList.add('drop-before') : cell.classList.add('drop-end');
  });
  board.addEventListener('drop', e => {
    const cell = e.target.closest('.cell'); if (!cell || !dragKey) return;
    e.preventDefault();
    const key = dragKey, b = beforeCard(cell, e.clientY);
    clearDrop();
    guardDone(key, cell.dataset.track, () => {
      const r = move(key, cell.dataset.track, cell.dataset.lane, b?.dataset.key);
      if (!r.moved && !r.reparented && !r.reordered) { render(); return; }
      render({ flash: r.reparented ? key : null });
      toast(describe(r));
    });
  });

  /* Moving into Done with open children asks first. Teammates' moves arrive without asking. */
  function guardDone(key, trackId, go) {
    const c = cards.find(x => x.key === key);
    if (trackId !== 'done' || c.track === 'done' || !openText(rollup(c))) { go(); return; }
    confirmDone(c, go);
  }
  function confirmDone(c, go) {
    const back = document.activeElement;
    const open = LEVEL === 'epics'
      ? featureList().filter(f => f.parent === c.key).flatMap(f => [f, ...deepFeatures(f)]).filter(f => !closed(f)).map(f => ({ ...f, type: 'feature' }))
      : [...leavesUnder(c), ...deepFeatures(c).map(f => ({ ...f, type: 'feature' }))].filter(x => !closed(x));
    const shown = open.slice(0, 6);
    const wrap = document.createElement('div');
    wrap.className = 'backdrop';
    wrap.innerHTML = `<div class="dialog confirm" role="alertdialog" aria-modal="true" aria-labelledby="cdT" aria-describedby="cdD">
      <header><h2 id="cdT">Move ${c.key} to Done?</h2></header>
      <div class="body"><p id="cdD" style="margin:0"><b>${esc(c.title)}</b> still has ${openText(rollup(c))} open. They stay as they are; close or move them from the ${LEVEL === 'epics' ? 'Features' : 'Stories'} board.</p>
        <div class="kids" role="list">${shown.map(x => `<div class="kid" role="listitem" title="${x.key} ${esc(x.title)} · ${x.state}">${tIcon(x.type)}<span class="n">${esc(x.title)}</span>${st(x.state)}</div>`).join('')}${open.length > shown.length ? `<div class="kid"><span class="n muted">and ${open.length - shown.length} more</span></div>` : ''}</div></div>
      <footer><span class="spacer"></span><button class="btn" type="button" data-cd="no">Cancel</button><button class="btn primary" type="button" data-cd="yes">Move to Done anyway</button></footer></div>`;
    document.body.append(wrap);
    const close = ok => { wrap.remove(); document.removeEventListener('keydown', onKey, true); if (ok) go(); else back?.focus?.(); };
    const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); close(false); } };
    document.addEventListener('keydown', onKey, true);
    wrap.addEventListener('click', e => { const b = e.target.closest('[data-cd]'); if (b) close(b.dataset.cd === 'yes'); else if (e.target === wrap) close(false); });
    wrap.querySelector('[data-cd="yes"]').focus();
  }

  /* Keyboard: Alt+←/→ changes column, Alt+↑/↓ reorders within the cell. */
  board.addEventListener('keydown', e => {
    const el = e.target.closest('.card'); if (!el || e.target !== el) return;
    const c = cards.find(x => x.key === el.dataset.key);
    if (e.key === 'Enter') { toast(`Opens <b>${c.key}</b> in the work item form`); return; }
    if (!e.altKey) return;
    const ci = COLS.findIndex(x => x.id === c.track), lane = laneOf(c);
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      const nc = COLS[ci + (e.key === 'ArrowRight' ? 1 : -1)]; if (!nc) return;
      e.preventDefault();
      guardDone(c.key, nc.id, () => { const r = move(c.key, nc.id, lane, null); render({ focus: c.key }); toast(describe(r)); });
    } else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      const sib = cards.filter(x => x.track === c.track && laneOf(x) === lane && passes(x));
      const i = sib.indexOf(c), j = i + (e.key === 'ArrowDown' ? 1 : -1); if (j < 0 || j >= sib.length) return;
      e.preventDefault();
      const target = e.key === 'ArrowDown' ? sib[j + 1]?.key : sib[j].key;
      const r = move(c.key, c.track, lane, target); render({ focus: c.key }); toast(describe(r));
    }
  });

  /* Popovers: definition of done and the owner menu */
  const pop = document.createElement('div'); pop.className = 'bpop'; pop.hidden = true; pop.setAttribute('role', 'dialog'); document.body.append(pop);
  let popFor = null;
  function openPop(anchor, html, cls) {
    pop.className = 'bpop' + (cls ? ' ' + cls : ''); pop.innerHTML = html; pop.hidden = false; popFor = anchor;
    const r = anchor.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
    pop.style.left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8)) + 'px';
    pop.style.top = (r.bottom + h + 8 > innerHeight ? r.top - h - 4 : r.bottom + 4) + 'px';
  }
  function closePop() { pop.hidden = true; popFor = null; }
  function dodPop(btn) {
    const col = COL(btn.dataset.dod);
    openPop(btn, `<h3>${col.name}</h3>
      <div class="maps"><span>${tIcon(TYPE)} ${TYPE === 'epic' ? 'Epic' : 'Feature'}</span><span>${st(col.state)}</span></div>
      ${col.wip ? `<div class="xs muted">WIP limit ${col.wip}. Over the limit is allowed; the header turns red.</div>` : ''}
      <div class="overline">Definition of done</div><div class="md">${mdLite(col.dod)}</div>
      <footer>Markdown<span class="spacer"></span><a href="board-settings.html?level=${LEVEL}">Edit in Board settings</a></footer>`);
  }
  function assignPop(btn) {
    const c = cards.find(x => x.key === btn.dataset.assign);
    const opt = (p, label) => `<button type="button" role="menuitemradio" aria-checked="${(c.assignee || '') === p}" data-pick="${p}">${av(p || null)}${label}</button>`;
    openPop(btn, `<span class="overline">Owner of ${c.key}</span>${Object.keys(people).map(p => opt(p, people[p].name + (p === ME ? ' <span class="muted">(you)</span>' : ''))).join('')}${opt('', 'No owner')}`, 'menu');
    pop.setAttribute('role', 'menu');
    pop.onclick = e => {
      const b = e.target.closest('[data-pick]'); if (!b) return;
      const p = b.dataset.pick || null; closePop();
      if (p === c.assignee) return;
      c.assignee = p; render({ flash: c.key });
      toast(p ? `${av(p)} <b>${c.key}</b> owner is now ${p === ME ? 'you' : people[p].name}` : `<b>${c.key}</b> has no owner`);
    };
  }
  document.addEventListener('click', e => {
    if (!pop.hidden && !pop.contains(e.target) && !(popFor && popFor.contains(e.target))) closePop();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !pop.hidden) { const a = popFor; closePop(); a?.focus(); } });

  /* Board clicks */
  board.addEventListener('click', e => {
    const d = e.target.closest('[data-dod]'); if (d) { if (popFor === d) closePop(); else { pop.onclick = null; pop.setAttribute('role', 'dialog'); dodPop(d); } return; }
    const a = e.target.closest('[data-assign]'); if (a) { if (popFor === a) closePop(); else assignPop(a); return; }
    const k = e.target.closest('[data-kids]'); if (k) { const id = k.dataset.kids; view.open.has(id) ? view.open.delete(id) : view.open.add(id); render(); document.querySelector(`[data-kids="${id}"]`)?.focus(); return; }
    const ak = e.target.closest('[data-addkid]'); if (ak) { const under = ak.parentElement.dataset.under; toast(`New ${ak.dataset.addkid} under <b>${under}</b>: opens the inline add row in the ${LEVEL === 'epics' ? 'Features' : 'Stories'} backlog's tree, parent set`); return; }
    const f = e.target.closest('[data-finish]'); if (f) { const r = move(f.dataset.finish, 'done', laneOf(cards.find(x => x.key === f.dataset.finish)), null); render({ flip: r.c.key, flash: r.c.key }); toast(describe(r)); return; }
    const l = e.target.closest('[data-lane-toggle]'); if (l) { const id = l.dataset.laneToggle; view.collapsed.has(id) ? view.collapsed.delete(id) : view.collapsed.add(id); render(); return; }
    if (e.target.closest('[data-older]')) { view.showOlder = !view.showOlder; render(); return; }
    if (e.target.closest('[data-add]')) { view.adding = true; render(); return; }
    if (e.target.closest('.kids')) return;
    const c = e.target.closest('.card'); if (c) toast(`Opens <b>${c.dataset.key}</b> in the work item form`);
  });

  function wireAdd() {
    const t = $('addTitle'); t.focus();
    t.onkeydown = e => {
      if (e.key === 'Escape') { view.adding = false; render(); return; }
      if (e.key !== 'Enter' || !t.value.trim()) return;
      const lane = lanes()[0];
      const c = { key: 'SHIP-' + nextKey++, title: t.value.trim(), parent: lane.epic?.key || null, points: null, assignee: null, track: 'new', tags: [] };
      cards.splice(Math.max(cards.findIndex(x => x.track === 'new'), 0), 0, c);
      render({ flash: c.key }); toast(`<b>${c.key}</b> added at the top of New (state New)${LEVEL === 'features' && !c.parent ? ' · pick its Epic on the card or in the form' : ''}`);
    };
  }

  /* Toolbar */
  $(LEVEL === 'epics' ? 'lvEpics' : 'lvFeatures').setAttribute('aria-pressed', 'true');
  $(LEVEL === 'epics' ? 'lvFeatures' : 'lvEpics').setAttribute('aria-pressed', 'false');
  $('lvEpics').onclick = () => { location.href = 'features-board.html?level=epics'; };
  $('lvFeatures').onclick = () => { location.href = 'features-board.html'; };
  $('btnSettings').href = `board-settings.html?level=${LEVEL}`;
  $('lanesCtl').hidden = LEVEL === 'epics';
  const syncLanes = () => document.querySelectorAll('[data-lanes]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lanes === view.lanes));
  document.querySelectorAll('[data-lanes]').forEach(b => { b.onclick = () => { view.lanes = b.dataset.lanes; syncLanes(); render(); }; });
  syncLanes();
  document.querySelectorAll('[data-cards]').forEach(b => {
    b.onclick = () => { view.compact = b.dataset.cards === 'compact'; document.querySelectorAll('[data-cards]').forEach(x => x.setAttribute('aria-pressed', x === b)); render(); };
  });
  $('fepic').hidden = LEVEL === 'epics';
  $('fepic').innerHTML = '<option value="">Any Epic</option>' + allEpics.map(e => `<option value="${e.key}">${esc(e.title)}</option>`).join('');
  $('btnFilter').onclick = () => { view.filterOpen = !view.filterOpen; render(); if (view.filterOpen) $('fq').focus(); };
  $('fq').oninput = e => { view.q = e.target.value.trim(); render(); };
  $('fepic').onchange = e => { view.epic = e.target.value; render(); };
  $('fwho').onclick = e => { const b = e.target.closest('[data-who]'); if (!b) return; const p = b.dataset.who; view.who.has(p) ? view.who.delete(p) : view.who.add(p); render(); };
  $('fclear').onclick = () => { view.q = ''; view.epic = ''; view.who.clear(); $('fq').value = ''; $('fepic').value = ''; render(); };

  /* Real-time simulations (Preview panel) */
  const closings = [['mei', 'SHIP-144'], ['sam', 'SHIP-129'], ['tom', 'SHIP-158']];
  function teammateCloses() {
    const s = closings.find(([, k]) => !closed(leaves.find(i => i.key === k)));
    if (!s) { toast('No more scripted closes; reload to replay'); return; }
    const [who, key] = s, item = leaves.find(i => i.key === key);
    item.state = 'Closed';
    const f = allFeatures.find(x => x.title === item.parent);
    const card = LEVEL === 'features' ? cards.find(c => c.key === f.key) : cards.find(c => c.key === rootEpic(f).key);
    const r = rollup(card);
    render({ flash: card.key });
    toast(`${av(who)} ${people[who].name} closed <b>${key}</b> on the Stories board · <b>${esc(card.title)}</b> now ${r.story[0]}/${r.story[1]} stories`);
  }
  const scripted = LEVEL === 'features' ? [{ who: 'ana', key: 'SHIP-108', to: 'prog' }, { who: 'mei', key: 'SHIP-111', to: 'done' }] : [{ who: 'ana', key: 'SHIP-92', to: 'prog' }, { who: 'tom', key: 'SHIP-93', to: 'prog' }];
  function teammateMove() {
    const s = scripted.find(x => cards.find(c => c.key === x.key).track !== x.to);
    if (!s) { toast('No more scripted moves; reload to replay'); return; }
    const r = move(s.key, s.to, laneOf(cards.find(c => c.key === s.key)), null);
    render({ flip: s.key, flash: s.key });
    toast(`${av(s.who)} ${people[s.who].name} moved ` + describe(r));
  }
  const rtBanner = html => { $('banners').innerHTML = html; };
  function dropConnection() {
    SL.setLive(false);
    rtBanner(`<div class="banner warn">Live updates paused. Moves still save; retrying in 5s.<span class="spacer"></span><button class="btn" type="button" id="retry">Retry now</button></div>`);
    const back = () => {
      clearTimeout(timer); SL.setLive(true);
      rtBanner(`<div class="banner ok">Back online. Board refreshed with 2 changes from while you were away.</div>`);
      setTimeout(() => rtBanner(''), 3500);
    };
    const timer = setTimeout(back, 5000);
    $('banners').onclick = e => { if (e.target.id === 'retry') back(); };
  }

  render();
  if (params.get('confirm') && cards.some(c => c.key === params.get('confirm'))) guardDone(params.get('confirm'), 'done', () => { const r = move(params.get('confirm'), 'done', null, null); render(); toast(describe(r)); });
  SL.preview([
    { label: 'Teammate closes a story', run: teammateCloses },
    { label: 'Teammate moves a card', run: teammateMove },
    { label: 'Drop connection', run: dropConnection },
    ...(LEVEL === 'features' ? [{ label: view.lanes === 'epic' ? 'No lanes' : 'Lanes by Epic', run: () => { view.lanes = view.lanes === 'epic' ? 'none' : 'epic'; syncLanes(); render(); } }] : []),
  ]);
})();
</script>
</body>
</html>
