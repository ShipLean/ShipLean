<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShipLean · Capacity (reference)</title>
<!--
  Reference Capacity tab: Sprints › Sprint 24 › Capacity.
  Open directly in a browser. Uses ../tokens.css, shiplean.css and shared.js only; no build step.
  The team types one velocity for the sprint (prefilled from the sprint before, else the project's velocity) and each
  member in the table has days available (default: the sprint's working days minus public holidays). A member's capacity
  is velocity / people in the table × days / working days, so the figures are computed here exactly as the server does.
  Only the team total is compared with what the sprint has committed. The callout checks the typed velocity against the
  recent sprints; nobody's number is compared with work assigned to them. A sprint with nobody in the table plans
  against velocity.
  Working: edit the velocity or any days and the capacities, totals, bar and messages update; "reset" returns a member
  to the default days; × removes a member; + Add member puts one back; Copy from Sprint 23; Clear (back to velocity).
  Layout: the table card and the summary card sit side by side from 900 px and stack below that; neither stretches.
  The "Preview" panel bottom-left is a review aid, not part of the design (hide it with ?shot).
-->
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="shiplean.css">
<script src="shared.js"></script>
<style>
.head { display: flex; gap: var(--space-3); align-items: center; padding: var(--space-3) var(--space-4); background: var(--color-surface); border-bottom: 1px solid var(--color-border); flex: none; flex-wrap: wrap; }
.picker { display: inline-flex; align-items: center; gap: 6px; padding: 0; border: 0; background: none; font-size: var(--text-lg); font-weight: var(--weight-semibold); cursor: pointer; }
.picker span { font-size: var(--text-xs); color: var(--color-muted); }
.wrap { flex: 1; min-height: 0; overflow: auto; padding: var(--space-4); }
.layout { max-width: 1040px; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: var(--space-4); align-items: start; }
.card { border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface); overflow: hidden; min-width: 0; }
.top { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--space-3) var(--space-6); padding: var(--space-4); border-bottom: 1px solid var(--color-border); }
.top label { font-weight: var(--weight-medium); font-size: var(--text-sm); display: block; margin-bottom: 4px; }
.top input { width: 110px; text-align: right; font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; }
table.cap-table { width: 100%; min-width: 560px; table-layout: fixed; border-collapse: collapse; font-size: var(--text-sm); }
.cap-table th, .cap-table td { padding: 6px var(--space-3); vertical-align: middle; }
.cap-table thead th { background: var(--color-surface-2); font-size: var(--text-xs); font-weight: var(--weight-semibold); letter-spacing: .04em; text-transform: uppercase; color: var(--color-muted); text-align: left; }
.cap-table tbody tr { border-top: 1px solid var(--color-border); }
.cap-table .r { text-align: right; font-variant-numeric: tabular-nums; }
.cap-table .days { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.cap-table input.days-in { width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
.cap-table input.note-in { width: 100%; }
.cap-table .tag { font-size: var(--text-xs); color: var(--color-muted); }
.cap-table .tag a { color: var(--color-accent); text-decoration: underline; cursor: pointer; }
.cap-table .x { width: 28px; height: 28px; border: 0; background: none; color: var(--color-muted); border-radius: var(--radius-sm); cursor: pointer; }
.cap-table .x:hover { background: var(--color-accent-soft); color: var(--color-text); }
.cap-table tfoot td { background: var(--color-surface-2); font-weight: var(--weight-semibold); border-top: 1px solid var(--color-border); }
.who { display: flex; gap: var(--space-2); align-items: center; }
.sum { padding: var(--space-4); display: grid; gap: var(--space-3); align-content: start; }
.sum .kpis { gap: var(--space-4); }
#room b.over { color: var(--color-danger); }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } .top { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<div id="appbar"></div>
<section class="head" aria-label="Sprint 24">
  <button class="picker" type="button" aria-haspopup="listbox" title="Switch sprint">Sprint 24 <span>▾</span></button>
  <span class="chip accent">Current</span>
  <span class="sm muted">Mon 19 Oct – Fri 30 Oct</span>
  <div id="tabs"></div>
  <span class="spacer"></span>
  <button class="btn" type="button" id="copyBtn">Copy from Sprint 23</button>
  <button class="btn" type="button" id="clearBtn" title="Remove all entries; plan against velocity">Clear</button>
  <select class="field" id="add" aria-label="Add member"></select>
</section>
<div class="wrap">
  <div class="layout">
    <section class="card">
      <div class="top">
        <div>
          <label for="vel">Team velocity</label>
          <input class="field" id="vel" type="number" min="0" max="9999.99" step="any" value="25">
          <div class="xs muted" style="margin-top:4px">Assumes everyone is in for every working day</div>
        </div>
        <div class="sm" id="cal"></div>
      </div>
      <div class="scroll">
        <table class="cap-table">
          <colgroup><col style="width:144px"><col style="width:96px"><col style="width:80px"><col><col style="width:40px"></colgroup>
          <thead><tr><th>Member</th><th class="r">Days available</th><th class="r">Capacity</th><th>Note</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
          <tfoot><tr><td colspan="2">Team capacity</td><td class="r" id="total"></td><td colspan="2" class="xs muted" id="foot" style="font-weight:400"></td></tr></tfoot>
        </table>
      </div>
    </section>
    <aside class="card sum" aria-label="Sprint 24 as a whole">
      <div class="overline">Sprint 24 as a whole</div>
      <div class="kpis">
        <div class="kpi"><div class="v" id="kCap"></div><div class="l">Team capacity</div></div>
        <div class="kpi"><div class="v" id="kCommitted"></div><div class="l">Committed</div></div>
        <div class="kpi"><div class="v" id="kVel"></div><div class="l">Velocity (last 3)</div></div>
      </div>
      <div class="cap" id="bar"><i></i></div>
      <div class="sm" id="room"></div>
      <div class="callout" id="sense"></div>
    </aside>
  </div>
</div>

<script>
(() => {
  const { VELOCITY, people, sprints, committed, av, esc, toast } = SL;
  document.getElementById('appbar').outerHTML = SL.appBar('sprints');
  document.getElementById('tabs').outerHTML = SL.sprintTabs('capacity');
  const W = 10, H = 1, DEFAULT_DAYS = W - H;           // 10 working days, Labour Day on a working weekday
  const COMMITTED = committed('s24');
  const body = document.getElementById('rows'), vel = document.getElementById('vel');
  const notes = { sam: 'Off Thu–Fri', ana: 'Part-time this sprint' };
  // Who is in the table, with days typed (null = the default) and a note.
  const sprint24 = { priya: { days: null }, tom: { days: null }, mei: { days: null }, sam: { days: 8 }, ana: { days: 5 } };
  const sprint23 = { priya: { days: 10 }, tom: { days: 10 }, mei: { days: 10 }, sam: { days: 10 }, ana: { days: 6 } };
  let table = {};
  document.getElementById('cal').innerHTML = `${W} working days · ${H} public holiday (NZ)<div class="xs muted">Labour Day (Mon 26 Oct)</div>`;

  const points = (v, n, days) => n === 0 || W === 0 ? 0 : Math.min(9999.99, Math.round(v * Math.min(days ?? DEFAULT_DAYS, W) * 100 / (n * W)) / 100);

  function draw() {
    const ids = Object.keys(people), inTable = ids.filter(p => table[p]), absent = ids.filter(p => !table[p]);
    body.innerHTML = inTable.map(p => {
      const d = table[p].days;
      return `<tr><td><div class="who">${av(p)}${people[p].name}</div></td>
      <td class="r"><div class="days"><input class="field days-in" type="number" min="0" max="${W}" step="0.5" data-p="${p}" value="${d ?? DEFAULT_DAYS}" aria-label="Days available for ${people[p].name}">
        ${d === null ? '<span class="tag">default</span>' : `<span class="tag"><a data-reset="${p}">reset</a></span>`}</div></td>
      <td class="r" data-pts="${p}"></td>
      <td><input class="field note-in" value="${esc(notes[p] || '')}" placeholder="Optional, e.g. Off Thu–Fri" aria-label="Note for ${people[p].name}"></td>
      <td><button class="x" type="button" data-rm="${p}" aria-label="Remove ${people[p].name}" title="Remove ${people[p].name}">×</button></td></tr>`;
    }).join('');
    document.getElementById('add').innerHTML = '<option value="">+ Add member</option>' + absent.map(p => `<option value="${p}">${people[p].name}</option>`).join('');
    document.getElementById('add').disabled = absent.length === 0;
    update();
  }

  function update() {
    const v = Math.max(0, +vel.value || 0), inTable = Object.keys(table);
    let total = 0;
    inTable.forEach(p => {
      const pts = points(v, inTable.length, table[p].days);
      total += pts;
      const c = body.querySelector(`[data-pts="${p}"]`);
      if (c) c.innerHTML = `${pts} <span class="muted">pts</span>`;
    });
    total = Math.round(total * 100) / 100;
    const entered = inTable.length > 0, cap = entered ? total : VELOCITY;
    document.getElementById('total').innerHTML = entered ? `${total} <span class="muted" style="font-weight:400">pts</span>` : '—';
    document.getElementById('foot').textContent = entered ? 'The sum of the column above. Planning uses only this number.' : `No capacity entered: planning uses velocity ${VELOCITY}`;
    document.getElementById('kCap').textContent = cap;
    document.getElementById('kCommitted').textContent = COMMITTED;
    document.getElementById('kVel').textContent = VELOCITY;
    const bar = document.getElementById('bar');
    bar.className = 'cap' + (COMMITTED > cap ? ' over' : entered ? '' : ' velocity');
    bar.firstElementChild.style.width = Math.min(100, COMMITTED / (cap || 1) * 100) + '%';
    document.getElementById('room').innerHTML = COMMITTED > cap
      ? `<b class="over">${Math.round((COMMITTED - cap) * 100) / 100} pts over</b> what the team can take on. A warning only; nothing is blocked.`
      : `<b>${Math.round((cap - COMMITTED) * 100) / 100} pts</b> of room left in the sprint.`;
    const diff = (v - VELOCITY) / VELOCITY, sense = document.getElementById('sense');
    sense.className = 'callout' + (entered && Math.abs(diff) > .1 ? ' warn' : '');
    sense.innerHTML = !entered ? `<b>No capacity entered</b>Planning uses velocity (${VELOCITY}) for this sprint.`
      : Math.abs(diff) <= .1 ? '<b>In line with recent velocity</b>The velocity is within 10% of the recent sprints.'
      : diff > 0 ? `<b>Velocity ${Math.round(diff * 100)}% above recent sprints</b>You typed ${v}; the team usually completes about ${VELOCITY}. Worth a second look.`
      : `<b>Velocity ${Math.round(-diff * 100)}% below recent sprints</b>You typed ${v}; the team usually completes about ${VELOCITY}. Fine if the team is smaller; otherwise plan less than usual.`;
  }

  body.addEventListener('input', e => {
    const p = e.target.dataset.p;
    if (p) { table[p].days = e.target.value === '' ? null : +e.target.value; update(); }
  });
  body.addEventListener('change', e => { if (e.target.dataset.p && e.target.value === '') draw(); });
  body.addEventListener('click', e => {
    if (e.target.dataset.reset) { table[e.target.dataset.reset].days = null; draw(); }
    if (e.target.dataset.rm) { delete table[e.target.dataset.rm]; draw(); }
  });
  vel.addEventListener('input', update);
  document.getElementById('add').onchange = e => { if (e.target.value) { table[e.target.value] = { days: null }; draw(); } };
  document.getElementById('copyBtn').onclick = () => { table = JSON.parse(JSON.stringify(sprint23)); vel.value = 24; draw(); toast('Copied capacity from Sprint 23'); };
  document.getElementById('clearBtn').onclick = () => { table = {}; draw(); toast('Cleared. Sprint 24 now plans against velocity'); };
  table = JSON.parse(JSON.stringify(sprint24));
  draw();
  SL.preview();
})();
</script>
</body>
</html>
