<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShipLean · Agent runs (SHIP-1463 mock-up)</title>
<!--
  SHIP-1463 mock-up: how an agent did a Task, drawn from the team's own trace and log stores (ClickHouse, or Tempo + Loki).
  ShipLean only reads. Desktop only (proposed D15). Not built. Open directly in a browser. Uses ../tokens.css,
  shiplean.css and shared.js only; no build step.
  ?view=task     the Task page (SHIP-171) with its Agent runs section under Changes. &state=empty | down
  ?view=run      (default) the Run page, /p/SHIP/items/SHIP-171/runs/<run>.
                 &run=claude (default, a traced run: waterfall) | codex (log-only: event timeline) | cursor (hook events)
                 &state= zoom | errors | hidden | permission | edit | truncated | expired
  Decisions D14–D22 settled by Joel, 14 Nov 2026: no cost or price in v1 (D21), no comments on spans in v1 (D20).
  Span and event names follow what each agent sends as far as we know on 14 Nov; lane 1c's recorded runs replace them.
  The Preview panel (bottom left) is a review aid; ?shot hides it, ?theme=light|dark forces a theme.
-->
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="shiplean.css">
<script src="shared.js"></script>
<style>
[hidden] { display: none !important; }

.pill { display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 6px; border-radius: 999px; font-size: var(--text-2xs); font-weight: var(--weight-semibold); background: var(--color-surface-2); color: var(--color-muted); white-space: nowrap; }
.pill.warn { background: color-mix(in srgb, var(--color-warn) 18%, transparent); color: var(--color-text); }
.pill.ok { background: color-mix(in srgb, var(--color-ok) 18%, transparent); color: var(--color-text); }
.pill.info { background: color-mix(in srgb, var(--color-info) 18%, transparent); color: var(--color-text); }
.pill.danger { background: color-mix(in srgb, var(--color-danger) 16%, transparent); color: var(--color-danger); }
.plus { color: var(--color-ok); font-family: var(--font-mono); font-size: var(--text-xs); }
.minus { color: var(--color-danger); font-family: var(--font-mono); font-size: var(--text-xs); }
.sha { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--color-accent); text-decoration: none; }
.num { font-variant-numeric: tabular-nums; }
.agent { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--color-surface-2); border: 1px solid var(--color-border); font: 700 9px/1 var(--font-sans); color: var(--color-muted); flex: none; }

:root[data-theme="dark"] .abadge.cursor { background: #555; }
.who { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-sm); white-space: nowrap; }

/* ---------- Task page (as task-changes.html) ---------- */

.sec-h .sum { font-size: var(--text-sm); color: var(--color-muted); }
.md { max-width: 780px; } .md p { margin: 0 0 6px; } .md code { padding: 0 4px; border-radius: var(--radius-xs); background: var(--color-surface-2); font-size: var(--text-xs); }
.box { border: 1px solid var(--color-border); border-radius: var(--radius-md); overflow: hidden; }
table.commits { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }

.hist .ch b { color: var(--color-text); font-weight: var(--weight-semibold); }

/* Agent runs section */

table.runs th { height: 26px; padding: 0 var(--space-2); text-align: left; font-size: var(--text-2xs); font-weight: var(--weight-semibold); color: var(--color-muted); text-transform: uppercase; letter-spacing: .05em; background: var(--color-bg); white-space: nowrap; }

.agentcell { display: inline-flex; align-items: center; gap: 8px; }

.mini { position: relative; display: block; width: 100px; height: 14px; border-radius: 3px; background: var(--color-surface-2); overflow: hidden; }
.mini i { position: absolute; top: 3px; bottom: 3px; border-radius: 2px; background: color-mix(in srgb, var(--color-accent) 70%, transparent); }

.empty-box .agents3 a:hover { border-color: var(--color-accent); }

/* ---------- Run page ---------- */
.rv-head { flex: none; display: grid; gap: 6px; padding: var(--space-2) var(--space-4); background: var(--color-surface); border-bottom: 1px solid var(--color-border); }
.rv-title { display: flex; align-items: center; gap: var(--space-2); min-width: 0; }

.wf { background: var(--color-surface); position: relative; }
.wf-row { display: grid; grid-template-columns: 360px minmax(0, 1fr) 76px; align-items: center; min-height: 26px; border-bottom: 1px solid color-mix(in srgb, var(--color-border) 35%, transparent); font-size: var(--text-sm); cursor: pointer; }

.wf-head { position: sticky; top: 0; z-index: 3; min-height: 30px; cursor: default; background: var(--color-surface); border-bottom: 1px solid var(--color-border); }

.wf-head .lab { font-size: var(--text-2xs); font-weight: var(--weight-semibold); color: var(--color-muted); text-transform: uppercase; letter-spacing: .05em; }
.axis { position: relative; height: 30px; }

.lab { display: flex; align-items: center; gap: 6px; min-width: 0; padding: 0 var(--space-2) 0 calc(var(--d, 0) * 16px + 8px); white-space: nowrap; }
.lab .tw { width: 12px; flex: none; color: var(--color-muted); font-size: 10px; text-align: center; }
.lab .nm { flex: none; max-width: 55%; overflow: hidden; text-overflow: ellipsis; }
.lab .dt { color: var(--color-muted); overflow: hidden; text-overflow: ellipsis; font-family: var(--font-mono); font-size: var(--text-xs); min-width: 0; }
.lab .x { color: var(--color-danger); font-weight: 700; flex: none; }
.lab .cbub { display: inline-grid; place-items: center; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--color-warn); color: #1d1d1d; font-size: 10px; font-weight: 700; flex: none; }

.track { position: relative; height: 26px; background-image: var(--grid); }
.bar { position: absolute; top: 8px; height: 10px; min-width: 2px; border-radius: 2px; }

.bar.ev { background: var(--color-muted); }

.dur { padding-right: var(--space-3); text-align: right; font-size: var(--text-xs); color: var(--color-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.wf-turn { background: var(--color-bg); min-height: 32px; border-top: 1px solid var(--color-border); }

.legend { display: flex; gap: var(--space-3); flex-wrap: wrap; align-items: center; padding: var(--space-2) var(--space-3); font-size: var(--text-xs); color: var(--color-muted); border-top: 1px solid var(--color-border); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { display: inline-block; width: 14px; height: 8px; border-radius: 2px; }

.ovwrap { flex: none; display: grid; grid-template-columns: 360px minmax(0, 1fr) 76px; align-items: center; background: var(--color-bg); border-bottom: 1px solid var(--color-border); }
.ovwrap .l { padding: 0 var(--space-3); font-size: var(--text-xs); color: var(--color-muted); }

/* Detail panel */
.dp { background: var(--color-bg); border-left: 1px solid var(--color-border); display: flex; flex-direction: column; }
.dp-h { position: sticky; top: 0; z-index: 2; display: grid; gap: 4px; padding: var(--space-3); background: var(--color-surface); border-bottom: 1px solid var(--color-border); }
.dp-h .t { display: flex; align-items: center; gap: 6px; font-weight: var(--weight-semibold); }
.dp-h .t .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dp-h .meta { font-size: var(--text-xs); color: var(--color-muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.dp-b { display: grid; gap: var(--space-3); padding: var(--space-3); }
.dp-sec { display: grid; gap: 6px; }
.dp-sec .hh { display: flex; align-items: center; gap: 6px; }
.dp pre { margin: 0; padding: var(--space-2); border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-surface); font: var(--text-xs)/1.55 var(--font-mono); white-space: pre-wrap; word-break: break-word; max-height: 220px; overflow: auto; }
.dp pre .e { color: var(--color-danger); } .dp pre .g { color: var(--color-ok); } .dp pre .m { color: var(--color-muted); }
.kv { width: 100%; border-collapse: collapse; font-size: var(--text-xs); table-layout: fixed; }
.kv td { padding: 3px 6px; border-top: 1px solid color-mix(in srgb, var(--color-border) 55%, transparent); vertical-align: top; word-break: break-word; }
.kv tr:first-child td { border-top: 0; }

  /* ---------------- Run page ---------------- */
  // The time axis shows the whole run, or one turn after a click on it in the overview strip (D19).
  const fullPct = s => (s / run.end * 100).toFixed(3) + '%';
  let R0 = 0, R1 = run.end, pct = fullPct, ticks = [], gridCss = '';
  function setRange() {
    [R0, R1] = ui.range || [0, run.end];
    const span = R1 - R0;
    pct = s => ((s - R0) / span * 100).toFixed(3) + '%';
    const step = [5, 10, 15, 30, 60, 120, 300, 600, 900, 1800].find(x => x >= span / 8) || 3600;
    ticks = []; for (let t = Math.ceil(R0 / step) * step; t <= R1 - span * 0.04; t += step) ticks.push(t);
    gridCss = `linear-gradient(90deg, ${ticks.filter(t => t > R0).map(t => `transparent calc(${pct(t)} - 1px), color-mix(in srgb, var(--color-border) 45%, transparent) calc(${pct(t)} - 1px), color-mix(in srgb, var(--color-border) 45%, transparent) ${pct(t)}, transparent ${pct(t)}`).join(', ') || 'transparent, transparent'})`;
  }
  const tickLabel = t => t === 0 ? '0' : t % 60 === 0 ? `+${t / 60} m` : off(t);
  // A bar clipped to the visible range; '' when it's outside.
  const seg = (s, t) => { const a = Math.max(s, R0), b = Math.min(s + t, R1); return b < a || (b === a && t) ? '' : `left:${pct(a)};width:${pct(b - a)}`; };

  const visible = () => {
    const out = [];
    const hasErr = sp => sp.err || (sp.kids || []).some(hasErr);
    flat.forEach(sp => {
      for (let p = sp.parent; p; p = p.parent) if (p.k === 'sub' && !p.open) return;
      if (ui.errorsOnly && sp.k !== 'turn' && !hasErr(sp)) return;
      if (ui.find && sp.k !== 'turn' && !(`${sp.n} ${CONTENT ? sp.d : ''}`.toLowerCase().includes(ui.find.toLowerCase()))) return;
      out.push(sp);
    });
    return out;
  };
  const subCount = sp => { let n = 0; const w = l => l.forEach(x => { n++; x.kids && w(x.kids); }); w(sp.kids); return n; };
  const kindLetter = { model: 'M', tool: 'T', mcp: 'SL', sub: 'S', ev: '•', turn: '›' };
  const label = sp => {
    if (!run.traced && sp.k !== 'turn') return `<span class="nm mono xs">${esc(sp.n.replace(/^codex\./, ''))}</span><span class="dt">${esc(sp.d === 'prompt' && !CONTENT ? 'prompt hidden' : sp.d)}</span>`;
    if (sp.k === 'model') return `<span class="nm">Model call</span><span class="dt">${esc(sp.d)}</span>`;
    if (sp.k === 'mcp') return `<span class="nm">${esc(sp.n)}</span><span class="dt">${esc(sp.d)}</span>`;
    if (sp.k === 'sub') return `<span class="nm">${esc(sp.n)}</span><span class="dt">${CONTENT ? esc(sp.d) : ''}</span>`;
    return `<span class="nm">${esc(sp.n)}</span><span class="dt">${CONTENT ? esc(sp.d) : ''}</span>`;
  };
  function rowHtml(sp) {
    if (sp.k === 'turn') return `<div class="wf-row wf-turn${ui.sel === sp.id ? ' on' : ''}" data-sel="${sp.id}">
      <div class="lab" style="--d:0"><span class="kd turn">›</span><span class="nm">${sp.n}</span><span class="pr">${CONTENT ? '“' + esc(sp.prompt) + '”' : 'prompt hidden'}</span></div>
      <div class="track" style="--grid:${gridCss}">${seg(sp.s, sp.t) ? `<span class="bar turn" style="${seg(sp.s, sp.t)}"></span>` : ''}</div>
      <div class="dur">${clock(run.base, sp.s).slice(0, 5)}</div></div>`;
    const twisty = sp.kids ? `<button class="tw btn ghost" style="height:16px;padding:0;width:14px;border:0" type="button" data-tog="${sp.id}" aria-label="${sp.open ? 'Collapse' : 'Expand'}">${sp.open ? '▾' : '▸'}</button>` : '<span class="tw"></span>';
    const isPoint = !sp.t;
    const cls = sp.retry ? 'retry' : sp.err ? 'err' : sp.k;
    let bars = '';
    const b = (c, st, extra = '') => st ? `<span class="bar ${c}" style="${st}"${extra}></span>` : '';
    if (isPoint) bars = sp.s >= R0 && sp.s <= R1 ? `<span class="pt ${sp.err ? 'err' : sp.k}" style="left:${pct(sp.s)}"></span>` : '';
    else if (!run.traced) bars = b(cls, seg(sp.s - sp.t, sp.t));
    else {
      if (sp.wait) bars += b('wait', seg(sp.s, sp.wait), ` title="Waiting for permission ${dur(sp.wait)}"`);
      bars += b(cls, seg(sp.s + (sp.wait || 0), sp.t - (sp.wait || 0)));
    }
    return `<div class="wf-row${ui.sel === sp.id ? ' on' : ''}" data-sel="${sp.id}">
      <div class="lab" style="--d:${sp.depth}">${twisty}<span class="kd ${sp.k}">${kindLetter[sp.k]}</span>${label(sp)}${sp.kids && !sp.open ? `<span class="pill">${subCount(sp)} spans</span>` : ''}${sp.wait ? `<span class="pill warn">waited ${dur(sp.wait)}</span>` : ''}${sp.err ? '<span class="x" title="Error">✕</span>' : ''}</div>
      <div class="track" style="--grid:${gridCss}">${bars}</div>

    if (sp.k !== 'turn' && sp.k !== 'model' && d.input) body += `<div class="dp-sec"><span class="overline">Input</span>${CONTENT ? `<pre>${esc(d.input)}</pre>` : hidden}</div>`;
    if (sp.k !== 'turn' && d.output && CONTENT) body += `<div class="dp-sec"><div class="hh"><span class="overline">Output</span><span class="spacer"></span>${CONTENT ? '<span class="xs muted">first 40 lines</span>' : ''}</div>${CONTENT ? `<pre>${d.output}</pre>` : ''}</div>`;
    if (sp.k === 'model' && sp.retry) body += `<div class="callout warn"><b>The API answered 529 (overloaded).</b>Claude Code retried after 2.1 s and the second attempt went through. Logged as <code>claude_code.api_error</code> with <code>attempt=1</code>.</div>`;
    body += `<div class="dp-sec"><span class="overline">Attributes</span><div class="kvbox"><table class="kv">${d.attrs.map(([k, v]) => `<tr><td>${k}</td><td>${esc(v)}</td></tr>`).join('')}</table></div></div>`;
    if (d.logs.length) body += `<div class="dp-sec"><div class="hh"><span class="overline">Logs</span><span class="cnt">${d.logs.length}</span><span class="spacer"></span><span class="xs muted">joined by ${run.traced ? 'span id' : 'conversation and time'}</span></div><div class="logs">${d.logs.map(([t, s, n, b]) => `<div class="lr"><span class="tm">${t}</span><span class="sv ${s}">${s}</span><span class="bd">${n} <span>${esc(b)}</span></span></div>`).join('')}</div></div>`;
    return head + `<div class="dp-b">${body}</div>`;
  }

  function overviewHtml() {
    const pct = fullPct;
    const parts = run.turns.map((tu, i) => {
      const all = []; const w = l => l.forEach(x => { all.push(x); x.kids && w(x.kids); }); w(tu.kids);
      return `<span class="ovt${ui.range && ui.range[0] === tu.s ? ' on' : ''}" data-zoom="${i}" style="left:${pct(tu.s)};width:${pct(Math.max(tu.t, run.end / 60))}" title="Zoom to ${tu.n}">${tu.t > run.end / 12 ? tu.n : i + 1}</span>`
        + all.filter(x => x.wait).map(x => `<span class="ovw" style="left:${pct(x.s)};width:${pct(x.wait)}" title="Waited ${dur(x.wait)} for permission"></span>`).join('')
        + all.filter(x => x.err).map(x => `<span class="ove" style="left:${pct(x.s)}" title="${esc(x.err)}"></span>`).join('');
    });
    const idle = [];
    for (let i = 0; i < run.turns.length - 1; i++) { const a = run.turns[i], b = run.turns[i + 1]; idle.push(`<span class="idle" style="left:${pct(a.s + a.t)};width:${pct(b.s - a.s - a.t)}" title="Idle ${dur(b.s - a.s - a.t)}"></span>`); }
    const win = ui.range ? `<span class="ovwin" style="left:${pct(ui.range[0])};width:${pct(ui.range[1] - ui.range[0])}"></span>` : '';
    return `<div class="ovwrap"><span class="l">${ui.range ? `Zoomed to ${run.turns.find(t => t.s === ui.range[0])?.n || 'a part'} · <a href="#" data-zoom="all">Whole run</a>` : `Whole run · click a ${run.agent === 'cursor' ? 'prompt' : 'turn'} to zoom to it`}</span><div class="overview">${idle.join('')}${win}${parts.join('')}</div><span></span></div>`;

  document.addEventListener('click', e => {

    const tog = t.closest('[data-tog]'); if (tog) { const sp = byId[tog.dataset.tog]; sp.open = !sp.open; render(); return; }
    const sel = t.closest('[data-sel]'); if (sel) { ui.sel = sel.dataset.sel; render(); return; }
    const z = t.closest('[data-zoom]'); if (z) { e.preventDefault(); const tu = run.turns[z.dataset.zoom]; ui.range = tu ? [tu.s, tu.s + Math.max(tu.t, 30)] : null; render(); return; }
    const er = t.closest('[data-err]'); if (er) { e.preventDefault(); ui.errorsOnly = er.dataset.err === '1'; render(); return; }
    const open = t.closest('tr[data-open]'); if (open && !t.closest('a')) { location.search = `?view=run&run=${open.dataset.open}${keep}`; return; }
    if (t.closest('[data-copy]')) { toast('Link to this span copied'); return; }
  });
  document.addEventListener('input', e => { if (e.target.id === 'find') { ui.find = e.target.value; const pos = e.target.selectionStart; render(); const f = $('find'); f.focus(); f.setSelectionRange(pos, pos); } });

  SL.preview([
    { label: 'Task page', run: () => { location.search = '?view=task'; } },
    { label: 'Claude Code run', run: () => { location.search = '?view=run'; } },
    { label: 'Codex CLI run', run: () => { location.search = '?view=run&run=codex'; } },
    { label: 'Cursor run', run: () => { location.search = '?view=run&run=cursor'; } },
  ]);
})();
</script>
</body>
</html>
