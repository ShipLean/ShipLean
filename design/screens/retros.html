<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShipLean · Retrospectives search (SHIP-82 mockup)</title>
<!--
  SHIP-82 mockup: Retrospectives › Search. Every point from every retro in the project, one row per point,
  filtered by text, sprint, category, theme, level, decision and who wrote it. Each row is one line; selecting it shows its
  whole retro on the right.
  The filters live in the address, as in the real app: ?q&sprint&category&theme&level&role&decision&noSprint&unthemed&recurring
  (level = stories|features, role = conductor|sub-agent|person, decision = undecided|actioned|notNeeded, the flags = true)
  and ?selected=<retro id>&point=<point id>. Uses ../tokens.css, shiplean.css, shared.js and retro-data.js.
  At 900px and below search-touch.css/js lay it out for touch (SHIP-730); the page exposes its state as window.SRCH.
-->
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="shiplean.css">
<link rel="stylesheet" href="retro.css">
<link rel="stylesheet" href="retro-cards.css">
<link rel="stylesheet" href="search-touch.css">
<script src="shared.js"></script>
<script src="retro-data.js"></script>
<script src="retro-cards.js"></script>
<style>
/* SHIP-497: one line per point, so more fit on screen. The selected point's whole text and root cause are on the right. */
table.list td.wrap { padding-top: 4px; padding-bottom: 4px; }
.one-line { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.one-line .chip { vertical-align: middle; }
</style>
</head>
<body>
<div id="appbar"></div>
<div class="toolbar">
  <div class="filters">
    <input class="field search-box" type="search" id="q" placeholder="Search points, root causes and raw logs" aria-label="Search retrospectives">
    <select class="field" id="fSprint" aria-label="Sprint"><option value="">Any sprint</option><option value="none">No sprint</option></select>
    <select class="field" id="fCat" aria-label="Category"><option value="">Any category</option></select>
    <select class="field" id="fTheme" aria-label="Theme"><option value="">Any theme</option></select>
    <select class="field" id="fLevel" aria-label="Level"><option value="">Stories, bugs and features</option><option value="stories">Stories and bugs</option><option value="features">Features</option></select>
    <select class="field" id="fBy" aria-label="Written by"><option value="">Anyone</option><option value="conductor">Conductors</option><option value="sub-agent">Sub-agents</option><option value="person">People</option></select>
    <select class="field" id="fDecision" aria-label="Decision"><option value="">Any decision</option><option value="undecided">Undecided</option><option value="actioned">Actioned</option><option value="notNeeded">Not needed</option></select>
    <label class="check"><input type="checkbox" id="fNoSprint"> No sprint</label>
    <label class="check"><input type="checkbox" id="fUnthemed"> Unthemed</label>
    <label class="check"><input type="checkbox" id="fRecur"> Recurring themes only</label>
    <button class="btn ghost" type="button" id="fClear">Clear</button>
  </div>
  <span class="spacer"></span>
  <span class="muted sm" id="count"></span>
</div>
<div class="split wide">
  <div class="scroll">
    <table class="list fixed">
      <thead><tr><th style="width:128px">Category</th><th>Point</th><th style="width:150px">Theme</th><th style="width:130px">Work item</th><th style="width:48px">Sprint</th><th style="width:40px">By</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <aside class="detail" id="detail" aria-label="Retrospective"></aside>
</div>

<script>
(() => {
  const { av, tIcon, esc, people } = SL;
  const { themes, retros, catLabel, roleLabel, recurring, sprintNames, actions } = RETRO;
  document.getElementById('appbar').outerHTML = SL.appBar('retros');

  const $ = id => document.getElementById(id);
  [...sprintNames].reverse().forEach(s => $('fSprint').insertAdjacentHTML('beforeend', `<option>${s}</option>`));
  RETRO.catOrder.map(k => [k, catLabel[k]]).forEach(([k, l]) => $('fCat').insertAdjacentHTML('beforeend', `<option value="${k}">${l}</option>`));
  Object.entries(themes).forEach(([k, t]) => $('fTheme').insertAdjacentHTML('beforeend', `<option value="${k}">${esc(t.name)}</option>`));
  // Every filter is in the address (as in the real app), so a link from Insights or a shared search opens filtered.
  const addr = new URLSearchParams(location.search);
  const SELECTS = { q: 'q', sprint: 'fSprint', category: 'fCat', theme: 'fTheme', level: 'fLevel', role: 'fBy', decision: 'fDecision' };
  const FLAGS = { noSprint: 'fNoSprint', unthemed: 'fUnthemed', recurring: 'fRecur' };
  // ?theme= is also shared.js's light|dark switch, so the theme filter takes only a theme's key.
  const fromAddr = k => (k === 'theme' ? addr.getAll('theme').find(v => themes[v]) : addr.get(k));
  Object.entries(SELECTS).forEach(([k, id]) => { if (fromAddr(k)) $(id).value = fromAddr(k); });
  Object.entries(FLAGS).forEach(([k, id]) => { $(id).checked = addr.get(k) === 'true'; });

  const rows = retros.flatMap(r => r.points.map((p, i) => ({ r, p, id: r.id + '.' + i })));
  let selected = addr.get('point') || (addr.get('selected') ? addr.get('selected') + '.0' : null);

  const hi = (text, q) => {
    if (!q) return esc(text);
    const i = text.toLowerCase().indexOf(q.toLowerCase());
    return i < 0 ? esc(text) : esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
  };
  const logText = r => r.log ? Object.values(r.log).flat().join(' ') : '';

  function filtered() {
    const q = $('q').value.trim().toLowerCase();
    // A point matches on its own text; a retro whose only match is its raw failure log shows once, on its first point.
    const own = ({ r, p }) => (p.text + ' ' + (p.cause || '') + ' ' + themes[p.theme].name + ' ' + r.subject + ' ' + r.title).toLowerCase().includes(q);
    const logOnly = new Set(retros.filter(r => logText(r).toLowerCase().includes(q) && !rows.some(x => x.r === r && own(x))).map(r => r.id + '.0'));
    return rows.filter(({ r, p, id }) =>
      (!q || own({ r, p }) || logOnly.has(id)) &&
      (!$('fSprint').value || ($('fSprint').value === 'none' ? !r.sprint : r.sprint === $('fSprint').value)) &&
      (!$('fDecision').value || ($('fDecision').value === 'undecided' ? RC.isOpen(p) : $('fDecision').value === 'actioned' ? !!p.action : !!p.none)) &&
      (!$('fCat').value || p.cat === $('fCat').value) &&
      (!$('fTheme').value || p.theme === $('fTheme').value) &&
      (!$('fLevel').value || ($('fLevel').value === 'features' ? r.type === 'feature' : r.type !== 'feature')) &&
      (!$('fBy').value || r.role === $('fBy').value) &&
      (!$('fNoSprint').checked || !r.sprint) &&
      (!$('fUnthemed').checked || p.theme === 'none') &&
      (!$('fRecur').checked || recurring(p.theme)));
  }

  function clearAll() {
    Object.values(SELECTS).forEach(id => { $(id).value = ''; });
    Object.values(FLAGS).forEach(id => { $(id).checked = false; });
    render();
  }

  function render() {
    const q = $('q').value.trim(), list = filtered();
    if (!selected || !list.some(x => x.id === selected)) selected = list[0]?.id ?? null;
    $('count').textContent = `${list.length} point${list.length === 1 ? '' : 's'} in ${new Set(list.map(x => x.r.id)).size} retros`;
    $('rows').innerHTML = list.length ? list.map(({ r, p, id }) => `<tr class="item" data-id="${id}" aria-selected="${id === selected}">
      <td><span class="catdot ${p.cat}">${catLabel[p.cat]}</span></td>
      <td class="wrap"><div class="one-line" title="${esc(p.text)}">${hi(p.text, q)}</div>${p.cause && q && p.cause.toLowerCase().includes(q.toLowerCase()) ? `<div class="one-line xs muted">Root cause: ${hi(p.cause, q)}</div>` : ''}${!(p.text + (p.cause || '')).toLowerCase().includes(q.toLowerCase()) && q && logText(r).toLowerCase().includes(q.toLowerCase()) ? '<div class="xs muted">Match in the raw failure log</div>' : ''}</td>
      <td><div class="one-line sm" title="${esc(themes[p.theme].name)}">${recurring(p.theme) ? '<span class="chip warn" style="height:16px" title="Recurring">↻</span> ' : ''}${esc(themes[p.theme].name)}</div></td>
      <td><div class="title-cell" title="${esc(r.title)}">${tIcon(r.type)}<span class="key">${r.subject}</span></div></td>
      <td class="sm">${r.sprint ?? '<span class="muted" title="No sprint">—</span>'}</td>
      <td title="${people[r.by].name}${r.agent ? ' · ' + esc(r.agent) : ''}">${av(r.by)}</td>
    </tr>`).join('') : `<tr><td colspan="6" class="muted" style="text-align:center;height:80px">No point matches. Try fewer filters.</td></tr>`;
    detail();
    window.SRCH.after?.();
  }

  function detail() {
    const row = rows.find(x => x.id === selected);
    if (!row) { $('detail').innerHTML = '<p class="muted sm">Select a point to see its whole retro.</p>'; return; }
    const r = row.r;
    $('detail').innerHTML = `<div class="row"><span class="overline">Retrospective ${r.id}</span><span class="spacer"></span><span class="muted xs">${r.at}</span></div>
      <div class="title-cell" style="font-size:var(--text-md)">${tIcon(r.type)}<span class="key">${r.subject}</span><b class="t">${esc(r.title)}</b></div>
      <div class="row sm">${av(r.by)}<span>${people[r.by].name}</span>${r.agent ? `<span class="agent">${esc(r.agent)}</span>` : ''}<span class="chip">${roleLabel[r.role]}</span><span class="chip">${r.sprint ? 'Sprint ' + r.sprint.slice(1) : 'No sprint'}</span></div>
      <div class="row"><a class="btn" href="retro-item.html?key=${r.subject}">Open ${r.subject}'s retros</a>${r.sprint ? '<a class="btn ghost" href="sprint-retro.html">Sprint retro</a>' : ''}</div>
      <div class="rc-board one">${RETRO.catOrder.map(cat => {
        const ps = r.points.filter(p => p.cat === cat);
        if (!ps.length) return '';
        return `<section class="rc-col ${cat}"><header><span>${catLabel[cat]}</span><span class="n">${ps.length}</span></header>${ps.map(p => RC.note(p, r, { showAuthor: false, hit: p === row.p })).join('')}</section>`;
      }).join('')}</div>
      ${r.compiledFrom ? `<p class="xs muted" style="margin:0">Compiled from ${r.compiledFrom.map(id => { const s = retros.find(x => x.id === id); return `${tIcon(s.type)} ${s.subject}`; }).join(', ')}.</p>` : ''}
      ${r.log ? `<details class="rawlog" open><summary>Raw failure log <span class="muted">· verbatim from the agent</span></summary>
        <dl style="grid-template-columns:120px minmax(0,1fr)">${[['blockers', 'Blockers'], ['disproved', 'Assumptions disproved'], ['friction', 'Friction']].map(([k, l]) => `<dt>${l}</dt><dd>${r.log[k].length ? r.log[k].map(esc).join('<br>') : '<span class="muted">None reported.</span>'}</dd>`).join('')}</dl></details>` : ''}`;
  }

  RC.render = render;
  const scope = () => { const row = rows.find(x => x.id === selected); return row ? retros.filter(x => x.subject === row.r.subject) : []; };
  RC.wire($('detail'), scope);
  document.querySelector('.filters').addEventListener('input', render);
  $('fClear').addEventListener('click', clearAll);
  $('rows').addEventListener('click', e => { const tr = e.target.closest('tr[data-id]'); if (!tr) return; selected = tr.dataset.id; render(); });
  // For search-touch.js: the page's own state and rules, so the touch layout never filters or matches on its own.
  window.SRCH = { rows, filtered, render, clearAll, hi, logText, scope, SELECTS, FLAGS,
    get selected() { return selected; }, set selected(id) { selected = id; } };
  render();
  SL.preview([{ label: 'Clear search', run: () => { $('q').value = ''; render(); } }, { label: 'Recurring only', run: () => { $('fRecur').checked = !$('fRecur').checked; render(); } }]);
})();
</script>
<script src="search-touch.js"></script>
</body>
</html>
