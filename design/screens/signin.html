<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShipLean · Sign in (reference)</title>
<!--
  Reference sign-in: /login, the only page you can open without a session. Cookie sign-in.
  Open directly in a browser. Uses ../tokens.css, shiplean.css and shared.js only; no build step.
  No side menu: you aren't in a project yet. The top bar shows the ShipLean mark and the instance name
  (Instance settings → Name), so people know which install they're signing in to.
  There is no sign-up and no "forgot password" email: an instance admin adds people and resets passwords,
  handing over a one-time password. ShipLean sends no email in v1.
  States (?state=…, also in the Preview panel):
    (none)       Email and password. Submitting signs in and opens the page you were sent from (here, the backlog).
    error        A failed sign-in. One fixed sentence whatever the reason (unknown email, wrong password, locked,
                 disabled, rate limited), so the page never tells a stranger which emails exist.
    change       Signed in with a one-time password from an admin: choose your own before anything else opens.
    signed-out   After Sign out in the user menu.
    ended        The session was ended elsewhere: your password changed or an admin reset it.
    no-projects  Signed in, but you aren't a member of any project yet.
  The "Preview" panel bottom-left is a review aid, not part of the design (hide it with ?shot).
-->
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="shiplean.css">
<script src="shared.js"></script>
<style>
[hidden] { display: none !important; }
body { flex-direction: column; overflow: auto; }
.topbar { display: flex; align-items: center; gap: var(--space-2); height: var(--bar-height); padding: 0 var(--space-4); background: var(--color-surface); border-bottom: 1px solid var(--color-border); flex: none; }
.topbar .logo { display: flex; align-items: center; gap: 7px; font-size: var(--text-md); font-weight: 700; letter-spacing: -.01em; }
.topbar .logo i { width: 16px; height: 16px; border-radius: 4px; background: var(--color-accent); display: inline-block; }
.topbar .inst { font-size: var(--text-sm); color: var(--color-muted); }
.topbar .inst::before { content: "·"; margin-right: var(--space-2); }
.stage { flex: 1; display: grid; place-items: center; padding: var(--space-5) var(--space-4); }
.card { width: min(380px, 100%); display: flex; flex-direction: column; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-raised); }
.card.wide { width: min(460px, 100%); }
.card > h1 { margin: 0; padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--color-border); font-size: var(--text-md); font-weight: var(--weight-semibold); }
.card > h1 small { display: block; margin-top: 2px; font-size: var(--text-xs); font-weight: var(--weight-regular); color: var(--color-muted); }
.card .body { display: grid; gap: var(--space-3); padding: var(--space-4); }
.grid2 { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: var(--space-3); align-items: center; }
.grid2 label { font-size: var(--text-sm); color: var(--color-muted); }
.grid2 .field { width: 100%; height: 32px; font-size: var(--text-base); }
.grid2 .span { grid-column: 2; }
.card > footer { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3) var(--space-4); border-top: 1px solid var(--color-border); background: var(--color-bg); border-radius: 0 0 var(--radius-lg) var(--radius-lg); }
.card > footer .note { flex: 1; font-size: var(--text-xs); color: var(--color-muted); }
.btn.primary { height: 32px; padding: 0 14px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.alert { padding: var(--space-2) var(--space-3); border: 1px solid var(--color-border); border-left: 3px solid var(--color-danger); border-radius: var(--radius-sm); background: color-mix(in srgb, var(--color-danger) 9%, var(--color-surface)); font-size: var(--text-sm); }
.alert.info { border-left-color: var(--color-info); background: color-mix(in srgb, var(--color-info) 9%, var(--color-surface)); }
.alert.ok { border-left-color: var(--color-ok); background: color-mix(in srgb, var(--color-ok) 9%, var(--color-surface)); }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: var(--text-sm); }
.checks li::before { content: "✓"; display: inline-block; width: 16px; color: var(--color-ok); font-weight: 700; }
.checks li.no { color: var(--color-muted); }
.checks li.no::before { content: "○"; color: var(--color-muted); font-weight: 400; }
.reveal { position: relative; }
.reveal .field { padding-right: 52px; }
.reveal button { position: absolute; right: 4px; top: 4px; height: 24px; padding: 0 6px; border: 0; border-radius: var(--radius-xs); background: transparent; color: var(--color-muted); font-size: var(--text-xs); cursor: pointer; }
.reveal button:hover { background: var(--color-surface-2); color: var(--color-text); }
.help { margin: 0; font-size: var(--text-xs); color: var(--color-muted); }
.empty { display: grid; justify-items: center; gap: var(--space-2); text-align: center; padding: var(--space-5) var(--space-4); }
.empty h2 { margin: 0; font-size: var(--text-md); }
.empty p { margin: 0; max-width: 360px; font-size: var(--text-sm); color: var(--color-muted); }
.me-line { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-sm); }
.foot-links { margin-top: var(--space-3); text-align: center; font-size: var(--text-xs); color: var(--color-muted); }
</style>
</head>
<body>
<header class="topbar"><span class="logo"><i></i>ShipLean</span><span class="inst" id="inst"></span></header>
<main class="stage" id="stage"></main>

<script>
(() => {
  const { instance, people, ME, esc, av, toast } = SL;
  const $ = id => document.getElementById(id);
  $('inst').textContent = instance.name;
  document.title = 'Sign in · ' + instance.name;
  let state = new URLSearchParams(location.search).get('state') || '';
  let email = state === 'error' ? people[ME].email : '';

  const signIn = (banner = '') => `<form class="card" id="f" novalidate>
      <h1>Sign in<small>to ${esc(instance.name)}</small></h1>
      <div class="body">
        ${banner}
        <div class="grid2">
          <label for="em">Email</label><input class="field" id="em" type="email" autocomplete="username" required value="${esc(email)}"${email ? '' : ' autofocus'}>
          <label for="pw">Password</label><div class="reveal"><input class="field" id="pw" type="password" autocomplete="current-password" required${email ? ' autofocus' : ''}><button type="button" data-reveal="pw" aria-label="Show password">Show</button></div>
        </div>
      </div>
      <footer><span class="note">No account, or forgot your password? Ask your ShipLean admin.</span><button class="btn primary" type="submit">Sign in</button></footer>
    </form>`;

  const views = {
    '': () => signIn(),
    error: () => signIn(`<div class="alert" role="alert">That email and password didn't work. Check them and try again, or ask your ShipLean admin.</div>`),
    'signed-out': () => signIn(`<div class="alert ok" role="status">You're signed out.</div>`),
    ended: () => signIn(`<div class="alert info" role="status">You were signed out because your password was changed or reset. Sign in again to carry on.</div>`),
    change: () => `<form class="card wide" id="chg" novalidate>
      <h1>Choose your own password<small>Signed in as ravi@larkspur.dev</small></h1>
      <div class="body">
        <div class="alert info">You signed in with a one-time password from <b>Tom Okafor</b>. Pick one only you know before you carry on.</div>
        <div class="grid2">
          <label for="np">New password</label><div class="reveal"><input class="field" id="np" type="password" autocomplete="new-password" autofocus><button type="button" data-reveal="np" aria-label="Show password">Show</button></div>
          <label for="cp">Confirm</label><input class="field" id="cp" type="password" autocomplete="new-password">
          <ul class="checks span" id="pwChecks"></ul>
        </div>
      </div>
      <footer><a class="note" href="?state=signed-out">Sign out instead</a><button class="btn primary" type="submit" id="chgGo" disabled>Save and continue</button></footer>
    </form>`,
    'no-projects': () => `<div class="card wide">
      <h1>Welcome to ShipLean<small>${esc(instance.name)}</small></h1>
      <div class="empty">
        <div class="me-line"><span class="av" style="background:#3f7d5a">KT</span><span>Signed in as <b>Kai Turner</b></span></div>
        <h2>You're not in any projects yet</h2>
        <p>A project admin adds you from Project settings → Members. Once they do, the project opens here.</p>
        <div class="row" style="justify-content:center"><a class="btn primary" href="new-project.html">+ New project</a><a class="btn" href="import.html">Import from Jira</a></div>
        <span class="xs muted">Or <a href="profile.html">set up your profile</a> while you wait.</span>
      </div>
      <footer><span class="note">Admins on this install: Priya Shah, Tom Okafor</span><a class="btn ghost" href="?state=signed-out">Sign out</a></footer>
    </div>`,
  };

  function render() {
    $('stage').innerHTML = (views[state] || views[''])();
    $('stage').querySelector('[autofocus]')?.focus();
    const f = $('f');
    if (f) f.addEventListener('submit', e => {
      e.preventDefault();
      const em = $('em'), pw = $('pw');
      if (!em.value.trim()) return em.focus();
      if (!pw.value) return pw.focus();
      toast('Signed in. Opening <b>SHIP › Backlogs › Stories</b>, where you were going');
      setTimeout(() => { location.href = 'backlog.html'; }, 900);
    });
    const chg = $('chg');
    if (chg) {
      const check = () => {
        const a = $('np').value, b = $('cp').value;
        const rules = [[a.length >= 10, 'At least 10 characters'], [a.length > 0 && a !== 'K7QX-2MPD-W4RT', 'Not the one-time password'], [a.length > 0 && a === b, 'Both match']];
        $('pwChecks').innerHTML = rules.map(([ok, t]) => `<li class="${ok ? '' : 'no'}">${t}</li>`).join('');
        $('chgGo').disabled = !rules.every(r => r[0]);
      };
      chg.addEventListener('input', check); check();
      chg.addEventListener('submit', e => { e.preventDefault(); toast('Password saved. Other sessions are signed out'); setTimeout(() => { location.href = 'backlog.html'; }, 900); });
    }
    $('stage').querySelectorAll('[data-reveal]').forEach(b => b.onclick = () => {
      const i = $(b.dataset.reveal), show = i.type === 'password';
      i.type = show ? 'text' : 'password'; b.textContent = show ? 'Hide' : 'Show'; b.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    });
  }
  render();

  const go = s => () => { state = s; email = s === 'error' ? people[ME].email : ''; render(); };
  SL.preview([
    { label: 'Sign in', run: go('') },
    { label: 'Failed', run: go('error') },
    { label: 'One-time password', run: go('change') },
    { label: 'Signed out', run: go('signed-out') },
    { label: 'Session ended', run: go('ended') },
    { label: 'No projects', run: go('no-projects') },
  ]);
})();
</script>
</body>
</html>
