<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShipLean · Feature timeline (reference)</title>
<!--
  SHIP-1465 Feature timeline: Backlogs › SHIP-99 › Timeline, opened from the Timeline section on the Feature page.
  After the fact: how a Feature's work actually ran. The key dates strip (Added, Planned, Execution started, Finished)
  sits at the top; below it a Gantt chart of the execution, task by task under their stories, each bar from the first
  move into an Active state (or pick_up) to the pull request merging (or the move to Closed when there is no PR).
  Bars are split into Active, In review (PR open, not merged) and Blocked. Arrows are dependencies (blocked_by /
  predecessor links and plan waves); the critical path is outlined once the Feature is Done. The rail lists what
  dragged it out, worked out from the same view model; click a bar, a row or a finding to see that item.
  JSON shows exactly what the proposed MCP tool feature_timeline returns for the same Feature.
  Uses ../tokens.css, shiplean.css, shared.js, timeline.css and timeline-data.js; no build step.
    ?key=SHIP-101            a Feature still running (open bars run to now, no critical path yet); default SHIP-99, Done
    ?group=people|tasks      group by People, or a flat list of tasks (default Stories)
    ?zoom=days               a fixed day width with horizontal scroll (default Fit)
    ?select=SHIP-194         an item selected; its detail in the rail
    ?view=json               what agents get
    ?deps=off  ?cp=off       hide dependencies or the critical path
  The "Preview" panel bottom-left is a review aid, not part of the design (hide it with ?shot).
-->
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="shiplean.css">
<link rel="stylesheet" href="timeline.css">
<script src="shared.js"></script>
<script src="timeline-data.js"></script>
<style>
[hidden] { display: none !important; }
.fb-head { flex: none; display: grid; gap: 6px; padding: var(--space-2) var(--space-4) var(--space-3); background: var(--color-surface); border-bottom: 1px solid color-mix(in srgb, var(--color-border) 60%, transparent); }
.back { color: var(--color-muted); font-size: var(--text-sm); text-decoration: none; justify-self: start; }
.back:hover { color: var(--color-accent); text-decoration: underline; }
.fb-title { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
.fb-title .key { font-size: var(--text-sm); color: var(--color-text); }
.fb-title h1 { margin: 0; font-size: var(--text-lg); font-weight: var(--weight-semibold); }
.fb-row { display: flex; align-items: flex-end; gap: var(--space-5); flex-wrap: wrap; }
.kpi .v { font-size: 18px; }
.kpi .l { white-space: nowrap; }
.split-bar { display: flex; width: 220px; height: 8px; border-radius: 4px; overflow: hidden; margin: 6px 0 4px; background: var(--color-surface-2); }
.split-bar i { display: block; height: 100%; }
.split-bar i.active { background: var(--tl-active); }
.split-bar i.in_review { background: repeating-linear-gradient(135deg, var(--tl-review) 0 2px, color-mix(in srgb, var(--tl-review) 30%, transparent) 2px 5px); }
.split-bar i.blocked { background: var(--tl-blocked); }
.kd-wrap { flex: none; padding: var(--space-3) var(--space-4) var(--space-2); background: var(--color-surface); border-bottom: 1px solid var(--color-border); --kd-bg: var(--color-surface); }
.kd-wrap .kd { margin: 0 auto; }
.toolbar label.chk { display: inline-flex; align-items: center; gap: 5px; font-size: var(--text-sm); white-space: nowrap; }
.toolbar label.chk input { margin: 0; accent-color: var(--color-accent); }
.toolbar label.chk.off { color: var(--color-muted); }
.tsep { width: 1px; height: 20px; background: var(--color-border); }

/* Gantt: one scroll box; the left column and the date header stick */
.tl-split { grid-template-columns: minmax(0, 1fr) calc(var(--rail-width) + 40px); }
.gantt { background: var(--color-surface); position: relative; }
.g { display: grid; position: relative; }
.g-corner, .g-axis { position: sticky; top: 0; z-index: 3; background: var(--color-surface); border-bottom: 1px solid var(--color-border); }
.g-corner { left: 0; z-index: 4; display: grid; grid-template-columns: minmax(0, 1fr) 28px 64px; align-items: end; gap: 6px; padding: 0 var(--space-2) 6px var(--space-3); border-right: 1px solid var(--color-border); }
.g-corner span { font-size: var(--text-2xs); font-weight: var(--weight-semibold); color: var(--color-muted); text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
.g-corner span:last-child { text-align: right; }
.g-left { position: sticky; left: 0; z-index: 2; background: var(--color-surface); border-right: 1px solid var(--color-border); }
.g-row { display: grid; grid-template-columns: minmax(0, 1fr) 28px 64px; align-items: center; gap: 6px; height: var(--g-rh); padding: 0 var(--space-2) 0 var(--space-3); border-bottom: 1px solid color-mix(in srgb, var(--color-border) 45%, transparent); cursor: pointer; font-size: var(--text-sm); }
.g-row:hover { background: color-mix(in srgb, var(--color-accent-soft) 45%, transparent); }
.g-row.sel { background: var(--color-accent-soft); box-shadow: inset 3px 0 0 var(--color-accent); }
.g-row .nm { display: flex; align-items: center; gap: 6px; min-width: 0; }
.g-row .nm .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-row.task .nm { padding-left: 18px; }
.g-row.story, .g-row.group { background: color-mix(in srgb, var(--color-surface-2) 40%, var(--color-surface)); font-weight: var(--weight-medium); }
.g-row.story.sel, .g-row.group.sel { background: var(--color-accent-soft); }
.g-row.group { cursor: default; }
.g-row .key { font-size: var(--text-xs); color: var(--color-muted); flex: none; }
.g-row .took { text-align: right; font-size: var(--text-xs); color: var(--color-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.g-row .took.long { color: var(--color-text); font-weight: var(--weight-semibold); }
.g-row .took.open { color: var(--color-accent); }
.g-row .took.open::after { content: " ▸"; font-size: 8px; }
.g-row .cpm { width: 6px; height: 6px; border-radius: 50%; background: var(--tl-critical); flex: none; }
.g-row.nots { color: var(--color-muted); cursor: default; font-style: italic; }
.g-row .av { width: 20px; height: 20px; font-size: 8.5px; }
svg.gsvg { display: block; overflow: visible; font-family: var(--font-sans); }
svg.gsvg text { fill: var(--color-muted); font-size: 10px; }
.wkend { fill: color-mix(in srgb, var(--color-surface-2) 55%, transparent); }
.sprint-b { fill: color-mix(in srgb, var(--color-accent-soft) 70%, transparent); }
svg.gsvg text.sprint-t { fill: var(--color-text); font-weight: 600; }
.dayline { stroke: color-mix(in srgb, var(--color-border) 55%, transparent); }
.rowline { stroke: color-mix(in srgb, var(--color-border) 45%, transparent); }
.rowsel { fill: color-mix(in srgb, var(--color-accent-soft) 70%, transparent); }
.bar { cursor: pointer; }
.bar .s.active { fill: var(--tl-active); }
.bar .s.in_review { fill: url(#hatch); stroke: var(--tl-review); stroke-width: 1; }
.bar .s.blocked { fill: var(--tl-blocked); }
.bar .outline { fill: none; stroke: var(--tl-critical); stroke-width: 1.75; }
.bar.dim { opacity: .38; }
.bar:hover .s { filter: brightness(1.12); }
.bar.sel .halo { fill: none; stroke: var(--color-accent); stroke-width: 2; }
.bar .open { fill: var(--color-accent); }
.bracket { fill: none; stroke: var(--type-story); stroke-width: 2.5; }
.bracket.bug { stroke: var(--type-bug); }
.bracket.open { stroke-dasharray: 5 3; }
.mark { fill: var(--color-surface); stroke: var(--color-muted); stroke-width: 1.5; stroke-dasharray: 2 2; }
svg.gsvg text.lbl { font-size: 10px; fill: var(--color-muted); }
svg.gsvg text.lbl.cp { fill: var(--color-text); font-weight: 600; }
.edge { fill: none; stroke: color-mix(in srgb, var(--color-muted) 70%, transparent); stroke-width: 1.25; }
.edge.cp { stroke: var(--tl-critical); stroke-width: 1.75; }
.edge.blk { stroke: var(--tl-blocked); stroke-dasharray: 3 2; }
.edge.dim { opacity: .3; }
svg.gsvg text.wait { fill: var(--color-text); font-size: 9.5px; font-weight: 600; paint-order: stroke; stroke: var(--color-surface); stroke-width: 3px; }
.nowline { stroke: var(--color-accent); stroke-width: 1.5; stroke-dasharray: 4 3; }
svg.gsvg text.now-t { fill: var(--color-accent); font-weight: 700; }
.arrow-head { fill: color-mix(in srgb, var(--color-muted) 70%, transparent); }
.arrow-head.cp { fill: var(--tl-critical); }
.arrow-head.blk { fill: var(--tl-blocked); }

/* Rail */
.rail .overline { display: flex; align-items: center; gap: 6px; }
.finds { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.find { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 6px; padding: 7px var(--space-2); background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); font-size: var(--text-sm); line-height: 1.4; cursor: pointer; text-align: left; color: var(--color-text); width: 100%; }
.find:hover { border-color: color-mix(in srgb, var(--color-accent) 50%, var(--color-border)); }
.find.sel { border-color: var(--color-accent); background: var(--color-accent-soft); }
.find .ic { width: 18px; height: 18px; display: grid; place-items: center; border-radius: var(--radius-xs); font-size: 11px; font-weight: 700; background: var(--color-surface-2); color: var(--color-muted); }
.find .ic.blocked { background: color-mix(in srgb, var(--tl-blocked) 18%, transparent); color: var(--tl-blocked); }
.find .ic.review_wait { background: color-mix(in srgb, var(--tl-review) 18%, transparent); color: var(--tl-review); }
.find .meta { display: flex; gap: 6px; align-items: center; margin-top: 3px; flex-wrap: wrap; }
.chip.cp { height: 16px; font-size: var(--text-2xs); background: transparent; box-shadow: inset 0 0 0 1.5px var(--tl-critical); }
.where { display: grid; gap: 4px; }
.where .split-bar { width: 100%; height: 10px; }
.where dl { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 3px 8px; margin: 0; font-size: var(--text-xs); align-items: center; }
.where dt { display: contents; }
.where dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; color: var(--color-muted); }
.card { display: grid; gap: var(--space-2); padding: var(--space-3); background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); }
.card.soon { border-style: dashed; background: transparent; color: var(--color-muted); font-size: var(--text-xs); }
.sel-h { display: flex; align-items: flex-start; gap: 6px; }
.sel-h b { font-size: var(--text-md); line-height: 1.3; }
.sel-h .ib { margin-left: auto; }
.facts { display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 4px 8px; margin: 0; font-size: var(--text-sm); }
.facts dt { color: var(--color-muted); font-size: var(--text-xs); padding-top: 1px; }
.facts dd { margin: 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
.periods { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; font-size: var(--text-xs); }
.periods li { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 6px; align-items: start; padding: 4px 0; border-top: 1px solid color-mix(in srgb, var(--color-border) 50%, transparent); }
.periods li:first-child { border-top: 0; }
.periods .sw { margin-top: 3px; }
.periods .h { font-variant-numeric: tabular-nums; color: var(--color-muted); white-space: nowrap; }
.periods .why { grid-column: 2 / -1; color: var(--color-text); }
.rel { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: var(--text-sm); }
.rel li { display: flex; align-items: center; gap: 6px; min-width: 0; }
.rel a { color: var(--color-text); text-decoration: none; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rel a:hover { color: var(--color-accent); text-decoration: underline; }
.rel .w { margin-left: auto; font-size: var(--text-xs); color: var(--color-muted); white-space: nowrap; }
.retro { padding: 6px var(--space-2); border-radius: var(--radius-sm); background: var(--paper-postit); color: #2b2510; font-size: var(--text-xs); line-height: 1.4; }
.retro b { display: block; font-size: var(--text-2xs); text-transform: uppercase; letter-spacing: .05em; color: var(--paper-postit-muted); }
.prc { display: flex; align-items: center; gap: 6px; padding: 6px var(--space-2); border: 1px solid var(--color-border); border-radius: var(--radius-sm); font-size: var(--text-sm); text-decoration: none; color: var(--color-text); }
.prc .num { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--color-muted); }
.ps { display: inline-flex; align-items: center; height: 18px; padding: 0 7px; border-radius: 999px; font-size: var(--text-2xs); font-weight: var(--weight-semibold); white-space: nowrap; margin-left: auto; }
.ps.merged { background: color-mix(in srgb, var(--color-purple) 22%, transparent); }
.ps.open { background: color-mix(in srgb, var(--color-ok) 20%, transparent); }
.btnrow { display: flex; gap: 6px; flex-wrap: wrap; }
.btn[aria-disabled="true"] { opacity: .5; cursor: default; }
.av.agent { background: var(--color-surface-2); color: var(--color-text); border: 1px solid var(--color-border); }

/* JSON for agents */
.json { margin: 0; padding: var(--space-3) var(--space-4); font: 12px/1.55 var(--font-mono); white-space: pre; tab-size: 2; color: var(--color-text); }
.json .k { color: var(--color-accent); }
.json .s { color: var(--color-ok); }
.json .n { color: var(--color-warn); }
.json .b { color: var(--color-purple); }
.call { margin: 0; padding: 8px 10px; border-radius: var(--radius-sm); background: var(--color-surface-2); font: 11.5px/1.5 var(--font-mono); white-space: pre-wrap; }
.maps { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: var(--text-xs); }
.maps li { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 6px; }
.maps code { font-size: 10.5px; }
</style>
</head>
<body>
<div id="appbar"></div>
<section class="fb-head" id="head" aria-label="Feature"></section>
<div class="kd-wrap" id="kd"></div>
<div class="toolbar" id="tools"></div>
<div class="split tl-split">
  <div class="scroll gantt" id="main"></div>
  <aside class="rail" id="rail" aria-label="What dragged it out"></aside>
</div>

<script>
(() => {
  const { people, esc, tIcon, av, toast } = SL;
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  document.getElementById('appbar').outerHTML = SL.appBar('backlogs');
  const KEY = TL.DATA[params.get('key')] ? params.get('key') : 'SHIP-99';
  const M = TL.build(KEY);
  const { H, day, when, dur } = TL;
  const ui = {
    group: ['people', 'tasks'].includes(params.get('group')) ? params.get('group') : 'stories',
    zoom: params.get('zoom') === 'days' ? 'days' : 'fit',
    deps: params.get('deps') !== 'off', cp: params.get('cp') !== 'off' && M.finished,
    sel: params.get('select'), view: params.get('view') === 'json' ? 'json' : 'chart',
  };
  const RH = 30, LEFT = 330, AXIS = 44, PADR = 96;
  document.documentElement.style.setProperty('--g-rh', RH + 'px');
  const byKey = Object.fromEntries([...M.bars, ...M.stories].map(b => [b.key, b]));
  const avH = p => (p === 'agent' ? '<span class="av agent" title="Claude Code (agent)">AI</span>' : p ? av(p) : '<span class="av none" title="Unassigned"></span>');
  const whoName = p => (p === 'agent' ? 'Claude Code <span class="chip agent" style="height:16px;font-size:var(--text-2xs)">Agent</span>' : p ? esc(people[p].name) : '<span class="muted">Unassigned</span>');
  const pct = (a, tot) => Math.round((a / tot) * 100);
  const KIND = { active: 'Active', in_review: 'In review', blocked: 'Blocked' };

  /* Header: identity and the numbers that frame the chart */
  function renderHead() {
    const tot = M.execution.task_hours, sum = tot.active + tot.in_review + tot.blocked;
    const lead = M.finished ? (M.key_dates[3].at - M.key_dates[0].at) / H : (M.now - M.key_dates[0].at) / H;
    const withHist = M.bars.filter(b => b.segments.length).length;
    $('head').innerHTML = `
      <a class="back" href="${KEY === 'SHIP-101' ? 'feature.html' : '#'}">← Back to ${KEY}</a>
      <div class="fb-title">${tIcon('feature')}<span class="key">${KEY}</span><h1>${esc(M.title)}</h1>${SL.st(M.state === 'Done' ? 'Closed' : 'Active').replace(/>(Closed|Active)</, `>${M.state}<`)}<span class="chip">${esc(M.epic)}</span>
        <span class="spacer"></span><span class="xs muted">${M.finished ? `Finished ${day(M.key_dates[3].at)}. Times are when work items changed and pull requests merged.` : `Still running. Open bars run to now, ${when(M.now)}.`}</span></div>
      <div class="fb-row">
        <div class="kpi"><div class="v">${Math.round(lead / 24)} <small>days</small></div><div class="l">Lead time, Added → ${M.finished ? 'Finished' : 'now'}</div></div>
        <div class="kpi"><div class="v">${M.execution.calendar_days} <small>days</small></div><div class="l">Execution${M.finished ? '' : ' so far'}</div></div>
        <div class="kpi"><div class="v">${withHist} <small>of ${M.bars.length} tasks</small></div><div class="l">${M.bars.some(b => b.state === 'not_started') ? `${M.bars.filter(b => b.state === 'not_started').length} not started` : 'with recorded history'}</div></div>
        <div class="kpi"><div class="split-bar" aria-hidden="true">${['active', 'in_review', 'blocked'].map(k => `<i class="${k}" style="width:${pct(tot[k], sum)}%"></i>`).join('')}</div>
          <div class="l">Task time: <b style="color:var(--color-text)">${pct(tot.in_review, sum)}% in review</b> · ${pct(tot.active, sum)}% active · ${pct(tot.blocked, sum)}% blocked</div></div>
      </div>`;
  }

  function renderTools() {
    const seg = (name, val, opts) => `<div class="seg" role="group" aria-label="${name}">${opts.map(([v, l]) => `<button type="button" data-${name}="${v}" aria-pressed="${val === v}">${l}</button>`).join('')}</div>`;
    $('tools').innerHTML = ui.view === 'json'
      ? `<span class="sm" style="font-weight:600">What agents get</span><span class="xs muted">The same view model as the chart, from <code>feature_timeline</code>. Times are UTC.</span><span class="spacer"></span>${seg('view', ui.view, [['chart', 'Chart'], ['json', 'JSON for agents']])}`
      : `<span class="xs muted">Group</span>${seg('group', ui.group, [['stories', 'Stories'], ['people', 'People'], ['tasks', 'Tasks']])}
      <span class="xs muted">Zoom</span>${seg('zoom', ui.zoom, [['fit', 'Fit'], ['days', 'Days']])}
      <span class="tsep"></span>
      <label class="chk"><input type="checkbox" id="deps"${ui.deps ? ' checked' : ''}>Dependencies</label>
      <label class="chk${M.finished ? '' : ' off'}" title="${M.finished ? 'The chain of tasks that set the finish date' : 'Shows once the Feature is Done'}"><input type="checkbox" id="cp"${ui.cp ? ' checked' : ''}${M.finished ? '' : ' disabled'}>Critical path</label>
      <span class="spacer"></span>
      <span class="lg"><span><i class="sw active"></i>Active</span><span><i class="sw in_review"></i>In review</span><span><i class="sw blocked"></i>Blocked</span>${M.finished ? '<span><i class="sw cp"></i>Critical path</span>' : ''}<span><i class="sw mark"></i>No start recorded</span></span>
      <span class="tsep"></span>${seg('view', ui.view, [['chart', 'Chart'], ['json', 'JSON for agents']])}`;
  }

  /* Rows for the left column and the chart, in the chosen grouping */
  function rows() {
    const tasksIn = keys => M.bars.filter(b => keys.includes(b.key)).sort((a, b) => (a.start ?? a.end ?? Infinity) - (b.start ?? b.end ?? Infinity));
    if (ui.group === 'tasks') return tasksIn(M.bars.map(b => b.key)).map(b => ({ kind: 'task', b }));
    if (ui.group === 'people') {
      const order = [...new Set(M.bars.filter(b => b.who).sort((a, b) => (a.start ?? a.end) - (b.start ?? b.end)).map(b => b.who))];
      return [...order.map(p => [{ kind: 'group', p }, ...tasksIn(M.bars.filter(b => b.who === p).map(b => b.key)).map(b => ({ kind: 'task', b }))]).flat(),
        ...(M.bars.some(b => !b.who) ? [{ kind: 'group', p: null }, ...tasksIn(M.bars.filter(b => !b.who).map(b => b.key)).map(b => ({ kind: 'task', b }))] : [])];
    }
    const stories = [...M.stories].sort((a, b) => (a.start ?? Infinity) - (b.start ?? Infinity));
    return [...stories.map(s => [{ kind: 'story', b: s }, ...tasksIn(s.tasks).map(b => ({ kind: 'task', b }))]).flat(),
      ...M.not_started.map(n => ({ kind: 'nots', b: n }))];
  }

  function leftRow(r) {
    const sel = r.b && r.b.key === ui.sel ? ' sel' : '';
    if (r.kind === 'group') return `<div class="g-row group"><div class="nm">${avH(r.p)}<span class="t">${r.p === 'agent' ? 'Claude Code (agent)' : r.p ? esc(people[r.p].name) : 'Unassigned'}</span></div><span></span><span class="took">${M.bars.filter(b => b.who === r.p).length === 1 ? '1 task' : M.bars.filter(b => b.who === r.p).length + ' tasks'}</span></div>`;
    if (r.kind === 'nots') return `<div class="g-row nots"><div class="nm">${tIcon(r.b.type)}<span class="key">${r.b.key}</span><span class="t">${esc(r.b.title)}</span></div><span></span><span class="took">Not started</span></div>`;
    const b = r.b, cp = ui.cp && b.on_critical_path;
    const took = b.inferred ? 'No start' : b.hours == null ? 'Not started' : dur(b.hours);
    return `<div class="g-row ${r.kind}${sel}" data-pick="${b.key}" title="${esc(b.title)}"><div class="nm">${tIcon(b.type)}<span class="key">${b.key}</span><span class="t">${esc(b.title)}</span>${cp ? '<span class="cpm" title="On the critical path"></span>' : ''}</div>${avH(b.who)}<span class="took${b.hours >= 72 ? ' long' : ''}${b.start != null && b.end == null ? ' open' : ''}"${b.start != null && b.end == null ? ' title="Still open: so far"' : ''}>${took}</span></div>`;
  }

  /* The chart */
  function renderChart() {
    const R = rows();
    const recorded = M.bars.filter(b => b.start != null || b.end != null);
    const first = Math.min(...recorded.map(b => b.start ?? b.end)), last = M.finished ? Math.max(...recorded.map(b => b.end ?? M.now)) : M.now;
    const DAY = 24 * H;
    const t0 = Math.floor(first / DAY) * DAY, t1 = Math.ceil((last + 2 * H) / DAY) * DAY;
    const days = Math.round((t1 - t0) / DAY);
    const avail = Math.max(360, $('main').clientWidth - LEFT - PADR - 4);
    const pxDay = ui.zoom === 'days' ? 84 : Math.max(16, avail / days);
    const W = Math.round(pxDay * days), x = ms => ((ms - t0) / DAY) * pxDay;
    const Hh = R.length * RH;
    const rowOf = Object.fromEntries(R.map((r, i) => [r.b?.key, i]).filter(([k]) => k));
    const yMid = k => rowOf[k] * RH + RH / 2;

    // Axis: sprint bands, then days (every day when there's room, Mondays otherwise), weekends shaded
    const SPR = [['Sprint 22', '21 Sep', '2 Oct'], ['Sprint 23', '5 Oct', '16 Oct'], ['Sprint 24', '19 Oct', '30 Oct']];
    const tt = s => { const [dd, mm] = s.split(' '); return Date.UTC(2026, { Sep: 8, Oct: 9 }[mm], +dd); };
    let axis = '';
    SPR.forEach(([n, a, b]) => { const xa = Math.max(0, x(tt(a))), xb = Math.min(W, x(tt(b) + DAY)); if (xb > xa + 4) axis += `<rect class="sprint-b" x="${xa + 1}" y="3" width="${xb - xa - 2}" height="15" rx="3"/><text class="sprint-t" x="${xa + 6}" y="14">${xb - xa > 60 ? n : n.replace('Sprint ', 'S')}</text>`; });
    let grid = '';
    for (let i = 0; i < days; i++) {
      const ms = t0 + i * DAY, dt = new Date(ms), dow = dt.getUTCDay();
      if (dow === 0 || dow === 6) { axis += `<rect class="wkend" x="${x(ms)}" y="20" width="${pxDay}" height="${AXIS - 20}"/>`; grid += `<rect class="wkend" x="${x(ms)}" y="0" width="${pxDay}" height="${Hh}"/>`; }
      if (pxDay >= 30 || dow === 1) {
        axis += `<text x="${x(ms) + 4}" y="37">${pxDay >= 30 ? `${'SMTWTFS'[dow]} ${dt.getUTCDate()}` : day(ms).slice(4)}</text>`;
        grid += `<line class="dayline" x1="${x(ms)}" x2="${x(ms)}" y1="0" y2="${Hh}"/>`;
      }
    }
    if (!M.finished) axis += `<text class="now-t" x="${x(M.now) - 12}" y="${AXIS - 4}" text-anchor="end">Now</text>`;

    // Rows, bars and brackets
    let body = R.map((r, i) => `${r.b && r.b.key === ui.sel ? `<rect class="rowsel" x="0" y="${i * RH}" width="${W}" height="${RH}"/>` : ''}<line class="rowline" x1="0" x2="${W}" y1="${(i + 1) * RH}" y2="${(i + 1) * RH}"/>`).join('');
    R.forEach((r, i) => {
      const y = i * RH;
      if (r.kind === 'story' && r.b.start != null) {
        const xa = x(r.b.start), xb = x(r.b.end ?? M.now);
        body += `<path class="bracket ${r.b.type}${r.b.end == null ? ' open' : ''}" d="M${xa} ${y + 21}V${y + 13}H${xb}V${y + 21}"/>`;
        body += `<text class="lbl" x="${xb + 6}" y="${y + 19}">${dur(r.b.hours)}${r.b.end == null ? ' so far' : ''}</text>`;
      }
      if (r.kind !== 'task') return;
      const b = r.b, cp = ui.cp && b.on_critical_path, dim = ui.cp && !b.on_critical_path ? ' dim' : '', sel = b.key === ui.sel ? ' sel' : '';
      if (b.inferred) {
        const cx = x(b.end), cy = y + RH / 2;
        body += `<g class="bar${dim}${sel}" data-pick="${b.key}"><title>${b.key} ${esc(b.title)}: closed ${when(b.end)}, no start recorded</title><path class="mark" d="M${cx} ${cy - 7}L${cx + 7} ${cy}L${cx} ${cy + 7}L${cx - 7} ${cy}Z"/>${sel ? `<circle class="halo" cx="${cx}" cy="${cy}" r="11"/>` : ''}</g><text class="lbl" x="${cx + 12}" y="${cy + 3.5}">Closed, no start recorded</text>`;
        return;
      }
      if (b.start == null) return;
      const xa = x(b.start), xb = x(b.end ?? M.now), by = y + 8, bh = RH - 16;
      body += `<g class="bar${dim}${sel}" data-pick="${b.key}"><title>${b.key} ${esc(b.title)}\n${b.segments.map(s => `${KIND[s.kind]} ${dur(s.hours)}${s.reason ? `: ${s.reason}` : ''}`).join('\n')}</title>
        ${b.segments.map(s => `<rect class="s ${s.kind}" x="${x(s.from)}" y="${by}" width="${Math.max(2, x(s.to) - x(s.from))}" height="${bh}"/>`).join('')}
        ${b.end == null ? `<path class="open" d="M${xb} ${by - 2}L${xb + 6} ${by + bh / 2}L${xb} ${by + bh + 2}Z"/>` : ''}
        ${cp ? `<rect class="outline" x="${xa - 1.5}" y="${by - 1.5}" width="${xb - xa + 3}" height="${bh + 3}" rx="2"/>` : ''}
        ${sel ? `<rect class="halo" x="${xa - 4}" y="${by - 4}" width="${xb - xa + 8}" height="${bh + 8}" rx="4"/>` : ''}</g>`;
      body += `<text class="lbl${cp ? ' cp' : ''}" x="${xb + (b.end == null ? 10 : 6)}" y="${y + RH / 2 + 3.5}">${dur(b.hours)}${b.pr ? ` · ${b.pr.split('/').pop().replace('storefront', '')}` : ''}</text>`;
    });

    // Dependencies: finish → start elbows; blocked part-way: dashed red into the end of the blocked period
    let edges = '';
    if (ui.deps) M.edges.forEach(e => {
      if (rowOf[e.from] == null || rowOf[e.to] == null) return;
      const a = byKey[e.from], b = byKey[e.to];
      if (a.end == null && e.kind === 'depends' && b.start == null) return;
      const cls = e.kind === 'blocked' ? 'blk' : ui.cp && e.on_critical_path ? 'cp' : '';
      const dim = ui.cp && !e.on_critical_path && e.kind !== 'blocked' ? ' dim' : '';
      const x1 = x(a.end ?? M.now), y1 = yMid(e.from), y2 = yMid(e.to);
      let x2;
      if (e.kind === 'blocked') { const blk = b.segments.find(s => s.kind === 'blocked'); x2 = x(blk.to); }
      else if (b.start == null) return;
      else x2 = x(b.start);
      const down = y2 > y1 ? 1 : -1, yEnd = e.kind === 'blocked' ? y2 + down * -7 : y2;
      const d = e.kind === 'blocked'
        ? `M${x1} ${y1}H${x1 + 6}V${y2 - down * 9}H${x2}V${yEnd}`
        : x2 >= x1 + 12 ? `M${x1} ${y1}H${x1 + 6}V${y2}H${x2 - 5}` : `M${x1} ${y1}H${x1 + 6}V${y2 - down * (RH / 2)}H${x2 - 10}V${y2}H${x2 - 5}`;
      const head = e.kind === 'blocked' ? `<path class="arrow-head blk" d="M${x2 - 4} ${yEnd - down * 5}L${x2 + 4} ${yEnd - down * 5}L${x2} ${yEnd}Z"/>` : `<path class="arrow-head ${cls}${dim}" d="M${x2 - 5} ${y2 - 4}L${x2} ${y2}L${x2 - 5} ${y2 + 4}Z"/>`;
      edges += `<path class="edge ${cls}${dim}" d="${d}"/>${head}`;
      if (e.kind === 'depends' && e.wait_hours >= 12 && x2 - x1 > 48) edges += `<text class="wait" x="${(x1 + 6 + x2) / 2}" y="${y2 - 5}" text-anchor="middle">${dur(e.wait_hours)} wait</text>`;
    });
    const now = M.finished ? '' : `<line class="nowline" x1="${x(M.now)}" x2="${x(M.now)}" y1="0" y2="${Hh}"/>`;

    $('main').innerHTML = `<div class="g" style="grid-template-columns:${LEFT}px ${W + PADR}px;width:${LEFT + W + PADR}px">
      <div class="g-corner" style="height:${AXIS}px"><span>${ui.group === 'people' ? 'Person · task' : ui.group === 'tasks' ? 'Task' : 'Story · task'}</span><span></span><span>Took</span></div>
      <svg class="gsvg g-axis" width="${W + PADR}" height="${AXIS}" aria-hidden="true">${axis}</svg>
      <div class="g-left">${R.map(leftRow).join('')}</div>
      <svg class="gsvg" width="${W + PADR}" height="${Hh}" role="img" aria-label="Gantt chart of ${KEY}'s execution">
        <defs><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="color-mix(in srgb, var(--tl-review) 22%, transparent)"/><rect width="2" height="5" fill="var(--tl-review)"/></pattern></defs>
        ${grid}${body}${edges}${now}</svg>
    </div>`;
    if (ui.sel && rowOf[ui.sel] != null) { const sc = $('main'), top = rowOf[ui.sel] * RH; if (top < sc.scrollTop || top > sc.scrollTop + sc.clientHeight - AXIS - RH) sc.scrollTop = Math.max(0, top - 120); }
    if (ui.sel && byKey[ui.sel]) { const sc = $('main'), b = byKey[ui.sel], bx = x(b.start ?? b.end ?? M.now); if (bx < sc.scrollLeft || bx > sc.scrollLeft + sc.clientWidth - LEFT - 160) sc.scrollLeft = Math.max(0, bx - 160); }
  }

  /* JSON view: the MCP response, highlighted */
  function renderJson() {
    const src = JSON.stringify(TL.toJson(M), null, 2);
    const hl = esc(src).replace(/(&quot;[^&]*?&quot;)(\s*:)?|\b(true|false|null)\b|(-?\d+(?:\.\d+)?)/g, (m, str, colon, b, n) =>
      str ? (colon ? `<span class="k">${str}</span>${colon}` : `<span class="s">${str}</span>`) : b ? `<span class="b">${b}</span>` : `<span class="n">${n}</span>`);
    $('main').innerHTML = `<pre class="json" aria-label="feature_timeline response for ${KEY}">${hl}</pre>`;
  }

  /* Rail: findings and where the time went; or the selected item */
  const svgI = d => `<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const ICON = {
    blocked: svgI('<path d="M4 2.5v7M8 2.5v7"/>'),
    review_wait: svgI('<circle cx="6" cy="6" r="4.2"/><path d="M6 3.6V6l1.6 1.2"/>'),
    waited_for_dependency: svgI('<path d="M1.5 6h8M7 3.5 9.5 6 7 8.5"/>'),
    idle: svgI('<circle cx="6" cy="6" r="4.2" stroke-dasharray="2 1.6"/>'),
    no_history: svgI('<path d="M4.3 4.4a1.8 1.8 0 1 1 2.6 1.6c-.6.3-.9.7-.9 1.3"/><path d="M6 9.4h0"/>'),
  };
  function railOverview() {
    const tot = M.execution.task_hours, sum = tot.active + tot.in_review + tot.blocked;
    const n = M.bars.filter(b => b.segments.length).length;
    return `
      <section><div class="overline">What dragged it out<span class="spacer"></span><span class="cnt" style="font-weight:400;text-transform:none;letter-spacing:0">${M.findings.length}</span></div>
        <p class="hint">Worked out from the chart: blocks, waits for review and dependencies, gaps with nothing in flight, items with no history.${M.finished ? ' Critical path first.' : ''}</p>
        <ul class="finds">${M.findings.map((f, i) => `<li><button type="button" class="find${f.item && f.item === ui.sel ? ' sel' : ''}" data-find="${i}"><span class="ic ${f.kind}">${ICON[f.kind]}</span><span>${esc(f.summary)}${f.on_critical_path && ui.cp ? '<span class="meta"><span class="chip cp">Critical path</span></span>' : ''}</span></button></li>`).join('')}</ul>
      </section>
      <section class="where"><div class="overline">Where task time went</div>
        <div class="split-bar">${['active', 'in_review', 'blocked'].map(k => `<i class="${k}" style="width:${pct(tot[k], sum)}%"></i>`).join('')}</div>
        <dl>${['active', 'in_review', 'blocked'].map(k => `<dt><i class="sw ${k}"></i><span>${KIND[k]}</span></dt><dd>${dur(tot[k])} · ${pct(tot[k], sum)}%</dd>`).join('')}</dl>
        <p class="hint" style="margin-top:2px">Summed over the ${n} tasks with recorded history. In review = pull request open and not merged yet.</p>
      </section>
      ${M.not_started.length || M.bars.some(b => b.state === 'not_started') ? `<section><div class="overline">Not started</div><ul class="rel">${[...M.bars.filter(b => b.state === 'not_started'), ...M.not_started].map(b => `<li>${tIcon(b.type)}<span class="key xs muted">${b.key}</span><a href="#">${esc(b.title)}</a></li>`).join('')}</ul></section>` : ''}
      <section><div class="card soon">Inside a task: the agent's run (traces, tool calls, time per step) links from each bar once agent traces exist (SHIP-1463).</div></section>`;
  }
  function railItem(k) {
    const b = byKey[k];
    if (!b) return railOverview();
    const isStory = b.type !== 'task', inE = M.edges.filter(e => e.to === k), outE = M.edges.filter(e => e.from === k);
    const finds = M.findings.filter(f => f.item === k || f.waited_on === k);
    const retros = M.retros[k] || [];
    const story = !isStory && byKey[b.parent];
    const endTxt = b.end == null ? (b.start == null ? '' : 'Still open') : `${when(b.end)} <span class="xs muted">${b.end_source === 'pr_merged' ? 'PR merged' : b.end_source === 'closed' ? 'Closed, no PR' : 'last task merged'}</span>`;
    const rel = (list, dir) => list.map(e => { const o = byKey[dir === 'in' ? e.from : e.to]; const w = e.kind === 'blocked' ? 'blocked it part-way' : e.wait_hours == null ? '' : e.wait_hours < 0 ? `started ${dur(-e.wait_hours)} before it merged` : `${dur(e.wait_hours)} wait`; return `<li>${tIcon(o.type)}<a href="#" data-pick="${o.key}"><span class="xs muted">${o.key}</span> ${esc(o.title)}</a><span class="w">${w}</span></li>`; }).join('');
    return `
      <section class="card">
        <div class="sel-h">${tIcon(b.type)}<div style="min-width:0"><span class="xs muted">${b.key}</span><br><b>${esc(b.title)}</b></div><button class="ib" type="button" data-close aria-label="Close">✕</button></div>
        <dl class="facts">
          <dt>${isStory ? 'Owner' : 'Assignee'}</dt><dd>${avH(b.who)}${whoName(b.who)}</dd>
          ${story ? `<dt>${story.type === 'bug' ? 'Bug' : 'Story'}</dt><dd><a href="#" data-pick="${story.key}">${story.key}</a> ${esc(story.title)}</dd>` : ''}
          <dt>Started</dt><dd>${b.start != null ? when(b.start) : '<span class="muted">Not recorded</span>'}</dd>
          <dt>Finished</dt><dd>${endTxt}</dd>
          <dt>Took</dt><dd><b>${b.hours != null ? dur(b.hours) : '—'}</b>${b.end == null && b.start != null ? '<span class="xs muted">so far</span>' : ''}${ui.cp && b.on_critical_path ? '<span class="chip cp">Critical path</span>' : ''}</dd>
        </dl>
        ${b.note ? `<div class="hint xs">${esc(b.note)}. ShipLean knows when it closed, not when work on it started, so it shows as a marker.</div>` : ''}
        ${!isStory && b.segments.length ? `<div class="split-bar" style="width:100%;margin:2px 0 0">${b.segments.map(s => `<i class="${s.kind}" style="width:${(s.hours / b.hours) * 100}%"></i>`).join('')}</div>
        <ul class="periods">${b.segments.map(s => `<li><i class="sw ${s.kind}"></i><span>${KIND[s.kind]} · ${when(s.from)} → ${s.to === M.now && b.end == null ? 'now' : when(s.to).replace(day(s.from) + ', ', '')}</span><span class="h">${dur(s.hours)}</span>${s.reason ? `<span class="why">${esc(s.reason)}</span>` : ''}</li>`).join('')}</ul>` : ''}
        ${isStory ? `<ul class="rel">${b.tasks.map(t => byKey[t]).map(t => `<li>${tIcon('task')}<a href="#" data-pick="${t.key}"><span class="xs muted">${t.key}</span> ${esc(t.title)}</a><span class="w">${t.hours != null ? dur(t.hours) : t.inferred ? 'no start' : 'not started'}</span></li>`).join('')}</ul><div class="hint xs">A story's bar runs from its first task starting to its last task merging.</div>` : ''}
        ${b.pr ? `<a class="prc" href="#"><span>⑂</span><span class="num">${b.pr.split('/').pop().replace('storefront', '')}</span><span>${esc(b.title)}</span><span class="ps ${b.end ? 'merged' : 'open'}">${b.end ? 'Merged' : 'Open'}</span></a>` : ''}
        <div class="btnrow"><a class="btn" href="${k === 'SHIP-171' ? 'work-item.html' : '#'}">Open ${k}</a><span class="btn ghost" aria-disabled="true" title="Comes with SHIP-1463 (agent traces)">Agent run · later</span></div>
      </section>
      ${inE.length ? `<section><div class="overline">Waited on</div><ul class="rel">${rel(inE, 'in')}</ul></section>` : ''}
      ${outE.length ? `<section><div class="overline">Held up</div><ul class="rel">${rel(outE, 'out')}</ul></section>` : ''}
      ${finds.length ? `<section><div class="overline">Findings</div><ul class="finds">${finds.map(f => `<li><div class="find" style="cursor:default"><span class="ic ${f.kind}">${ICON[f.kind]}</span><span>${esc(f.summary)}</span></div></li>`).join('')}</ul></section>` : ''}
      ${retros.length ? `<section><div class="overline">From its retrospective</div>${retros.map(([cat, txt, who]) => `<div class="retro"><b>${cat} · ${esc(people[who].name)}</b>${esc(txt)}</div>`).join('')}</section>` : ''}
      <section><button class="btn ghost" type="button" data-close style="justify-self:start">← All findings</button></section>`;
  }
  function railJson() {
    return `
      <section><div class="overline">The call</div><pre class="call">feature_timeline({ key: "${KEY}" })</pre>
        <p class="hint" style="margin-top:0">Read-only. Any project member's agent. One call returns the whole picture; there is nothing to page through.</p></section>
      <section><div class="overline">How the chart maps to it</div><ul class="maps">
        <li><span>Key dates strip</span><span><code>key_dates</code>, <code>gaps</code></span></li>
        <li><span>A bar</span><span><code>bars[]</code>: <code>start</code>, <code>end</code>, <code>end_source</code>, <code>segments</code></span></li>
        <li><span>Bar colours</span><span><code>segments[].kind</code>: active, in_review, blocked, with <code>reason</code></span></li>
        <li><span>A story's bracket</span><span><code>stories[]</code></span></li>
        <li><span>Arrows</span><span><code>edges[]</code> with <code>wait_hours</code></span></li>
        <li><span>Outlined bars</span><span><code>critical_path</code></span></li>
        <li><span>Diamond marker</span><span><code>inferred: true</code> and <code>note</code></span></li>
        <li><span>Rail findings</span><span><code>findings[]</code>, same sentences in <code>summary</code></span></li>
      </ul></section>
      <section><div class="card soon">Rule for every chart from now on: the screen and the MCP tool are built from one server view model, so a person and an agent can't see different numbers.</div></section>`;
  }
  function renderRail() { $('rail').innerHTML = ui.view === 'json' ? railJson() : ui.sel ? railItem(ui.sel) : railOverview(); }

  function render() {
    renderTools();
    if (ui.view === 'json') renderJson(); else renderChart();
    renderRail();
  }
  function pick(k) { ui.sel = ui.sel === k && !byKey[k] ? null : k; render(); }

  document.addEventListener('click', e => {
    const t = e.target;
    const g = t.closest('[data-group]'); if (g) { ui.group = g.dataset.group; render(); return; }
    const z = t.closest('[data-zoom]'); if (z) { ui.zoom = z.dataset.zoom; render(); return; }
    const v = t.closest('[data-view]'); if (v) { ui.view = v.dataset.view; render(); return; }
    const f = t.closest('[data-find]'); if (f) { const fd = M.findings[+f.dataset.find]; if (fd.item) pick(fd.item); else toast(fd.summary); return; }
    if (t.closest('[data-close]')) { ui.sel = null; render(); return; }
    const p = t.closest('[data-pick]'); if (p) { e.preventDefault(); pick(p.dataset.pick); }
  });
  document.addEventListener('change', e => {
    if (e.target.id === 'deps') { ui.deps = e.target.checked; render(); }
    if (e.target.id === 'cp') { ui.cp = e.target.checked; render(); }
  });
  addEventListener('keydown', e => { if (e.key === 'Escape' && ui.sel) { ui.sel = null; render(); } });
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (ui.view === 'chart' && ui.zoom === 'fit') renderChart(); }, 80); });

  renderHead();
  $('kd').innerHTML = TL.keyDatesHtml(M);
  requestAnimationFrame(render);
  SL.preview([
    { label: 'Finished Feature (SHIP-99)', run: () => { location.search = ''; } },
    { label: 'Still running (SHIP-101)', run: () => { location.search = '?key=SHIP-101'; } },
  ]);
})();
</script>
</body>
</html>
