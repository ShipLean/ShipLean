<!doctype html>

<title>ShipLean · Task changes (SHIP-1460 mock-up)</title>
<!--
  SHIP-1460 mock-up: the code a Task's or Bug's commits changed, inside ShipLean, with comments on lines. Desktop only;
  Tasks and Bugs only (D3). Commits from any repository the instance token can read (D4); diffs fetched on view and
  cached a day (D6); Viewed kept in the browser (D12). Decisions D1–D16 settled by Joel, 14 Nov 2026.
  Not built. Open directly in a browser. Uses ../tokens.css, shiplean.css and shared.js only; no build step.
  ?view=task       the Task page (SHIP-171) with its Changes section. &state=empty shows a Task with no commits and
                   the Add commit form. &item=bug shows a Bug (SHIP-153) with its own commits.
  ?view=review     (default) the Changes page, /p/SHIP/items/SHIP-171/changes. &state=
                   compose | commits | split | request | approve | outdated | noaccess
  Under 900px the Task page has no Changes section, and the Changes page shows one line saying it needs a wider screen.
  The Preview panel (bottom left) is a review aid; ?shot hides it, ?theme=light|dark forces a theme.
-->

<link rel="stylesheet" href="shiplean.css">

<div id="appbar"></div>
<div id="page" style="flex:1;min-height:0;display:flex;flex-direction:column"></div>

<script>
(() => {
  const { people, esc, av, tIcon, st, toast } = SL;
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const view = params.get('view') || 'review';
  const state = params.get('state') || '';
  const BUG = params.get('item') === 'bug';
  const crumbs = view === 'task' ? (BUG ? ['Backlogs', 'SHIP-153'] : ['Backlogs', 'SHIP-141', 'SHIP-171']) : ['Backlogs', 'SHIP-141', 'SHIP-171', 'Changes'];
  $('appbar').outerHTML = SL.appBar('backlogs')
    .replace(/<nav class="crumbs"[^]*?<\/nav>/, `<nav class="crumbs" aria-label="You are here"><span>SHIP</span>${crumbs.map((c, i) => `<span>›</span>${i === crumbs.length - 1 ? `<b>${c}</b>` : `<span>${c}</span>`}`).join('')}</nav>`);

  const agentAv = '<span class="agent" title="Claude Code (agent)">AI</span>';
  const bars = (a, d) => { const t = a + d || 1, n = 5, ga = Math.round(a / t * n), gd = Math.min(n - ga, Math.round(d / t * n)); return `<span class="bars" aria-hidden="true">${'<i class="a"></i>'.repeat(ga)}${'<i class="d"></i>'.repeat(gd)}${'<i></i>'.repeat(n - ga - gd)}</span>`; };

  /* ---------------- Sample data ---------------- */
  const REPO = 'acme/storefront';
  const commits = [
    { sha: '3f9c2a17e4b0d6c58a1f20e7b9d4c3a6f1e08b52', subj: 'SHIP-171: Card lookup returns brand, last four and expiry', when: 'Thu 22 Oct, 16:41', a: 105, d: 12 },
    { sha: 'a81d4e09c7f3b2165e0d9a4c8b7f1e3d2c6a5b90', subj: 'SHIP-171: 503 when the vault is down; retry once on 429', when: 'Thu 22 Oct, 17:05', a: 46, d: 8 },

        out.push(`<tr><td class="ln ${d ? 'dl-' : 'e'}" style="${d ? 'background:color-mix(in srgb,var(--color-danger) 18%,transparent)' : ''}">${d ? d[1] : ''}</td><td class="code ${d ? '' : 'e'}" style="${d ? 'background:color-mix(in srgb,var(--color-danger) 10%,transparent)' : ''}">${d ? hl(d[3], f.lang) || ' ' : ''}</td>
          <td class="ln ${a ? '' : 'e'}" style="${a ? 'background:color-mix(in srgb,var(--color-ok) 20%,transparent)' : ''}">${a ? a[2] : ''}</td><td class="code ${a ? '' : 'e'}" style="${a ? 'background:color-mix(in srgb,var(--color-ok) 11%,transparent)' : ''}">${a ? hl(a[3], f.lang) || ' ' : ''}</td></tr>`);
        if (a) threads.filter(th => th.file === fi && th.line === a[2] && !th.outdated).forEach(th => out.push(`<tr class="thr"><td colspan="4" style="padding-left:var(--space-3)">${threadHtml(th)}</td></tr>`));
      }
    }
    return out.join('');
  }
  function fileHtml(f, fi) {
    const dir = f.path.split('/').slice(0, -1).join('/') + '/', name = f.path.split('/').pop();
    const collapsed = f.viewed || !f.lines;
    const body = collapsed ? `<div class="collapsed-note">${f.viewed ? 'Viewed in this browser. Collapsed until it changes again.' : ''}</div>`
      : ui.mode === 'split' ? `<table class="dl sbs"><colgroup><col style="width:46px"><col style="width:calc(50% - 46px)"><col style="width:46px"><col style="width:calc(50% - 46px)"></colgroup>${splitRows(f, fi)}</table>`
      : `<table class="dl"><colgroup><col class="ln"><col class="ln"><col class="sg"><col></colgroup>${unifiedRows(f, fi)}</table>`;
    return `<section class="df${collapsed ? ' collapsed' : ''}" id="${f.id}" data-testid="diff-file">
      <header class="df-h"><button class="chev" type="button" aria-label="${collapsed ? 'Expand' : 'Collapse'}">${collapsed ? '▸' : '▾'}</button>
        <span class="fs ${f.st}">${f.st}</span><span class="path"><span>${esc(dir)}</span><b>${esc(name)}</b></span>
        <span class="plus">+${f.a}</span><span class="minus">−${f.d}</span>
        <span class="spacer"></span><a class="ext" href="#" title="Open this file at c27e8b5 on GitHub">GitHub ↗</a>
        <label class="check"><input type="checkbox" ${f.viewed ? 'checked' : ''} data-viewed="${fi}"> Viewed</label></header>
      ${collapsed ? '' : body}</section>`;
  }
  function treeHtml() {
    const rows = []; let lastDir = null;
    files.forEach((f, fi) => {
      const parts = f.path.split('/'), dir = parts.slice(0, -1).join('/');
      if (dir !== lastDir) { rows.push(`<div class="dir" style="--d:0">▾ ${esc(dir)}</div>`); lastDir = dir; }
      const n = threads.filter(t => t.file === fi && !t.resolved).length;
      rows.push(`<button class="file${f.viewed ? ' viewed' : ''}" type="button" data-go="${f.id}" style="--d:1"><span class="fs ${f.st}">${f.st}</span><span class="n">${esc(parts.at(-1))}</span>${n ? `<span class="cbub" title="${n} open">${n}</span>` : '<span></span>'}<span class="vtick">${f.viewed ? '✓' : ''}</span></button>`);
    });
    return `<div class="th"><span class="overline">Files</span><span class="cnt">${files.length}</span><span class="spacer"></span><span class="xs muted">${files.filter(f => f.viewed).length} viewed</span></div>${rows.join('')}`;
  }
  function railHtml() {
    const open = threads.filter(t => !t.resolved), list = ui.tab === 'open' ? open : threads;
    return `<div class="sec-h2"><span class="overline">Comments</span><span class="spacer"></span></div>
      <div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="${ui.tab === 'open'}" data-tab="open">Open (${open.length})</button><button class="tab" role="tab" aria-selected="${ui.tab === 'all'}" data-tab="all">All (${threads.length})</button></div>
      ${list.map(t => { const f = files[t.file], line = f.lines?.find(l => l[2] === t.line); return `<div class="ccard" data-jump="${t.id}" data-file="${f.id}">
        <div class="where"><span>${esc(f.path.split('/').pop())}:${t.line}</span><span class="spacer"></span>${t.outdated ? '<span class="pill warn">Outdated</span>' : t.resolved ? '<span class="pill ok">Resolved</span>' : ''}</div>
        <pre class="snip${t.outdated ? ' old' : ''}">${esc((t.oldText || (line ? line[3] : '')).trim())}</pre>
        <div class="mh">${av(t.msgs[0].who)}<b>${people[t.msgs[0].who].name}</b><span class="xs muted">${t.msgs[0].when.split(', ')[0]}</span>${t.msgs.length > 1 ? `<span class="xs muted">· ${t.msgs.length - 1} reply</span>` : ''}</div>
        <p>${esc(t.msgs[0].body)}</p>
        ${t.outdated ? '<span class="xs muted">The line changed in e5b1c90. Resolve it, or reply to keep it open.</span>' : ''}</div>`; }).join('')}
      <p class="rail-note">Comments stay in ShipLean, on SHIP-171. <b>Request changes</b> sends the open ones back with the task, so the next agent to pick it up gets them in its brief.</p>`;
  }
  function commitMenu() {
    if (!ui.menu) return '';
    const list = state === 'outdated' ? [...commits, newCommit] : commits;
    return `<div class="menu" role="listbox" aria-label="Commits">
      <div class="grp">Show</div>
      <button class="opt hi" type="button"><span class="tick">✓</span><span><b>All ${list.length}</b></span><span class="cs">Combined diff, ${list[0].sha.slice(0, 7)}^ … ${list.at(-1).sha.slice(0, 7)}</span><span><span class="plus">+214</span> <span class="minus">−61</span></span></button>
      <div class="grp">One commit</div>
      ${list.map(c => `<button class="opt" type="button"><span></span><span class="sha">${c.sha.slice(0, 7)}</span><span class="cs">${esc(c.subj.replace('SHIP-171: ', ''))}</span><span><span class="plus">+${c.a}</span> <span class="minus">−${c.d}</span></span></button>`).join('')}
      <div class="foot">These commits follow one another, so <b>All</b> is one diff. When another task's commits sit between them, <b>All</b> lists each commit's diff in turn instead.</div></div>`;
  }
  function reviewPage() {
    const open = threads.filter(t => !t.resolved).length;
    const list = state === 'outdated' ? [...commits, newCommit] : commits;
    const banner = state === 'outdated' ? `<div class="newbar"><b>1 new commit since you last looked in this browser</b> (e5b1c90, Fri 23 Oct, 09:12 by Claude Code). 1 file changed again, so it's no longer marked viewed; 1 comment is outdated.<span class="spacer"></span><button class="btn tiny" type="button">Show only what's new</button></div>` : '';
    const noaccess = state === 'noaccess';
    $('page').innerHTML = `
      <div class="narrow-note"><b>Changes need a wider screen.</b><span class="muted">Open SHIP-171's changes on a computer. On a phone the task shows without them.</span><a href="?view=task">← Back to SHIP-171</a></div>
      <section class="cv-head">
        <div class="wi-top"><a class="back" href="?view=task${params.has('theme') ? '&theme=' + params.get('theme') : ''}">← Back to SHIP-171</a><span class="spacer"></span><span class="xs muted">Task of ${tIcon('story')} SHIP-141 Pay with saved card · ${av('priya')} Priya Shah</span></div>
        <div class="cv-title">${tIcon('task')}<span class="mono sm">SHIP-171</span><h1>API: tokenised card lookup</h1>${st('In review')}</div>
        <div class="cv-bar">
          <span class="pick-wrap"><button class="btn" type="button" id="pick" aria-expanded="${ui.menu}">All ${list.length} commits ▾</button>${commitMenu()}</span>
          <span class="pill">github.com/${REPO}</span>
          <span class="sm muted">${files.length} files · <span class="plus">+214</span> <span class="minus">−61</span></span>
          <span class="sep"></span>
          <span class="seg" role="group" aria-label="Layout"><button type="button" data-mode="unified" aria-pressed="${ui.mode === 'unified'}">Unified</button><button type="button" data-mode="split" aria-pressed="${ui.mode === 'split'}">Split</button></span>
          <label class="check"><input type="checkbox"> Hide whitespace</label>
          <span class="spacer"></span>
          <span class="prog" title="Viewed is kept in this browser"><span class="track"><i style="width:${3 / 8 * 100}%"></i></span>3 / 8 viewed</span>
          <button class="btn" type="button" id="approve">Approve</button>
          <button class="btn primary" type="button" id="request" ${open ? '' : 'disabled'}>Request changes${open ? ` · ${open}` : ''}</button>
        </div>
      </section>
      ${banner}
      <div class="cv">
        <nav class="tree" aria-label="Changed files">${treeHtml()}</nav>
        <div class="diffs" id="diffs">${noaccess ? `<div class="callout warn noaccess"><b>ShipLean can't read github.com/${REPO}.</b>The instance's GitHub token was refused (401) when this page asked for the diff, so there's none to show. An instance admin replaces the token in Instance settings › Integrations; the diff loads on the next visit. A commit that no longer exists (squashed or force-pushed away) shows the same way, as <i>no longer on GitHub</i>. Each commit still opens on GitHub: ${commits.map(c => `<a class="sha" href="#">${c.sha.slice(0, 7)}</a>`).join(', ')}.</div>` : files.map(fileHtml).join('')}</div>
        <aside class="cmts" aria-label="Comments">${railHtml()}</aside>
      </div>
      ${state === 'request' ? requestDialog() : ''}${state === 'approve' ? approveDialog() : ''}`;
  }
  function requestDialog() {
    const open = threads.filter(t => !t.resolved);
    return `<div class="backdrop"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="rqT" style="width:min(620px,100%)">
      <header><div><h2 id="rqT">Send SHIP-171 back with ${open.length} comments</h2><span class="sm muted">It goes back to <b>New</b> and is unassigned, so the next agent or person who picks it up gets these comments in its brief and answers them when it reports.</span></div></header>
      <div class="body">
        ${open.map(t => `<label class="check" style="align-items:flex-start;color:var(--color-text);white-space:normal"><input type="checkbox" checked style="margin-top:3px"><span><span class="mono xs muted">${esc(files[t.file].path)}:${t.line}</span><br>${esc(t.msgs[0].body)}</span></label>`).join('')}
        <label style="display:grid;gap:4px" class="sm">Anything else for whoever picks it up <span class="muted xs">(optional, goes on the task as a comment)</span><textarea class="field" style="height:64px;padding:6px 8px">Fix both, then add a test for the expiry on the last day of the month.</textarea></label>
        <label class="check"><input type="checkbox"> Keep Priya Shah assigned and leave it Active</label>
      </div>
      <footer><span class="xs muted">The 1 resolved comment stays resolved.</span><span class="spacer"></span><button class="btn ghost" type="button" data-close>Cancel</button><button class="btn primary" type="button" data-close data-sent>Send back</button></footer>
    </div></div>`;
  }
  function approveDialog() {
    return `<div class="backdrop"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="apT" style="width:min(560px,100%)">
      <header><div><h2 id="apT">Approve and close SHIP-171?</h2><span class="sm muted">It moves from In review to <b>Closed</b>, and History records that you approved commits 3f9c2a1 … c27e8b5.</span></div></header>
      <div class="body"><div class="callout warn"><b>2 comments are still open.</b>They stay open on the task and show on its page. Request changes instead if they need doing.</div></div>
      <footer><span class="spacer"></span><button class="btn ghost" type="button" data-close>Cancel</button><button class="btn primary" type="button" data-close>Approve and close</button></footer>
    </div></div>`;
  }

  function render() { (view === 'task' ? taskPage : reviewPage)(); }
  render();

  document.addEventListener('click', e => {
    const t = e.target;
    const go = t.closest('[data-go]'); if (go) { $(go.dataset.go)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    const jump = t.closest('[data-jump]'); if (jump) { const el = $('th-' + jump.dataset.jump) || $(jump.dataset.file); el?.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
    const mode = t.closest('[data-mode]'); if (mode) { ui.mode = mode.dataset.mode; render(); return; }
    const tab = t.closest('[data-tab]'); if (tab) { ui.tab = tab.dataset.tab; render(); return; }
    if (t.id === 'pick') { ui.menu = !ui.menu; render(); return; }
    const add = t.closest('[data-add]'); if (add) { const [fi, n] = add.dataset.add.split(':').map(Number); ui.compose = { file: fi, line: n }; ui.sel = { file: fi, line: n }; render(); $('cmText')?.focus(); return; }
    if (t.closest('[data-cancel]')) { ui.compose = null; ui.sel = null; render(); return; }
    if (t.closest('[data-post]')) { const text = $('cmText').value.trim(); if (!text) return; threads.push({ id: 'n' + threads.length, file: ui.compose.file, line: ui.compose.line, sha: 'c27e8b5', resolved: false, msgs: [{ who: 'priya', when: 'Just now', body: text }] }); ui.compose = null; ui.sel = null; render(); toast('Comment added to SHIP-171'); return; }
    const res = t.closest('[data-resolve]'); if (res) { const th = threads.find(x => x.id === res.dataset.resolve); th.resolved = true; th.resolvedBy = 'priya'; render(); return; }
    if (t.id === 'request') { $('page').insertAdjacentHTML('beforeend', requestDialog()); return; }
    if (t.id === 'approve') { $('page').insertAdjacentHTML('beforeend', approveDialog()); return; }
    if (t.closest('[data-close]')) { const sent = t.closest('[data-sent]'); t.closest('.backdrop').remove(); if (sent) toast('SHIP-171 is back in <b>New</b>, unassigned, with 2 comments in its brief'); return; }
    if (ui.menu && !t.closest('.pick-wrap')) { ui.menu = false; render(); }
  });
  document.addEventListener('change', e => { const v = e.target.dataset.viewed; if (v !== undefined) { files[v].viewed = e.target.checked; render(); } });

  SL.preview([
    { label: 'Task page', run: () => { location.search = '?view=task'; } },
    { label: 'Changes', run: () => { location.search = '?view=review'; } },
    { label: 'Bug page', run: () => { location.search = '?view=task&item=bug'; } },
  ]);
})();
</script>
</body>
</html>
