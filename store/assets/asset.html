<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ShipLean store asset</title>
<link rel="stylesheet" href="../../design/tokens.css">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; font-family: Inter, system-ui, sans-serif; background: #fff; }
  html.clear, html.clear body { background: transparent; }
  svg { display: block; }

  /* Screenshots */
  .shot { position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; }
  .shot.brand { background: linear-gradient(160deg, #16a089 0%, #2563c9 70%); color: #fff; }
  .shot.soft { background: #e8eef7; color: #1c2638; }
  .shot .cap { box-sizing: border-box; width: 100%; display: flex; flex-direction: column; justify-content: center; text-align: center; flex: none; }
  .shot h1 { margin: 0; font-weight: 700; letter-spacing: -0.02em; line-height: 1.08; text-wrap: balance; }
  .shot p { margin: 0.5em 0 0; font-weight: 500; line-height: 1.3; opacity: .88; text-wrap: balance; }
  .shot.soft p { color: #52627c; opacity: 1; }
  .screen { position: relative; overflow: hidden; flex: none; background: #f7f9fd;
    box-shadow: 0 30px 80px -20px rgb(6 25 42 / .45), 0 0 0 1px rgb(255 255 255 / .25); }
  .shot.soft .screen { box-shadow: 0 30px 80px -24px rgb(16 24 40 / .35), 0 0 0 1px #cdd9ea; }
  .screen iframe { border: 0; display: block; transform-origin: 0 0; position: absolute; left: 0; top: 0; }

  /* Feature graphic */
  .feature { position: relative; overflow: hidden; background: linear-gradient(120deg, #16a089 0%, #2563c9 75%); color: #fff; }
  .feature .brand { position: absolute; left: 64px; top: 92px; display: flex; align-items: center; gap: 18px; font-size: 44px; font-weight: 700; letter-spacing: -0.01em; }
  .feature h1 { position: absolute; left: 64px; top: 205px; width: 520px; margin: 0; font-size: 54px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em; }
  .feature p { position: absolute; left: 64px; top: 342px; width: 470px; margin: 0; font-size: 24px; line-height: 1.3; font-weight: 500; opacity: .9; }
  .screen.fg { position: absolute; box-shadow: 0 24px 60px -16px rgb(6 25 42 / .5); }
</style>
</head>
<body>
<script src="assets.js"></script>
</body>
</html>
